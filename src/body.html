<!-- ========================= PANTALLA DE ACCESO ========================= -->
<div id="pantallaAuth">
  <div class="auth-card">
    <div class="auth-logo">
      <img id="logoAuth" alt="AFAAR" style="width:86px;height:86px;object-fit:contain">
      <div class="marca">AFAAR</div>
      <div class="sub">Asociación Fueguina de Anestesia,<br>Analgesia y Reanimación</div>
    </div>

    <div class="auth-tabs">
      <button data-tab="ingresar" class="on">Ingresar</button>
      <button data-tab="registro">Registrarme</button>
      <button data-tab="coordinador">Coordinador</button>
      <button data-tab="contable">Contable</button>
    </div>

    <div id="authCuerpo"></div>

    <svg class="ecg-line" viewBox="0 0 400 22" preserveAspectRatio="none" style="margin-top:16px">
      <path d="M0 11h70l6-8 5 16 6-8h58l6-8 5 16 6-8h58l6-8 5 16 6-8h58l6-8 5 16 6-8h84"/>
    </svg>
  </div>
</div>

<!-- ============================== APLICACIÓN ============================== -->
<div id="app">
  <header class="topbar">
    <div class="topbar-in">
      <img id="logoTopbar" alt="" class="logo-topbar">
      <div style="min-width:0">
        <div class="marca">AFAAR</div>
        <div class="ctx" id="tbCtx"></div>
      </div>
      <div class="spacer"></div>
      <button class="chip-nube" id="chipNube" title="Estado de la sincronización">
        <span class="dot"></span><span id="chipNubeTxt">Local</span>
      </button>
      <button class="icon-btn" id="btnAvisos" title="Avisos y recordatorios">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.7 21a2 2 0 0 1-3.4 0"/>
        </svg>
        <span class="badge-tb oculto" id="badgeAvisos">0</span>
      </button>
      <button class="icon-btn" id="btnTema" title="Cambiar tema"></button>
      <button class="icon-btn" id="btnSalir" title="Cerrar sesión">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar"></nav>
    <main>
      <section class="vista on" id="vPanel"></section>
      <section class="vista" id="vPacientes"></section>
      <section class="vista" id="vFichas"></section>
      <section class="vista" id="vFicha"></section>
      <section class="vista" id="vStats"></section>
      <section class="vista" id="vFacturacion"></section>
      <section class="vista" id="vGuias"></section>
      <section class="vista" id="vManual"></section>
      <section class="vista" id="vCoordinador"></section>
      <section class="vista" id="vContable"></section>
      <section class="vista" id="vEnvValoracion"></section>
      <section class="vista" id="vEnvFicha"></section>
      <section class="vista" id="vMensajes"></section>
      <section class="vista" id="vPerfil"></section>
    </main>
  </div>

  <nav class="navbar" id="navbar"></nav>
</div>

<!-- ===================== PORTAL DEL PACIENTE =====================
     Se dibuja SOLO cuando la direccion trae #p=<token>, y en ese caso la
     pantalla de acceso y la aplicacion quedan ocultas: el paciente no ve la
     app, ve su ficha y nada mas. Ver paciente-portal.js -->
<div id="portalPaciente" style="display:none"></div>

<div class="modal" id="modal"></div>
<div id="toast"></div>
<div id="areaImpresion"></div>
