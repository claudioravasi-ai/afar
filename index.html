/* ------------------------------------------------- Helpers de formulario */
function campoTxt(id, lbl, val, ro){
  return '<div class="campo"><label>'+esc(lbl)+'</label><input type="text" id="'+id+'" value="'+
         esc(val||'')+'"'+(ro?' disabled':'')+'></div>';
}
function campoFecha(id, lbl, val){
  return '<div class="campo"><label>'+esc(lbl)+'</label><input type="date" id="'+id+'" value="'+esc(val||'')+'"></div>';
}
function campoNum(id, lbl, val, extra){
  return '<div class="campo"><label>'+esc(lbl)+'</label><input type="number" step="any" id="'+id+'" value="'+
         esc(val===undefined||val===null?'':val)+'" '+(extra||'')+'></div>';
}
function campoSel(id, lbl, ops, val){
  return '<div class="campo"><label>'+esc(lbl)+'</label><select id="'+id+'">'+
    ops.map(o => {
      const v = (typeof o === 'object') ? o.v : o, t = (typeof o === 'object') ? o.t : o;
      return '<option value="'+esc(v)+'"'+(String(val)===String(v)?' selected':'')+'>'+esc(t)+'</option>';
    }).join('')+'</select></div>';
}
/* Selector de mes y año con dos desplegables.
   Reemplaza a <input type="month">, que Safari en Mac no soporta: ahí el campo
   quedaba como una caja de texto vacía, sin ninguna opción. Además, para elegir
   un período de facturación dos listas son más rápidas que un calendario.
   El valor se lee con leerMesAnio(id) y devuelve 'AAAA-MM'. */
function campoMesAnio(id, lbl, val){
  const v = String(val || mesDe(hoyISO()));
  const anio = v.slice(0,4), mes = v.slice(5,7);
  const anios = aniosDisponibles();
  if(anio && anios.indexOf(Number(anio)) < 0) anios.push(Number(anio));
  anios.sort((a,b) => a - b);
  return '<div class="campo campo-mes"><label>'+esc(lbl)+'</label>'+
    '<div class="mes-anio">'+
      '<select id="'+id+'M">'+
        MESES_NOMBRES.map((n,i) => {
          const mm = String(i+1).padStart(2,'0');
          return '<option value="'+mm+'"'+(mm===mes?' selected':'')+'>'+esc(n)+'</option>';
        }).join('')+
      '</select>'+
      '<select id="'+id+'A">'+
        anios.map(a => '<option value="'+a+'"'+(String(a)===anio?' selected':'')+'>'+a+'</option>').join('')+
      '</select>'+
    '</div></div>';
}
function leerMesAnio(id){
  const m = $('#'+id+'M'), a = $('#'+id+'A');
  return (m && a) ? (a.value + '-' + m.value) : '';
}
function cablearMesAnio(id, alCambiar){
  ['M','A'].forEach(s => {
    const e = $('#'+id+s);
    if(e) e.onchange = () => alCambiar(leerMesAnio(id));
  });
}

function campoArea(id, lbl, val, ph){
  return '<div class="campo"><label>'+esc(lbl)+'</label><textarea id="'+id+'" placeholder="'+
         esc(ph||'')+'">'+esc(val||'')+'</textarea></div>';
}
function chksHTML(id, ops, sel){
  sel = sel || [];
  return '<div class="chks" id="'+id+'">'+ ops.map(o =>
    '<label class="chk'+(sel.indexOf(o)>=0?' sel':'')+'"><input type="checkbox" value="'+esc(o)+'"'+
    (sel.indexOf(o)>=0?' checked':'')+'>'+esc(o)+'</label>').join('') +'</div>';
}
function cablearChks(id){
  $$('#'+id+' .chk').forEach(l => {
    l.onclick = () => setTimeout(() => l.classList.toggle('sel', l.querySelector('input').checked), 0);
  });
}
function leerChks(id){ return $$('#'+id+' input:checked').map(i => i.value); }

  const palabras = q ? q.split(/\s+/) : [];

    ? todos.filter(p => {

    'para no duplicarlo.</div></div>' : '')+

  (l.length ? '<div class="lista">'+ l.map(p => {
      const fichas = fichasVisibles().filter(f => f.pacienteId === p.id);

          (fichas.length && mias < fichas.length
            ? '<div class="mini mt8">'+(mias||'ninguna')+' tuya'+(mias===1?'':'s')+'</div>' : '')+
        '</div></div>';
    }).join('') +'</div>'
    : '<div class="vacio">'+ico('pacientes')+'<b>'+(q?'Sin resultados':'Todavía no cargaste pacientes')+'</b>'+
      '<span>'+(q?'Probá con otro apellido o DNI.':'Tocá «Nuevo paciente» para empezar.')+'</span></div>');

  $('#btnNuevoPac').onclick = () => editarPaciente(null);
  $('#pacBuscar').oninput = debounce(e => { filtroPac = e.target.value; vistaPacientes();
    const i = $('#pacBuscar'); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length); } }, 260);
  $$('#vPacientes .item').forEach(it => {
    it.onclick = () => abrirPaciente(it.dataset.pac);
  });
}

/* ------------------------------------------------------- Alta / edicion */
function editarPaciente(id){
  const p = id ? DB.pacientes[id] : {};
  const os = obrasSociales();
  abrirModal(id ? 'Editar paciente' : 'Nuevo paciente',
    '<div class="grid c2">'+
      campoTxt('paApellido','Apellido *', p.apellido)+
      campoTxt('paNombre','Nombre *', p.nombre)+
    '</div>'+
    '<div class="grid c2">'+
      campoTxt('paDni','DNI *', p.dni)+
      campoFecha('paNac','Fecha de nacimiento', p.fechaNac)+
    '</div>'+
    '<div id="paAvisoDni"></div>'+
    '<div class="grid c3">'+
      campoSel('paSexo','Sexo', [{v:'F',t:'Femenino'},{v:'M',t:'Masculino'},{v:'X',t:'X / No binario'}], p.sexo)+
      campoNum('paPeso','Peso (kg)', p.peso, 'inputmode="decimal"')+
      campoNum('paTalla','Talla (cm)', p.talla, 'inputmode="decimal"')+
    '</div>'+
    '<div id="paIMC"></div>'+
    '<div class="grid c2">'+
      '<div class="campo"><label>Obra social / financiador</label><select id="paOS">'+
        '<option value="">— Seleccionar —</option>'+
        os.map(o => '<option'+(p.obraSocial===o?' selected':'')+'>'+esc(o)+'</option>').join('')+
      '</select></div>'+
      campoTxt('paAfiliado','N.º de afiliado', p.nroAfiliado)+
    '</div>'+
    '<div class="grid c2">'+
      campoTxt('paTel','Teléfono', p.telefono)+
      campoSel('paGrupo','Grupo y factor',
        ['','0+','0-','A+','A-','B+','B-','AB+','AB-'], p.grupoSanguineo)+
    '</div>'+
    '<div class="grid c2">'+
      campoTxt('paDom','Domicilio', p.domicilio)+
      campoSel('paLocalidad','Localidad',
        ['','Ushuaia','Río Grande','Tolhuin','Otra localidad de TDF','Fuera de la provincia'], p.localidad)+
    '</div>'+
    campoTxt('paEmergencia','Contacto de emergencia (nombre y teléfono)', p.contactoEmergencia)+
    campoArea('paObs','Observaciones generales', p.observaciones,
      'Datos relevantes que quieras tener a mano cada vez que abras este paciente'),
    '<button class="btn ghost" data-cerrar>Cancelar</button>'+
    '<button class="btn pri" id="paGuardar">'+ico('check')+' Guardar</button>');

  const recalc = () => {
    const imc = calcIMC($('#paPeso').value, $('#paTalla').value);
    $('#paIMC').innerHTML = imc ?
      '<div class="aviso info" style="margin-bottom:13px">'+ico('info')+
      '<div><b>IMC '+imc.toFixed(1)+' kg/m²</b> — '+clasificaIMC(imc)+
      ' · Superficie corporal '+superficieCorporal($('#paPeso').value,$('#paTalla').value).toFixed(2)+' m²</div></div>' : '';
  };
  $('#paPeso').oninput = recalc; $('#paTalla').oninput = recalc; recalc();

  const revisarDni = () => {
    const d = $('#paDni').value.trim();
    const ya = d ? lista('pacientes').find(x => x.id !== id && norm(x.dni) === norm(d)) : null;
    $('#paAvisoDni').innerHTML = ya
      ? '<div class="aviso warn">'+ico('alerta')+'<div><b>Ya hay un paciente con ese DNI:</b> '+
        esc(ya.apellido+', '+ya.nombre)+'.<br><button class="btn warn chico mt8" id="paIrExistente">'+
        'Abrir el que ya existe</button></div></div>'
      : '';
    if($('#paIrExistente')) $('#paIrExistente').onclick = () => {
      cerrarModal(); setTimeout(() => abrirPaciente(ya.id), 180);
    };
  };
  $('#paDni').oninput = debounce(revisarDni, 250);
  revisarDni();

  $('#paGuardar').onclick = () => {
    const g = i => $('#'+i).value.trim();
    if(!g('paApellido') || !g('paNombre')) return toast('Apellido y nombre son obligatorios.', 'err');
    if(!g('paDni')) return toast('El DNI es obligatorio.', 'err');
    const dup = lista('pacientes').find(x => x.id !== id && norm(x.dni) === norm(g('paDni')));
    if(dup && !id) return toast('Ya existe un paciente con ese DNI: '+dup.apellido+', '+dup.nombre, 'err');
    const nid = id || uid('pac');
    escribir('pacientes', nid, Object.assign({}, p, {
      id:nid, ownerUid: p.ownerUid || SESION.uid,
      apellido:g('paApellido'), nombre:g('paNombre'), dni:g('paDni'), fechaNac:g('paNac'),
      sexo:$('#paSexo').value, peso:g('paPeso'), talla:g('paTalla'),
      obraSocial:$('#paOS').value, nroAfiliado:g('paAfiliado'), telefono:g('paTel'),
      grupoSanguineo:$('#paGrupo').value, domicilio:g('paDom'), localidad:$('#paLocalidad').value,
      contactoEmergencia:g('paEmergencia'), observaciones:g('paObs'),
      creado: p.creado || new Date().toISOString(),
      modificado: new Date().toISOString(), modificadoPor: SESION.uid
    }));
    auditar(id?'paciente-editar':'paciente-alta', g('paApellido')+', '+g('paNombre'));
    cerrarModal();
    toast(id ? 'Paciente actualizado.' : 'Paciente creado.', 'ok');
    vistaPacientes();
    if(!id) setTimeout(() => abrirPaciente(nid), 200);
  };
}

/* -------------------------------------------------- Detalle de paciente */
function abrirPaciente(id){
  const p = DB.pacientes[id]; if(!p) return;
  const fichas = fichasVisibles().filter(f => f.pacienteId === id)
    .sort((a,b) => (b.fecha||'') < (a.fecha||'') ? -1 : 1);
  const ed = edadDe(p.fechaNac);
  const imc = calcIMC(p.peso, p.talla);

  const cuerpo = ''+
  '<div style="display:flex;gap:13px;align-items:center;margin-bottom:15px">'+
    '<div class="avatar" style="width:54px;height:54px;border-radius:15px;font-size:19px;display:grid;place-items:center;background:var(--azul-100);color:var(--azul-700);font-weight:800">'+
      esc(iniciales(p.nombre,p.apellido))+'</div>'+
    '<div><div style="font-size:17px;font-weight:750">'+esc(p.apellido)+', '+esc(p.nombre)+'</div>'+
    '<div class="mini">DNI '+esc(p.dni||'—')+(ed!==null?' · '+ed+' años':'')+
      (p.sexo?' · '+({F:'Femenino',M:'Masculino',X:'X'}[p.sexo]||''):'')+'</div></div>'+
  '</div>'+
  '<div class="grid c3 mb8">'+
    kpiMini('Peso', p.peso ? p.peso+' kg' : '—')+
    kpiMini('Talla', p.talla ? p.talla+' cm' : '—')+
    kpiMini('IMC', imc ? imc.toFixed(1) : '—')+
  '</div>'+
  '<div class="card plano" style="margin-bottom:12px">'+
    fila('Obra social', (p.obraSocial||'Sin cobertura') + (p.nroAfiliado ? ' — N.º '+p.nroAfiliado : ''))+
    fila('Grupo y factor', p.grupoSanguineo || '—')+
    fila('Teléfono', p.telefono || '—')+
    fila('Domicilio', [p.domicilio, p.localidad].filter(Boolean).join(', ') || '—')+
    fila('Contacto de emergencia', p.contactoEmergencia || '—')+
    (p.observaciones ? fila('Observaciones', p.observaciones) : '')+
    fila('Cargado por', nombreUsuario(p.ownerUid) +
      (p.modificadoPor && p.modificadoPor !== p.ownerUid
        ? ' · última edición: ' + nombreUsuario(p.modificadoPor) : ''))+
  '</div>'+
  '<h3 style="font-size:14px;margin:16px 0 9px">Fichas anestésicas ('+fichas.length+')</h3>'+
  (fichas.length ? '<div class="lista">'+ fichas.map(f =>
      '<div class="item" data-ficha="'+f.id+'">'+
        '<div class="avatar" style="background:'+(f.caracter==='urgencia'?'var(--danger-bg);color:var(--danger)':'var(--aqua-200);color:var(--aqua-600)')+'">'+
          ico('ficha')+'</div>'+
        '<div class="txt"><b>'+esc(f.cirugia||'Sin cirugía cargada')+'</b>'+
          '<span>'+fFecha(f.fecha)+' · '+esc(nombreInstitucion(f.institucion).split('"')[0].trim())+
          ' · '+esc(autorFicha(f))+(esAutorFicha(f)?' (vos)':'')+'</span></div>'+
        '<div class="der">'+etiquetaEstadoFicha(f)+'</div>'+
      '</div>').join('') +'</div>'
    : '<p class="mini">Todavía no hay fichas para este paciente.</p>');

  abrirModal('Paciente', cuerpo,
    '<button class="btn ghost" id="pdEditar">'+ico('editar')+' Editar</button>'+
    '<button class="btn pri" id="pdNuevaFicha">'+ico('mas')+' Nueva ficha</button>');

  $('#pdEditar').onclick = () => { cerrarModal(); setTimeout(() => editarPaciente(id), 180); };
  $('#pdNuevaFicha').onclick = () => { cerrarModal(); setTimeout(() => abrirFicha(null, id), 180); };
  $$('#modal .item[data-ficha]').forEach(it => {
    it.onclick = () => { const fid = it.dataset.ficha; cerrarModal(); setTimeout(() => abrirFicha(fid), 180); };
  });
}

function kpiMini(l, v){
  return '<div class="kpi"><div class="lbl">'+esc(l)+'</div><div class="val" style="font-size:19px">'+esc(v)+'</div></div>';
}
function fila(l, v){
  return '<div class="doc-par" style="display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--borde);font-size:13px">'+
    '<b style="min-width:135px;color:var(--texto-2);font-weight:650">'+esc(l)+'</b>'+
    '<span style="flex:1">'+esc(v)+'</span></div>';
}
function etiquetaEstadoFicha(f){
  if(f.estado === 'cerrada') return '<span class="tag ok">Cerrada</span>';
  if(f.estado === 'realizada') return '<span class="tag info">Realizada</span>';
  return '<span class="tag warn">Borrador</span>';
}

/* ============================== Cableado ============================== */
let dxSeleccionados = [], medSeleccionados = [];

function cablearValoracion(f){
  const v = f.v || {};
  dxSeleccionados = (v.cie10 || []).slice();
  medSeleccionados = (v.medicacion || []).slice();

  /* --- buscador CIE-10 --- */
  montarBuscador({
    input: $('#dxBuscar'), caja: $('#dxRes'), manual: true,
    fuente: () => todosCIE().map(x => ({
      cod:x.c, etiqueta:x.d, sub:x.cap, busca: norm(x.c+' '+x.d+' '+x.cap), dato:x })),
    onElegir: x => { if(!dxSeleccionados.some(d => d.c === x.dato.c && d.d === x.dato.d))
        dxSeleccionados.push({ c:x.dato.c, d:x.dato.d }); pintarDx(); },
    onManual: txt => {
      if(!txt) return;
      agregarExtra('cie', { c:'', d:txt });
      dxSeleccionados.push({ c:'—', d:txt, manual:true }); pintarDx();
      toast('Diagnóstico agregado al catálogo.', 'ok');
    }
  });
  pintarDx();

  /* --- buscador de fármacos --- */
  montarBuscador({
    input: $('#medBuscar'), caja: $('#medRes'), manual: true,
    fuente: () => FARMACOS_PERIOP.map(x => ({
      etiqueta:x.n, sub:x.g+' · '+({continuar:'Continuar',suspender:'Suspender',evaluar:'Evaluar'}[x.accion]),
      busca: norm(x.n+' '+x.g), dato:x })),
    onElegir: x => { if(!medSeleccionados.some(m => m.n === x.dato.n))
        medSeleccionados.push({ n:x.dato.n, g:x.dato.g, accion:x.dato.accion, nota:x.dato.nota, dosis:'' });
      pintarMed(); },
    onManual: txt => { if(!txt) return;
      medSeleccionados.push({ n:txt, g:'Otro', accion:'evaluar', nota:'', dosis:'' }); pintarMed(); }
  });
  pintarMed();

  /* --- checkboxes con estilo --- */
  Object.keys(ANTECEDENTES_SISTEMAS).forEach((s,i) => cablearChks('antSis'+i));
  ['antAnest','alerg','vaOtros','ayRiesgo','ayProfilaxis'].forEach(cablearChks);
  $$('#vFicha .chk').forEach(l => {
    l.onclick = () => setTimeout(() => l.classList.toggle('sel', l.querySelector('input').checked), 0);
  });

  /* --- alerta de hipertermia maligna --- */
  const revisarHM = () => {
    const marcado = $$('#antAnest input:checked').some(i => i.value.indexOf('Hipertermia maligna') >= 0);
    $('#alertaHM').style.display = marcado ? '' : 'none';
  };
  $('#antAnest').addEventListener('change', revisarHM); revisarHM();

  /* --- recalcular todo --- */
  const recalcular = () => {
    /* antropometría */
    const peso = val('exPeso'), talla = val('exTalla');
    const imc = calcIMC(peso, talla);
    const p = DB.pacientes[f.pacienteId] || {};
    const ed = edadDe(p.fechaNac, f.fecha);
    $('#exAntropo').innerHTML = imc ?
      '<div class="aviso info">'+ico('info')+'<div><b>IMC '+imc.toFixed(1)+'</b> — '+clasificaIMC(imc)+
      ' · SC '+superficieCorporal(peso,talla).toFixed(2)+' m²'+
      ' · Peso ideal '+(pesoIdeal(talla, p.sexo)||0).toFixed(1)+' kg</div></div>' : '';

    /* MET */
    const m = interpMET(val('mets'));
    $('#metsOut').innerHTML = '<div class="aviso '+(m.nivel==='bajo'?'ok':(m.nivel==='moderado'?'warn':'danger'))+'">'+
      ico('corazon')+'<div>'+m.texto+'</div></div>';

    /* vía aérea */
    const eg = calcElGanzouri({
      aperturaBucal: val('vaApertura'), tiromentoniana: val('vaTiro'),
      mallampati: val('vaMallampati'), cuelloMov: val('vaCuello'),
      protrusion: val('vaProtrusion'), peso: peso, intubacionPrevia: val('vaIntPrev')
    });
    $('#vaScore').innerHTML = tarjetaScore('Índice de El-Ganzouri (riesgo de vía aérea difícil)', eg);

    /* laboratorio */
    const lab = {};
    [['hb','labHb'],['hto','labHto'],['plaquetas','labPlaq'],['rin','labRIN'],['potasio','labK'],
     ['sodio','labNa'],['glucemia','labGlu'],['hba1c','labHba1c'],['creatinina','labCrea']]
      .forEach(([k,id]) => lab[k] = val(id));
    const al = alertasLaboratorio(lab);
    $('#labAlertas').innerHTML = al.map(a =>
      '<div class="aviso '+a[0]+'">'+ico(a[0]==='danger'?'alerta':'info')+'<div>'+esc(a[1])+'</div></div>').join('');
    const g = eGFR(val('labCrea'), ed, p.sexo);
    if($('#labEgfr')) $('#labEgfr').value = g ? Math.round(g)+' ml/min/1,73m² — '+estadioERC(g) : '—';

    /* ASA */
    const a = ASA_PS.find(x => x.v === val('scAsa'));
    $('#scAsaDesc').innerHTML = a ? '<b>'+esc(a.t)+'.</b> '+esc(a.d) : '';

    /* RCRI */
    const rc = {}; RCRI_ITEMS.forEach((it,i) => rc[it.k] = chk('rcri'+i));
    const rcri = calcRCRI(rc);
    $('#rcriOut').innerHTML = tarjetaScore('RCRI', rcri);

    /* ARISCAT */
    const ar = calcARISCAT({
      edad: ed, spo2: val('exSpo2'), hb: val('labHb'),
      infeccionRespiratoria: chk('arInf'), incision: val('arIncision'),
      duracion: val('arDuracion'), urgencia: (f.caracter && f.caracter !== 'programada')
    });
    $('#ariscatOut').innerHTML = tarjetaScore('ARISCAT', ar);

    /* STOP-BANG */
    const sbv = {}; STOPBANG_ITEMS.forEach(it => sbv[it.k] = chk('sb_'+it.k));
    const sb = calcSTOPBANG(sbv);
    $('#sbOut').innerHTML = tarjetaScore('STOP-BANG', sb);

    /* Apfel */
    const apv = {}; APFEL_ITEMS.forEach(it => apv[it.k] = chk('ap_'+it.k));
    const ap = calcApfel(apv);
    $('#apOut').innerHTML = tarjetaScore('Apfel', ap);

    /* Caprini */
    const capSel = $$('.cap:checked').map(i => Number(i.dataset.i));
    const cap = calcCaprini(capSel);
    $('#capOut').innerHTML = tarjetaScore('Caprini', cap);

    /* Ayuno */
    const tipo = val('ayTipo'), hora = val('ayHora');
    const reg = AYUNO_ASA.find(x => x.t === tipo);
    if(reg && hora){
      const [hh,mm] = hora.split(':').map(Number);
      const ahora = new Date();
      const ult = new Date(); ult.setHours(hh, mm, 0, 0);
      if(ult > ahora) ult.setDate(ult.getDate() - 1);
      const hrs = (ahora - ult) / 3600000;
      const ok = hrs >= reg.h;
      $('#ayOut').innerHTML = '<div class="aviso '+(ok?'ok':'warn')+'">'+ico('reloj')+
        '<div><b>'+hrs.toFixed(1)+' h de ayuno</b> — se requieren '+reg.h+' h para «'+esc(reg.t)+'». '+
        (ok ? 'Cumple el ayuno recomendado.' : 'AYUNO INSUFICIENTE: manejar como estómago ocupado o postergar.')+
        '<br><span class="mini">'+esc(reg.d)+'</span></div></div>';
    } else if(reg){
      $('#ayOut').innerHTML = '<div class="aviso info">'+ico('info')+'<div>Requiere '+reg.h+' h de ayuno. '+esc(reg.d)+'</div></div>';
    } else $('#ayOut').innerHTML = '';

    /* estudios sugeridos */
    const cond = {
      anticoagulado: medSeleccionados.some(m => /anticoagul|warfar|rivarox|apix|dabig|edox|heparin/i.test(m.n+m.g)),
      renal: !!val('labCrea') && Number(val('labCrea')) > 1.5,
      hta: dxSeleccionados.some(d => /hipertens/i.test(d.d)),
      diabetes: dxSeleccionados.some(d => /diabet/i.test(d.d)),
      cardiopatia: rc.cardiopatia || rc.icc,
      arritmia: dxSeleccionados.some(d => /arritm|fibrilaci/i.test(d.d)),
      respiratorio: dxSeleccionados.some(d => /asma|epoc|respirat|pulmon/i.test(d.d)),
      tabaquismo: val('habTabaco') === 'Fumador activo',
      hepatopatia: dxSeleccionados.some(d => /hepat|cirros/i.test(d.d)),
      sangrado: ar.nivel === 'alto',
      soplo: false, disnea: false,
      embarazoPosible: p.sexo === 'F' && ed !== null && ed >= 12 && ed <= 55
    };
    const riesgoCx = val('arIncision') === 'periferica' ? 'bajo' : (val('arIncision') === 'toracica' ? 'alto' : 'medio');
    $('#esSugeridos').innerHTML = '<div class="aviso info">'+ico('lista')+
      '<div><b>Estudios preoperatorios sugeridos</b><br>'+
      estudiosSugeridos(ed, val('scAsa'), riesgoCx, cond).map(esc).join(' · ')+'</div></div>';

    /* resumen final */
    const alto = [eg, rcri, ar, sb, cap].filter(x => x.nivel === 'alto');
    $('#resumenRiesgo').innerHTML =
      '<div class="grid c2 mb8">'+
        tarjetaScore('Vía aérea (El-Ganzouri)', eg)+
        tarjetaScore('Cardíaco (RCRI)', rcri)+
        tarjetaScore('Pulmonar (ARISCAT)', ar)+
        tarjetaScore('SAHOS (STOP-BANG)', sb)+
        tarjetaScore('NVPO (Apfel)', ap)+
        tarjetaScore('TEV (Caprini)', cap)+
      '</div>'+
      (alto.length ? '<div class="aviso danger">'+ico('alerta')+'<div><b>'+alto.length+
        ' dominio(s) en riesgo alto.</b> Revisá la fundamentación y las medidas de mitigación antes de emitir la aptitud.</div></div>'
      : '<div class="aviso ok">'+ico('check')+'<div>Ningún dominio evaluado alcanza el nivel de riesgo alto.</div></div>');
  };
  window.__recalcValoracion = recalcular;

  const cont = $('#fiCuerpo');
  cont.addEventListener('input', debounce(recalcular, 200));
  cont.addEventListener('change', recalcular);

  /* segmento de aptitud */
  $$('#segAptitud button').forEach(b => {
    b.onclick = () => { $$('#segAptitud button').forEach(x => x.classList.remove('on')); b.classList.add('on'); };
  });
  $('#scAsaEL').onclick = () => setTimeout(() =>
    $('#scAsaEL').classList.toggle('sel', $('#scAsaE').checked), 0);

  recalcular();
}

function pintarDx(){
  $('#dxSel').innerHTML = dxSeleccionados.map((d,i) =>
    '<span class="pill"><b>'+esc(d.c)+'</b><span>'+esc(d.d)+'</span>'+
    '<button data-dx="'+i+'">&times;</button></span>').join('') ||
    '<span class="mini">Sin diagnósticos cargados.</span>';
  $$('#dxSel button').forEach(b => b.onclick = () => {
    dxSeleccionados.splice(Number(b.dataset.dx), 1); pintarDx();
    if(window.__recalcValoracion) window.__recalcValoracion();
  });
}

function pintarMed(){
  const cont = $('#medLista');
  if(!medSeleccionados.length){
    cont.innerHTML = '<p class="mini">Sin medicación cargada.</p>'; return;
  }
  const color = { continuar:'ok', suspender:'danger', evaluar:'warn' };
  const txt = { continuar:'CONTINUAR', suspender:'SUSPENDER', evaluar:'EVALUAR' };
  cont.innerHTML = medSeleccionados.map((m,i) =>
    '<div class="card plano" style="border:1.5px solid var(--borde);padding:12px;margin-bottom:9px">'+
      '<div style="display:flex;align-items:center;gap:9px;margin-bottom:7px;flex-wrap:wrap">'+
        '<b style="flex:1;min-width:120px">'+esc(m.n)+'</b>'+
        '<span class="tag '+color[m.accion]+'">'+txt[m.accion]+'</span>'+
        '<button class="btn ghost chico" data-quitar="'+i+'">'+ico('borrar')+'</button>'+
      '</div>'+
      '<div class="grid c2">'+
        '<div class="campo" style="margin:0"><label>Dosis y frecuencia</label>'+
          '<input type="text" data-dosis="'+i+'" value="'+esc(m.dosis||'')+'" placeholder="Ej.: 10 mg/día"></div>'+
        '<div class="campo" style="margin:0"><label>Conducta</label><select data-accion="'+i+'">'+
          ['continuar','suspender','evaluar'].map(a =>
            '<option value="'+a+'"'+(m.accion===a?' selected':'')+'>'+txt[a]+'</option>').join('')+
        '</select></div>'+
      '</div>'+
      (m.nota ? '<div class="mini mt8" style="background:var(--bg-2);padding:8px 10px;border-radius:8px">'+esc(m.nota)+'</div>' : '')+
    '</div>').join('');
  $$('#medLista [data-quitar]').forEach(b => b.onclick = () => {
    medSeleccionados.splice(Number(b.dataset.quitar), 1); pintarMed(); });
  $$('#medLista [data-dosis]').forEach(i => i.oninput = () =>
    medSeleccionados[Number(i.dataset.dosis)].dosis = i.value);
  $$('#medLista [data-accion]').forEach(s => s.onchange = () => {
    medSeleccionados[Number(s.dataset.accion)].accion = s.value; pintarMed(); });
}

/* ============================ Lectura de datos ========================= */
function leerValoracion(){
  const antecedentes = {};
  Object.keys(ANTECEDENTES_SISTEMAS).forEach((s,i) => {
    const sel = leerChks('antSis'+i);
    if(sel.length) antecedentes[s] = sel;
  });
  const rcri = []; RCRI_ITEMS.forEach((it,i) => { if(chk('rcri'+i)) rcri.push(i); });
  const stopbang = {}; STOPBANG_ITEMS.forEach(it => stopbang[it.k] = chk('sb_'+it.k));
  const apfel = {}; APFEL_ITEMS.forEach(it => apfel[it.k] = chk('ap_'+it.k));
  const caprini = $$('.cap:checked').map(i => Number(i.dataset.i));
  const aptBtn = $('#segAptitud button.on');

  return {
    cie10: dxSeleccionados,
    antecedentes, antecedentesOtros: val('antOtros'),
    antAnestesicos: leerChks('antAnest'), antAnestDetalle: val('antAnestDet'),
    medicacion: medSeleccionados, medicacionOtros: val('medOtros'),
    alergias: leerChks('alerg'), alergiaDetalle: val('alergDet'),
    habitos: { tabaco: val('habTabaco'), tabacoCant: val('habTabacoCant'),
               alcohol: val('habAlcohol'), drogas: val('habDrogas') },
    examen: { ta:val('exTA'), fc:val('exFC'), fr:val('exFR'), spo2:val('exSpo2'), temp:val('exTemp'),
              peso:val('exPeso'), talla:val('exTalla'), cardio:val('exCardio'), respiratorio:val('exResp'),
              abdomen:val('exAbd'), neuro:val('exNeuro'), accesos:val('exAccesos'), columna:val('exColumna') },
    va: { mallampati:val('vaMallampati'), aperturaBucal:val('vaApertura'), tiromentoniana:val('vaTiro'),
          esternomentoniana:val('vaEsterno'), cuelloMov:val('vaCuello'), protrusion:val('vaProtrusion'),
          cuelloCirc:val('vaCuelloCirc'), denticion:val('vaDenticion'), intubacionPrevia:val('vaIntPrev'),
          cormackPrevia:val('vaCormack'), otros:leerChks('vaOtros'), plan:val('vaPlan') },
    lab: { hb:val('labHb'), hto:val('labHto'), plaquetas:val('labPlaq'), gb:val('labGB'), tp:val('labTP'),

/* =========================================================================
   FICHA ANESTESICA
   Un documento por acto anestesico: datos quirurgicos, valoracion
   prequirurgica, plan, consentimiento, registro intraoperatorio y honorarios.
   ========================================================================= */

let fichaActual = null;
let solapaFicha = 'qx';
let firmaPaciente = null, firmaAnest = null;
let cxSeleccionada = null, dxQxSeleccionado = null;

/* ============================ LISTADO ============================ */
let filtroFichas = { texto:'', caracter:'', institucion:'', estado:'', alcance:'mias' };

function vistaFichas(){
  const cont = $('#vFichas');
  const universo = esCoordinador() ? fichasVisibles()
    : (filtroFichas.alcance === 'mias'    ? misFichas()
     : filtroFichas.alcance === 'colegas' ? fichasVisibles().filter(f => !esAutorFicha(f))
     :                                      fichasVisibles());
  let l = universo.sort((a,b) => (b.fecha||'') + (b.hora||'') < (a.fecha||'') + (a.hora||'') ? -1 : 1);
  const q = norm(filtroFichas.texto);
  if(q) l = l.filter(f => {
    const p = DB.pacientes[f.pacienteId] || {};
    return norm([p.apellido,p.nombre,p.dni,f.cirugia,f.cirujano,autorFicha(f)].join(' ')).indexOf(q) >= 0;
  });
  if(filtroFichas.caracter)    l = l.filter(f => f.caracter === filtroFichas.caracter);
  if(filtroFichas.institucion) l = l.filter(f => f.institucion === filtroFichas.institucion);
  if(filtroFichas.estado)      l = l.filter(f => (f.estado||'borrador') === filtroFichas.estado);

  cont.innerHTML = ''+
  '<div class="vista-head"><div><h1>Fichas anestésicas</h1>'+
    '<p>'+l.length+' de '+universo.length+' fichas</p></div>'+
    '<div class="acciones"><button class="btn pri" id="btnNuevaFicha">'+ico('mas')+' Nueva ficha</button></div></div>'+

  (esCoordinador() ? '' :
    '<div class="seg mb8" id="fAlcance">'+
      [['mias','Mías'],['colegas','De colegas'],['todas','Todas']].map(a =>
        '<button type="button" data-v="'+a[0]+'"'+(filtroFichas.alcance===a[0]?' class="on"':'')+'>'+
        a[1]+'</button>').join('')+
    '</div>')+

  '<div class="filtros">'+
    '<div class="campo" style="flex:2"><label>Buscar</label>'+
      '<input type="search" id="fBuscar" placeholder="Paciente, DNI, cirugía o cirujano" value="'+esc(filtroFichas.texto)+'"></div>'+
    '<div class="campo"><label>Carácter</label><select id="fCaracter">'+
      '<option value="">Todos</option>'+
      ['programada','urgencia','emergencia'].map(c => '<option value="'+c+'"'+
        (filtroFichas.caracter===c?' selected':'')+'>'+c.charAt(0).toUpperCase()+c.slice(1)+'</option>').join('')+
    '</select></div>'+
    '<div class="campo"><label>Institución</label><select id="fInst">'+
      '<option value="">Todas</option>'+
      instituciones().map(i => '<option value="'+esc(i.id)+'"'+(filtroFichas.institucion===i.id?' selected':'')+'>'+
        esc(i.nombre.split('"')[0].trim())+'</option>').join('')+
    '</select></div>'+
    '<div class="campo"><label>Estado</label><select id="fEstado">'+
      '<option value="">Todos</option>'+
      [['borrador','Borrador'],['realizada','Realizada'],['cerrada','Cerrada']].map(e =>
        '<option value="'+e[0]+'"'+(filtroFichas.estado===e[0]?' selected':'')+'>'+e[1]+'</option>').join('')+
    '</select></div>'+
  '</div>'+

  (l.length ? '<div class="lista">'+ l.map(f => {
    const p = DB.pacientes[f.pacienteId] || {};
    return '<div class="item" data-f="'+f.id+'">'+
      '<div class="avatar" style="'+(f.caracter==='programada'
        ? 'background:var(--azul-100);color:var(--azul-700)'
        : 'background:var(--danger-bg);color:var(--danger)')+'">'+
        (f.caracter==='programada'?ico('calendario'):ico('alerta'))+'</div>'+
      '<div class="txt"><b>'+esc(p.apellido||'—')+', '+esc(p.nombre||'')+'</b>'+
        '<span>'+esc(f.cirugia||'Sin cirugía')+' · '+fFecha(f.fecha)+' · '+
        esc(nombreInstitucion(f.institucion).split('"')[0].trim())+
        (esAutorFicha(f) ? '' : ' · '+esc(autorFicha(f)))+'</span></div>'+
      '<div class="der">'+(esAutorFicha(f)?'':'<span class="tag info">de colega</span> ')+etiquetaEstadoFicha(f)+
        (f.hon && f.hon.total ? '<div class="mini mt8">'+fMoneda(f.hon.total)+'</div>' : '')+
      '</div></div>';
  }).join('') +'</div>'
  : '<div class="vacio">'+ico('ficha')+'<b>Sin fichas</b><span>Creá la primera desde «Nueva ficha».</span></div>');

  $('#btnNuevaFicha').onclick = () => abrirFicha(null);
  $('#fBuscar').oninput = debounce(e => { filtroFichas.texto = e.target.value; vistaFichas();
    const i = $('#fBuscar'); if(i){ i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 260);
  $$('#fAlcance button').forEach(b => b.onclick = () => {
    filtroFichas.alcance = b.dataset.v; vistaFichas(); });
  $('#fCaracter').onchange = e => { filtroFichas.caracter = e.target.value; vistaFichas(); };
  $('#fInst').onchange = e => { filtroFichas.institucion = e.target.value; vistaFichas(); };
  $('#fEstado').onchange = e => { filtroFichas.estado = e.target.value; vistaFichas(); };

/* ============================ EDITOR ============================ */
function abrirFicha(id, pacienteId){
  const nueva = !id;
  if(id && !DB.fichas[id]) return toast('No se encontró la ficha.', 'err');
  fichaActual = id ? JSON.parse(JSON.stringify(DB.fichas[id])) : {
    id: uid('fic'), ownerUid: SESION.uid, pacienteId: pacienteId || '',
    fecha: hoyISO(), hora: ahoraHora(), caracter:'programada',
    institucion:'', obraSocial:'', estado:'borrador',
    v:{}, plan:{}, acto:{}, hon:{}, consent:{},
    creado:new Date().toISOString()
  };
  if(pacienteId) fichaActual.pacienteId = pacienteId;
  solapaFicha = 'qx';
  cxSeleccionada = fichaActual.cirugia ? { n:fichaActual.cirugia, ua:fichaActual.cirugiaUA } : null;
  dxQxSeleccionado = fichaActual.dxQuirurgico || null;
  irA('ficha');
  pintarFicha();
  if(nueva) toast('Nueva ficha creada. Recordá guardarla.', 'ok');
}

function pintarFicha(){
  const f = fichaActual;
  const guardada = DB.fichas[f.id];
  const soloActo = !!guardada && !puedeEditarFicha(guardada);
  const p = DB.pacientes[f.pacienteId] || null;
  const cont = $('#vFicha');
  const solapas = [
    ['qx','bisturi','Quirúrgico'],
    ['val','valoracion','Valoración'],
    ['plan','lista','Plan'],
    ['acto','monitor','Acto'],
    ['hon','dinero','Honorarios']
  ];

  cont.innerHTML = ''+
  '<div class="vista-head no-print">'+
    '<button class="btn ghost chico" id="fiVolver">'+ico('atras')+' Fichas</button>'+
    '<div style="flex:1;min-width:150px"><h1 style="font-size:18px">'+
      (p ? esc(p.apellido+', '+p.nombre) : 'Ficha sin paciente')+'</h1>'+
      '<p>'+fFecha(f.fecha)+' · '+esc(nombreInstitucion(f.institucion).split('"')[0].trim())+
      ' · '+etiquetaEstadoFicha(f)+'</p></div>'+
  '</div>'+

  '<div class="scroll-x no-print mb8">'+ solapas.map(s =>
    '<span class="tag'+(solapaFicha===s[0]?' on':'')+'" data-solapa="'+s[0]+'">'+
    ico(s[1]).replace('<svg','<svg style="width:14px;height:14px;display:inline-block;vertical-align:-2px;margin-right:4px"')+
    s[2]+'</span>').join('') +'</div>'+

  (soloActo ? bannerFichaAjena(f) : bannerFaltantes(f))+

  '<div id="fiCuerpo"></div>'+

  '<div class="btn-row mt20 no-print">'+
    '<button class="btn pri grande" id="fiGuardar">'+ico('check')+' Guardar ficha</button>'+
    '<button class="btn ghost" id="fiWord">'+ico('word')+' Word</button>'+
    '<button class="btn ghost" id="fiPdf">'+ico('imprimir')+' PDF</button>'+
    (soloActo ? '' : '<button class="btn ghost" id="fiConsent">'+ico('firma')+' Consentimiento</button>')+
    (DB.fichas[f.id] && !soloActo ? '<button class="btn danger" id="fiBorrar">'+ico('borrar')+'</button>' : '')+
  '</div>';

  $('#fiVolver').onclick = () => { irA('fichas'); vistaFichas(); };
  $$('#vFicha [data-solapa]').forEach(t => t.onclick = () => {
    guardarSolapaActual(); solapaFicha = t.dataset.solapa; pintarFicha();
  });
  $('#fiGuardar').onclick = () => { guardarSolapaActual(); guardarFicha(); };
  $('#fiWord').onclick = () => { guardarSolapaActual(); exportarFichaWord(fichaActual); };
  $('#fiPdf').onclick  = () => { guardarSolapaActual(); imprimirFicha(fichaActual); };
  if($('#fiConsent')) $('#fiConsent').onclick = () => { guardarSolapaActual(); abrirConsentimiento(fichaActual); };
  if($('#fiTomarActo')) $('#fiTomarActo').onclick = () => confirmar('Tomar el acto anestésico',
    'Vas a quedar registrado como el anestesiólogo que realiza este acto. '+
    'El honorario del acto pasa a tu nombre; la consulta prequirúrgica sigue siendo de '+
    esc(autorFicha(fichaActual))+'.',
    () => {
      const base = JSON.parse(JSON.stringify(DB.fichas[fichaActual.id]));
      base.asignadoUid = SESION.uid;
      base.modificado = new Date().toISOString();
      escribir('fichas', base.id, base);
      auditar('ficha-tomar-acto', 'Acto de la ficha de ' + autorFicha(base));
      fichaActual = base; pintarFicha();
      toast('El acto quedó a tu nombre.', 'ok');
    }, 'Tomar el acto');
  if($('#fiBorrar')) $('#fiBorrar').onclick = () => confirmar('Eliminar ficha',
    'Se elimina de forma permanente en todos los dispositivos. Esta acción no se puede deshacer.',
    () => { eliminar('fichas', f.id); auditar('ficha-borrar', f.id);
            toast('Ficha eliminada.', 'ok'); irA('fichas'); vistaFichas(); }, 'Eliminar', true);

  const cuerpo = $('#fiCuerpo');
  if(solapaFicha === 'qx')        { cuerpo.innerHTML = htmlQuirurgico(f);  cablearQuirurgico(f); }
  else if(solapaFicha === 'val')  { cuerpo.innerHTML = htmlValoracion(f);  cablearValoracion(f); }
  else if(solapaFicha === 'plan') { cuerpo.innerHTML = htmlPlan(f);        cablearGenerico(); }
  else if(solapaFicha === 'acto') { cuerpo.innerHTML = htmlActo(f);        cablearActo(f); }
  else                            { cuerpo.innerHTML = htmlHonorarios(f);  cablearHonorarios(f); }

  /* Un colega puede tocar el acto siempre, y los honorarios del acto sólo si
     el acto está a su nombre. El resto queda en lectura. */
  const editable = !soloActo
    || solapaFicha === 'acto'
    || (solapaFicha === 'hon' && esActorFicha(guardada));
  if(!editable) bloquearCuerpo();
}

/* Deja la solapa en modo lectura: se ve todo, no se cambia nada */
function bloquearCuerpo(){
  $$('#fiCuerpo input, #fiCuerpo select, #fiCuerpo textarea').forEach(e => { e.disabled = true; });
  $$('#fiCuerpo button').forEach(e => { e.disabled = true; e.style.opacity = '.5'; });
  $$('#fiCuerpo .buscador').forEach(e => { e.style.opacity = '.55'; });
  $$('#fiCuerpo .chk, #fiCuerpo .seg').forEach(e => { e.style.pointerEvents = 'none'; });
}

function bannerFichaAjena(f){
  const a = autorFicha(f);
  const mio = esActorFicha(f);
  return '<div class="aviso '+(mio?'ok':'info')+' no-print">'+ico(mio?'jeringa':'candado')+
    '<div><b>Valoración prequirúrgica de '+esc(a)+'.</b><br>'+
    (mio
      ? 'El acto anestésico está a tu nombre: podés completarlo y cargar <b>tus honorarios del acto</b>. '
      : 'Podés leerla completa y registrar el acto anestésico si sos vos quien opera. ')+
    'La valoración, el plan y la consulta prequirúrgica son de '+esc(a)+' y quedan bloqueados.'+
    (f.actoPorUid && f.actoPorUid !== f.ownerUid
      ? '<br>Acto registrado por <b>'+esc(nombreUsuario(f.actoPorUid))+'</b>.' : '')+
    (mio ? '' : '<br><button class="btn ghost chico mt8" id="fiTomarActo">'+
      'Voy a realizar este acto</button>')+
    '</div></div>';
}

function guardarSolapaActual(){
  const f = fichaActual;
  const guardada = DB.fichas[f.id];
  if(guardada && !puedeEditarFicha(guardada)){
    if(solapaFicha === 'acto') f.acto = leerActo();
    if(solapaFicha === 'hon' && esActorFicha(guardada)) f.hon = leerHonorarios();
    return;                                   /* lo demás no se toca */
  }
  if(solapaFicha === 'qx')        Object.assign(f, leerQuirurgico());
  else if(solapaFicha === 'val')  f.v = leerValoracion();
  else if(solapaFicha === 'plan') f.plan = leerPlan();
  else if(solapaFicha === 'acto') f.acto = leerActo();
  else{ f.hon = leerHonorarios(); f.honConsulta = leerHonorariosConsulta(); }
}

function guardarFicha(){
  const f = fichaActual;
  const guardada = DB.fichas[f.id];

  /* Ficha de un colega: se escribe únicamente el acto anestésico, sobre la
     versión vigente en la base, para no pisar nada de lo que él cargó. */
  if(guardada && !puedeEditarFicha(guardada)){
    const base = JSON.parse(JSON.stringify(guardada));
    base.acto = f.acto || {};
    if(esActorFicha(guardada) && f.hon) base.hon = f.hon;   /* su propio honorario */
    base.actoPorUid = SESION.uid;
    base.actoPorNombre = USUARIO ? (USUARIO.apellido + ', ' + USUARIO.nombre) : '';
    base.modificado = new Date().toISOString();
    base.modificadoPor = SESION.uid;
    base.modificadoPorNombre = base.actoPorNombre;
    escribir('fichas', base.id, base);
    auditar('ficha-acto-colega',
      'Acto anestésico registrado en la ficha de ' + autorFicha(guardada));
    fichaActual = base;
    toast('Acto anestésico guardado' + (nubeOK ? ' y sincronizado.' : '.'), 'ok');
    pintarFicha();
    return;
  }

  if(!f.pacienteId) return toast('Seleccioná un paciente en la solapa Quirúrgico.', 'err');
  f.modificado = new Date().toISOString();
  f.modificadoPor = SESION.uid;
  f.modificadoPorNombre = USUARIO ? (USUARIO.apellido + ', ' + USUARIO.nombre) : '';
  escribir('fichas', f.id, f);
  auditar('ficha-guardar', (DB.pacientes[f.pacienteId]||{}).apellido + ' — ' + (f.cirugia||''));
  toast('Ficha guardada' + (nubeOK ? ' y sincronizada.' : ' en este dispositivo.'), 'ok');
  pintarFicha();
}

          'Usar «'+esc(par[0])+'»</button></div></div>'

        cerrarModal(); guardarSolapaActual(); fichaActual.obraSocial = sugerido; pintarFicha();
        toast('Se usó el financiador que ya existía.', 'ok');
      };
    };
    $('#noNombre').oninput = debounce(revisar, 250);

        cxSeleccionada = { n, ua:Number($('#ncUA').value)||10 };
        cerrarModal(); pintarCx(); toast('Procedimiento agregado al catálogo.', 'ok');
      };
    }
  });
  pintarCx();

  /* buscador de diagnóstico quirúrgico */
  const pintarDq = () => {
    $('#dqSel').innerHTML = dxQxSeleccionado

        '<button id="dqQuitar">&times;</button></span>'

    if($('#dqQuitar')) $('#dqQuitar').onclick = () => { dxQxSeleccionado = null; pintarDq(); };
  };
  montarBuscador({
    input:$('#dqBuscar'), caja:$('#dqRes'), manual:true,
    fuente: () => todosCIE().map(x => ({ cod:x.c, etiqueta:x.d, sub:x.cap,
      busca: norm(x.c+' '+x.d+' '+x.cap), dato:x })),
    onElegir: x => { dxQxSeleccionado = { c:x.dato.c, d:x.dato.d }; pintarDq(); },
    onManual: txt => { if(!txt) return; agregarExtra('cie', { c:'', d:txt });
      dxQxSeleccionado = { c:'—', d:txt }; pintarDq(); }
  });
  pintarDq();
}

function cablearActo(f){
  cablearGenerico();
  const recalc = () => {
    const i = val('acIniAnest'), fin = val('acFinAnest');
    if(i && fin){
      const [h1,m1] = i.split(':').map(Number), [h2,m2] = fin.split(':').map(Number);
      let min = (h2*60+m2) - (h1*60+m1); if(min < 0) min += 1440;
      $('#acDuracion').innerHTML = '<div class="aviso info">'+ico('reloj')+
        '<div><b>Duración anestésica: '+Math.floor(min/60)+' h '+(min%60)+' min</b> ('+min+' minutos)'+
        (min > 120 ? ' — corresponde adicional por prolongación en el nomenclador.' : '')+'</div></div>';
    } else $('#acDuracion').innerHTML = '';
    const total = ALDRETE.reduce((acc,it) => acc + Number(val('ald_'+it.k) || 0), 0);
    const ok = total >= 9;
    $('#aldOut').innerHTML = '<div class="aviso '+(ok?'ok':'warn')+'">'+ico(ok?'check':'alerta')+
      '<div><b>Aldrete '+total+'/10</b> — '+(ok
        ? 'Cumple criterios de alta de la recuperación postanestésica.'
        : 'No alcanza el puntaje de alta (≥ 9). Continuar la vigilancia en la URPA.')+'</div></div>';
  };
  $('#fiCuerpo').addEventListener('change', recalc);
  $('#fiCuerpo').addEventListener('input', debounce(recalc, 250));
  recalc();
}

function cablearHonorarios(f){
  cablearGenerico();
  /* La consulta la edita quien hizo la valoración; el acto, quien opera. */
  const puedeConsulta = esAutorFicha(f) || esCoordinador();
  const puedeActoHon  = esActorFicha(f) || esCoordinador();
  if(!puedeConsulta) ['hcModalidad','hcMonto','hcEstado','hcFecha','hcComprobante','hcCobrado']
    .forEach(i => { const e = $('#'+i); if(e) e.disabled = true; });
  if(!puedeActoHon){
    ['hoModalidad','hoUA','hoVU','hoMontoFijo','hoEstado','hoFecha','hoComprobante',
     'hoCobrado','hoObs'].forEach(i => { const e = $('#'+i); if(e) e.disabled = true; });
    $$('#hoAdic input').forEach(e => { e.disabled = true; });
    const a = $('#hoAdic'); if(a) a.style.pointerEvents = 'none';
  }
  const recalc = () => {
    const mod = val('hoModalidad');
    const m = MODALIDADES_HONORARIOS.find(x => x.id === mod);
    $('#hoModDesc').textContent = m ? m.d : '';
    const porUnidades = mod === 'abierto';
    const fijo = (mod === 'cerrado' || mod === 'particular');
    $('#hoAbierto').style.display = porUnidades ? '' : 'none';
    $('#hoFijo').style.display    = fijo ? '' : 'none';

    let total = 0, detalle = '';
    if(porUnidades){
      const ua = Number(val('hoUA')) || 0, vu = Number(val('hoVU')) || 0;
      const base = ua * vu;
      const sel = $$('#hoAdic input:checked').map(i => i.value);
      const pct = sel.reduce((a,id) => a + (ADICIONALES_HONORARIOS.find(x => x.id === id) || {pct:0}).pct, 0);
      total = base * (1 + pct/100);
      detalle = '<table><tbody>'+
        '<tr><td>Base: '+ua+' UA × '+fMoneda(vu)+'</td><td class="num">'+fMoneda(base)+'</td></tr>'+
        sel.map(id => { const a = ADICIONALES_HONORARIOS.find(x => x.id === id);
          return '<tr><td>'+esc(a.n)+' (+'+a.pct+' %)</td><td class="num">'+fMoneda(base*a.pct/100)+'</td></tr>'; }).join('')+
        '<tr style="font-weight:800"><td>TOTAL</td><td class="num">'+fMoneda(total)+'</td></tr>'+
      '</tbody></table>';
      $('#hoCalculo').innerHTML = '<div class="tabla-wrap">'+detalle+'</div>'+
        (vu === 0 ? '<div class="aviso warn mt8">'+ico('alerta')+
          '<div>No hay valor de unidad cargado para «'+esc(f.obraSocial||'este financiador')+'». '+
          'El coordinador puede definirlo en Catálogos para que se complete solo.</div></div>' : '');
    } else if(fijo){
      total = Number(val('hoMontoFijo')) || 0;
    }
    const mc = MODALIDADES_CONSULTA.find(x => x.id === val('hcModalidad'));
    if($('#hcDesc')) $('#hcDesc').textContent = mc ? mc.d : '';
    const sinConsulta = val('hcModalidad') === 'incluida' || val('hcModalidad') === 'sincargo';
    if($('#hcMontoBox')) $('#hcMontoBox').style.display = sinConsulta ? 'none' : '';
    const consulta = sinConsulta ? 0 : (Number(val('hcMonto')) || 0);

    $('#hoResumen').innerHTML = '<div class="grid c3">'+
      '<div class="kpi aqua"><div class="lbl">'+ico('valoracion')+' Consulta</div>'+
        '<div class="val">'+fMoneda(consulta)+'</div>'+
        '<div class="pie">'+esc(autorFicha(fichaActual))+'</div></div>'+
      '<div class="kpi azul"><div class="lbl">'+ico('jeringa')+' Acto anestésico</div>'+
        '<div class="val">'+fMoneda(total)+'</div>'+
        '<div class="pie">'+esc(nombreActor(fichaActual))+'</div></div>'+
      '<div class="kpi ok"><div class="lbl">'+ico('dinero')+' Total de la ficha</div>'+
        '<div class="val">'+fMoneda(consulta + total)+'</div>'+
        '<div class="pie">'+(esAutorFicha(fichaActual) && esActorFicha(fichaActual)
          ? 'todo tuyo' : 'repartido entre dos profesionales')+'</div></div>'+
    '</div>';
    fichaActual.hon = Object.assign(fichaActual.hon || {}, { total });
    fichaActual.honConsulta = Object.assign(fichaActual.honConsulta || {}, { total:consulta });
  };
  $('#fiCuerpo').addEventListener('change', recalc);
  $('#fiCuerpo').addEventListener('input', debounce(recalc, 220));
  recalc();
}
function leerHonorariosConsulta(){
  const mod = val('hcModalidad');
  const monto = (mod === 'incluida' || mod === 'sincargo') ? 0 : (Number(val('hcMonto')) || 0);
  return { modalidad:mod, total:monto, estado:val('hcEstado'),
           fechaPresentacion:val('hcFecha'), comprobante:val('hcComprobante'),
           cobrado:Number(val('hcCobrado')) || 0 };

function leerHonorarios(){
  const mod = val('hoModalidad');
  const ua = Number(val('hoUA')) || 0, vu = Number(val('hoVU')) || 0;
  const adicionales = leerChks('hoAdic');
  const pct = adicionales.reduce((a,id) => a + (ADICIONALES_HONORARIOS.find(x => x.id === id) || {pct:0}).pct, 0);
  let total = 0;
  if(mod === 'abierto') total = ua * vu * (1 + pct/100);
  else if(mod === 'cerrado' || mod === 'particular') total = Number(val('hoMontoFijo')) || 0;
  return {
    modalidad: mod, ua, valorUnidad: vu, adicionales, pctAdicional: pct,

    estado: val('hoEstado'), fechaPresentacion: val('hoFecha'),
    comprobante: val('hoComprobante'), cobrado: Number(val('hoCobrado')) || 0,
    observaciones: val('hoObs')
  };
}

/* =========================================================================
   ESTADISTICAS - por dia, semana y mes, con cruces por anestesiologo,
   institucion, patologia, cirugia, obra social, caracter y riesgo ASA.
   ========================================================================= */

let stPeriodo = 'mes', stDesde = '', stHasta = '', stCorte = 'institucion';

function rangoPeriodo(){
  const hoy = new Date();
  const iso = d => d.toISOString().slice(0,10);
  if(stPeriodo === 'dia')    return [iso(hoy), iso(hoy)];
  if(stPeriodo === 'semana'){
    const d = new Date(hoy); const dow = (d.getDay() + 6) % 7;
    d.setDate(d.getDate() - dow);
    const f = new Date(d); f.setDate(f.getDate() + 6);
    return [iso(d), iso(f)];
  }
  if(stPeriodo === 'mes'){
    const d = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
    const f = new Date(hoy.getFullYear(), hoy.getMonth() + 1, 0);
    return [iso(d), iso(f)];
  }
  if(stPeriodo === 'anio') return [hoy.getFullYear()+'-01-01', hoy.getFullYear()+'-12-31'];
  return [stDesde || '2000-01-01', stHasta || '2100-12-31'];
}
function fichasEnRango(){
  const [d,h] = rangoPeriodo();
  return misFichas().filter(f => f.fecha && f.fecha >= d && f.fecha <= h);
}
function agrupar(fichas, fn){
  const m = {};
  fichas.forEach(f => {
    const ks = fn(f);
    (Array.isArray(ks) ? ks : [ks]).forEach(k => {
      if(!k) return; m[k] = (m[k] || 0) + 1;
    });
  });
  return Object.keys(m).map(k => ({ t:k, v:m[k] })).sort((a,b) => b.v - a.v);
}

function vistaStats(){
  const cont = $('#vStats');
  const [d,h] = rangoPeriodo();
  const l = fichasEnRango();
  const [rd,rh] = rangoPeriodo();
  const totalHon = misPrestaciones()
    .filter(x => x.fecha >= rd && x.fecha <= rh).reduce((a,x) => a + x.monto, 0);
  const urg = l.filter(f => f.caracter !== 'programada').length;
  const eventos = l.filter(f => ((f.acto||{}).eventos||[]).some(e => e !== 'Sin eventos')).length;
  const asa34 = l.filter(f => ['III','IV','V'].indexOf(((f.v||{}).scores||{}).asa) >= 0).length;
  const pacs = new Set(l.map(f => f.pacienteId)).size;

  const cortes = {
    institucion:   ['Institución',   f => nombreInstitucion(f.institucion).split('"')[0].trim()],
    obraSocial:    ['Financiador',   f => f.obraSocial || 'Sin cobertura'],
    cirugia:       ['Cirugía',       f => f.cirugia || 'Sin especificar'],
    especialidad:  ['Especialidad',  f => f.especialidad || 'Sin especificar'],
    patologia:     ['Patología (CIE-10)', f => ((f.v||{}).cie10 || []).map(c => c.d)],
    anestesiologo: ['Anestesiólogo (valoración)', f => nombreUsuario(f.ownerUid)],
    actor:         ['Anestesiólogo (acto)',        f => nombreActor(f)],
    caracter:      ['Carácter',      f => (f.caracter||'programada').charAt(0).toUpperCase() + (f.caracter||'programada').slice(1)],
    asa:           ['Riesgo ASA',    f => 'ASA ' + (((f.v||{}).scores||{}).asa || 'sin cargar')],
    tecnica:       ['Técnica',       f => ((f.acto||{}).tecnica || (f.plan||{}).tecnica || [])],
    eventos:       ['Eventos adversos', f => ((f.acto||{}).eventos || []).filter(e => e !== 'Sin eventos')]
  };
  const datos = agrupar(l, cortes[stCorte][1]);

  /* serie temporal por dia dentro del rango */
  const serie = {};
  l.forEach(f => { serie[f.fecha] = (serie[f.fecha] || 0) + 1; });
  const dias = Object.keys(serie).sort().map(k => ({ t: k.slice(8)+'/'+k.slice(5,7), v: serie[k] }));

  cont.innerHTML = ''+
  '<div class="vista-head"><div><h1>Estadísticas</h1>'+
    '<p>'+fFecha(d)+' al '+fFecha(h)+(esCoordinador()?' · toda la asociación':' · tu actividad')+'</p></div>'+
    '<div class="acciones"><button class="btn ghost chico" id="stExportar">'+ico('excel')+' Exportar</button></div></div>'+

  '<div class="scroll-x mb8">'+
    [['dia','Hoy'],['semana','Esta semana'],['mes','Este mes'],['anio','Este año'],['rango','Rango…']]
      .map(p => '<span class="tag'+(stPeriodo===p[0]?' on':'')+'" data-per="'+p[0]+'">'+p[1]+'</span>').join('')+
  '</div>'+
  (stPeriodo === 'rango' ? '<div class="filtros">'+
    '<div class="campo"><label>Desde</label><input type="date" id="stDesde" value="'+esc(stDesde)+'"></div>'+
    '<div class="campo"><label>Hasta</label><input type="date" id="stHasta" value="'+esc(stHasta)+'"></div>'+
  '</div>' : '')+

  '<div class="grid c3 mb8">'+
    kpi('Fichas', l.length, 'azul', ico('ficha'), pacs+' pacientes distintos')+
    kpi('Urgencias', urg, urg? 'warn':'', ico('alerta'), l.length? Math.round(urg*100/l.length)+' % del total':'')+
    kpi('ASA III-V', asa34, asa34?'danger':'', ico('escudo'), 'Alto riesgo')+
    kpi('Eventos adversos', eventos, eventos?'danger':'ok', ico('monitor'),
        l.length? (eventos*100/l.length).toFixed(1)+' % de las fichas':'')+
    kpi('Honorarios', fMoneda(totalHon), 'ok', ico('dinero'), 'Devengado en el período')+
    kpi('Promedio por ficha', fMoneda(l.length? totalHon/l.length : 0), 'aqua', ico('calculadora'), '')+
  '</div>'+

  (dias.length > 1 ? '<div class="card"><h3>'+ico('stats')+'Actividad por día</h3>'+
    '<div class="chart">'+svgBarras(dias, 150, 'var(--aqua-500)')+'</div></div>' : '')+

  '<div class="card"><h3>'+ico('filtro')+'Distribución</h3>'+
    '<div class="campo"><select id="stCorte">'+
      Object.keys(cortes).map(k => '<option value="'+k+'"'+(stCorte===k?' selected':'')+'>'+
        esc(cortes[k][0])+'</option>').join('')+
    '</select></div>'+
    (datos.length ?
      '<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center">'+
        svgDona(datos.slice(0,8), 'fichas')+
        '<div style="flex:1;min-width:220px">'+leyenda(datos.slice(0,8))+'</div>'+
      '</div>'+
      '<div class="tabla-wrap mt14"><table><thead><tr><th>'+esc(cortes[stCorte][0])+
        '</th><th class="num">Fichas</th><th class="num">%</th></tr></thead><tbody>'+
        datos.map(x => '<tr><td>'+esc(x.t)+'</td><td class="num">'+x.v+'</td><td class="num">'+
          Math.round(x.v*100/Math.max(1,datos.reduce((a,b)=>a+b.v,0)))+' %</td></tr>').join('')+
      '</tbody></table></div>'
      : '<div class="vacio">'+ico('stats')+'<b>Sin datos en el período</b><span>Cambiá el rango o cargá fichas.</span></div>')+
  '</div>'+

  (esCoordinador() ? '<div class="card"><h3>'+ico('pacientes')+'Actividad por anestesiólogo</h3>'+
    tablaAnestesiologos(l)+'</div>' : '');

  $$('#vStats [data-per]').forEach(t => t.onclick = () => { stPeriodo = t.dataset.per; vistaStats(); });
  if($('#stDesde')) $('#stDesde').onchange = e => { stDesde = e.target.value; vistaStats(); };
  if($('#stHasta')) $('#stHasta').onchange = e => { stHasta = e.target.value; vistaStats(); };
  $('#stCorte').onchange = e => { stCorte = e.target.value; vistaStats(); };
  $('#stExportar').onclick = () => exportarEstadisticas(l, cortes[stCorte][0], datos);
}

function kpi(l, v, cls, icono, pie){
  return '<div class="kpi '+(cls||'')+'"><div class="lbl">'+(icono||'')+esc(l)+'</div>'+
    '<div class="val">'+(typeof v === 'number' ? fNum(v) : esc(v))+'</div>'+
    (pie ? '<div class="pie">'+esc(pie)+'</div>' : '')+'</div>';
}

function tablaAnestesiologos(l){
  const m = {};
  l.forEach(f => {
    const k = f.ownerUid;
    if(!m[k]) m[k] = { n:0, hon:0, urg:0, ev:0 };
    m[k].n++; m[k].hon += Number((f.hon||{}).total || 0) + Number((f.honConsulta||{}).total || 0);
    if(f.caracter !== 'programada') m[k].urg++;
    if(((f.acto||{}).eventos||[]).some(e => e !== 'Sin eventos')) m[k].ev++;
  });
  const filas = Object.keys(m).map(k => Object.assign({ uid:k, nombre:nombreUsuario(k) }, m[k]))
    .sort((a,b) => b.n - a.n);
  if(!filas.length) return '<p class="mini">Sin actividad registrada.</p>';
  return '<div class="tabla-wrap"><table><thead><tr><th>Anestesiólogo</th>'+
    '<th class="num">Fichas</th><th class="num">Urgencias</th><th class="num">Eventos</th>'+
    '<th class="num">Honorarios</th></tr></thead><tbody>'+
    filas.map(f => '<tr><td>'+esc(f.nombre)+'</td><td class="num">'+f.n+'</td>'+
      '<td class="num">'+f.urg+'</td><td class="num">'+f.ev+'</td>'+
      '<td class="num">'+fMoneda(f.hon)+'</td></tr>').join('')+
    '</tbody></table></div>';
}

let facMes = '', facInst = '', facOS = '', facModalidad = '', facEstado = '', facUid = '';

function vistaFacturacion(){
  if(!facMes) facMes = mesDe(hoyISO());
  const cont = $('#vFacturacion');
  let l = misPrestaciones().filter(x => mesDe(x.fecha) === facMes);
  if(facInst)      l = l.filter(x => x.ficha.institucion === facInst);
  if(facOS)        l = l.filter(x => x.ficha.obraSocial === facOS);
  if(facModalidad) l = l.filter(x => facModalidad === 'consulta' ? x.tipo === 'consulta'
                                    : (x.tipo === 'acto' && (x.ficha.hon||{}).modalidad === facModalidad));
  if(facEstado)    l = l.filter(x => x.estado === facEstado);
  if(facUid)       l = l.filter(x => x.uid === facUid);

      MODALIDADES_HONORARIOS.map(m => '<option value="'+m.id+'"'+(facModalidad===m.id?' selected':'')+'>'+
        'Acto: '+esc(m.n)+'</option>').join('')+'</select></div>'+

    kpi('Cobrado', fMoneda(cobrado), 'ok', ico('check'), total? Math.round(cobrado*100/total)+' % del devengado':'')+
    kpi('Consultas', fMoneda(l.filter(x=>x.tipo==='consulta').reduce((a,x)=>a+x.monto,0)),

      '<th>Fecha</th><th>Paciente</th><th>Concepto</th><th>Cirugía</th><th>Institución</th><th>Financiador</th>'+

      '<th class="num">Importe</th><th>Estado</th></tr></thead><tbody>'+
      l.map(x => {

  $('#facEstado').onchange = e => { facEstado = e.target.value; vistaFacturacion(); };

  $$('#vFacturacion tr[data-f]').forEach(tr => tr.onclick = () => abrirFicha(tr.dataset.f));

function resumenPor(l, fn){
  const m = {};
  l.forEach(x => {
    const k = fn(x) || '—';
    if(!m[k]) m[k] = { n:0, total:0, cobrado:0 };
    m[k].n++; m[k].total += x.monto; m[k].cobrado += x.cobrado;
  });
  return Object.keys(m).map(k => Object.assign({ t:k }, m[k])).sort((a,b) => b.total - a.total);
}
function tarjetaResumen(titulo, datos){
  if(!datos.length) return '';
  return '<div class="card"><h3>'+ico('filtro')+esc(titulo)+'</h3>'+
    '<div class="tabla-wrap"><table><thead><tr><th>'+esc(titulo.replace('Por ',''))+
    '</th><th class="num">N.º</th><th class="num">Devengado</th><th class="num">Cobrado</th></tr></thead><tbody>'+
    datos.map(d => '<tr><td>'+esc(d.t)+'</td><td class="num">'+d.n+'</td>'+
      '<td class="num">'+fMoneda(d.total)+'</td><td class="num">'+fMoneda(d.cobrado)+'</td></tr>').join('')+
    '</tbody></table></div></div>';
}
function etiquetaEstadoFact(e){
  const c = { 'Pendiente':'warn', 'Presentado':'info', 'Facturado':'info',
              'Cobrado':'ok', 'Débito / rechazado':'danger' };
  return '<span class="tag '+(c[e]||'')+'">'+esc(e||'Pendiente')+'</span>';
}

let coordSeccion = 'solicitudes';

function pendientes(){

}

function vistaCoordinador(){
  const cont = $('#vCoordinador');
  const secciones = [
    ['solicitudes','campana','Solicitudes'],
    ['padron','pacientes','Padrón'],
    ['prestadores','hospital','Prestadores'],
    ['catalogos','lista','Catálogos'],
    ['auditoria','ojo','Auditoría']
  ];
  const pend = pendientes().length;

  cont.innerHTML = ''+
  '<div class="vista-head"><div><h1>Portal del coordinador</h1>'+
    '<p>Gestión institucional de la Asociación Fueguina de Anestesia y Reanimación</p></div></div>'+
  '<div class="scroll-x mb8">'+ secciones.map(s =>
    '<span class="tag'+(coordSeccion===s[0]?' on':'')+'" data-cs="'+s[0]+'">'+
    ico(s[1]).replace('<svg','<svg style="width:14px;height:14px;display:inline-block;vertical-align:-2px;margin-right:4px"')+
    s[2] + (s[0]==='solicitudes' && pend ? ' ('+pend+')' : '') +'</span>').join('') +'</div>'+
  '<div id="coCuerpo"></div>';

  $$('#vCoordinador [data-cs]').forEach(t => t.onclick = () => { coordSeccion = t.dataset.cs; vistaCoordinador(); });

  const c = $('#coCuerpo');
  if(coordSeccion === 'padron')            seccionPadron(c);
  else if(coordSeccion === 'prestadores')  seccionPrestadores(c);
  else if(coordSeccion === 'catalogos')    seccionCatalogos(c);
  else if(coordSeccion === 'auditoria') seccionAuditoria(c);

}

      cerrarModal(); toast('Solicitud denegada.', 'warn'); vistaCoordinador(); pintarEncabezado();

/* =========================================================================
   SINCRONIZACION
   No es una solapa: se abre tocando el indicador del encabezado.
   El estado lo ve cualquiera; TODO lo que modifique la base de datos queda
   detras de la credencial de coordinacion, y cada cambio se asienta en
   Firebase (auditoria + config/nube) para que quede constancia de quien lo
   hizo, cuando y desde que dispositivo.
   ========================================================================= */
let nubeDesbloqueada = false;      /* se reinicia al recargar la aplicacion */

function abrirSincronizacion(){
  const cfg = configNube();
  const conectada = !!(cfg && cfg.databaseURL);
  const ult = DB.config && DB.config.nube;

  /* ---------- Estado, visible para todos ---------- */
  const estado = conectada
    ? '<div class="aviso '+(nubeOK?'ok':'warn')+'">'+ico(nubeOK?'check':'reloj')+
        '<div><b>'+(nubeOK ? 'Todo sincronizado.' : 'Sin conexión en este momento.')+'</b><br>'+
        (nubeOK
          ? 'Cada cambio se guarda al instante y aparece en el resto de los dispositivos de la asociación.'
          : 'Podés seguir trabajando: los cambios se guardan en este dispositivo y se envían solos '+
            'cuando vuelva internet.')+
        '</div></div>'+
      (usandoConfigEmbebida()
        ? '<div class="aviso info">'+ico('candado')+'<div><b>Configuración incluida en la aplicación.</b><br>'+
          'Nadie tiene que cargar nada: cada dispositivo se conecta solo al abrirla. '+
          'Para cambiar de proyecto, pegá otra configuración acá abajo; para dejar este equipo '+
          'trabajando en local, usá «Desconectar».</div></div>'
        : '')+
      '<div class="card plano" style="border:1px solid var(--borde)">'+
        fila('Base de datos', cfg.projectId || '—')+
        fila('Origen', usandoConfigEmbebida() ? 'incluida en la app' : 'cargada en este dispositivo')+
        fila('Socios', String(lista('usuarios').filter(u => u.rol === 'socio').length))+
        fila('Pacientes', String(lista('pacientes').length))+
        fila('Fichas', String(lista('fichas').length))+
        (ult ? fila('Última modificación',
          fFecha(ult.cuando) + ' ' + String(ult.cuando).slice(11,16) + ' h — ' + (ult.quien || '—')) : '')+
      '</div>'
    : '<div class="aviso warn">'+ico('alerta')+
        '<div><b>Los datos se guardan sólo en este dispositivo.</b><br>'+
        'Lo que carga cada socio no se ve en los demás equipos. La base compartida se '+
        'configura una sola vez.</div></div>';

  /* ---------- Zona protegida ---------- */
  const candado =
    '<hr class="sep">'+
    '<div class="aviso info" style="margin-bottom:11px">'+ico('candado')+
      '<div><b>Configuración protegida.</b><br>'+
      'Cambiar la base de datos, descargar la copia de seguridad o restaurarla '+
      'requiere la credencial de coordinación de la AFAR.</div></div>'+
    '<div class="campo"><label>Credencial de coordinación</label>'+
      '<input type="password" id="snClave" inputmode="numeric" autocomplete="off" placeholder="••••"></div>'+
    '<button class="btn ghost full" id="snDesbloquear">'+ico('candado')+' Desbloquear</button>';

  const avanzado =
    '<hr class="sep">'+
    '<div class="aviso ok" style="margin-bottom:11px">'+ico('check')+
      '<div><b>Configuración desbloqueada.</b> Todo cambio queda registrado en la base '+
      'con tu nombre, la fecha y el dispositivo.</div></div>'+
    '<div class="campo"><label>Configuración de Firebase</label>'+
      '<textarea id="fbCfg" style="min-height:'+(conectada?'120':'150')+'px;font-family:var(--mono);font-size:11.5px" '+
      'placeholder=\'const firebaseConfig = {\n  apiKey: "…",\n  databaseURL: "https://afar-anestesia-default-rtdb.firebaseio.com",\n  projectId: "afar-anestesia",\n  …\n};\'>'+
      (conectada ? esc(JSON.stringify(cfg, null, 2)) : '')+'</textarea>'+
      (conectada ? '<div class="ayuda">Reemplazá el contenido sólo si vas a mudar la asociación a otro proyecto de Firebase.</div>'
                 : '<div class="ayuda">Pegá el bloque que muestra la consola de Firebase. El paso a paso está en PUBLICAR.md.</div>')+
    '</div>'+
    '<div class="btn-row">'+
      '<button class="btn pri chico" id="fbConectar">'+ico('nube')+
        (conectada ? ' Guardar cambios' : ' Conectar')+'</button>'+
      (conectada ? '<button class="btn danger chico" id="fbDesconectar">Desconectar</button>' : '')+
    '</div>'+
    '<hr class="sep">'+
    '<p class="mini mb8">Copia de seguridad con todos los datos de la asociación. '+
      (conectada ? 'Firebase ya los conserva; esto es un resguardo adicional.'
                 : 'Guardala en un lugar seguro: hoy los datos viven sólo en este equipo.')+'</p>'+
    '<div class="btn-row">'+
      '<button class="btn ghost chico" id="snRespaldo">'+ico('descargar')+' Descargar copia</button>'+
      '<button class="btn ghost chico" id="snRestaurar">'+ico('refrescar')+' Restaurar copia</button>'+
      '<button class="btn ghost chico" id="snBloquear">'+ico('candado')+' Volver a bloquear</button>'+
    '</div>'+
    '<input type="file" id="bkArchivo" accept="application/json" class="oculto">';

  abrirModal('Sincronización', estado + (nubeDesbloqueada ? avanzado : candado),
    '<button class="btn pri" data-cerrar>Cerrar</button>');

  /* ---------------- desbloqueo ---------------- */
  if($('#snDesbloquear')){
    const intentar = () => {
      const c = $('#snClave').value.trim();
      if(c !== CLAVE_COORDINADOR){
        auditar('base-de-datos-intento-fallido', 'Credencial incorrecta al intentar abrir la configuración');
        $('#snClave').value = '';
        return toast('Credencial de coordinación incorrecta.', 'err');
      }
      nubeDesbloqueada = true;
      auditar('base-de-datos-desbloqueo', 'Se abrió la configuración de la base de datos');
      cerrarModal();
      setTimeout(abrirSincronizacion, 150);
    };
    $('#snDesbloquear').onclick = intentar;
    $('#snClave').onkeydown = e => { if(e.key === 'Enter') intentar(); };
    setTimeout(() => { const i = $('#snClave'); if(i) i.focus(); }, 250);
  }
  if($('#snBloquear')) $('#snBloquear').onclick = () => {
    nubeDesbloqueada = false; cerrarModal(); setTimeout(abrirSincronizacion, 150);
  };

  /* ---------------- conectar / cambiar de base ---------------- */
  if($('#fbConectar')) $('#fbConectar').onclick = () => {
    if(!nubeDesbloqueada) return toast('Configuración bloqueada.', 'err');
    const txt = $('#fbCfg').value.trim();
    if(!txt) return toast('Pegá la configuración de Firebase.', 'err');
    let cfgN;
    try{
      cfgN = JSON.parse(txt.replace(/^\s*(const|let|var)\s+\w+\s*=\s*/,'').replace(/;\s*$/,'')
        .replace(/([{,]\s*)([A-Za-z0-9_]+)\s*:/g,'$1"$2":').replace(/'/g,'"'));
    }catch(e){ return toast('No se pudo leer la configuración. Copiá el bloque completo, con las llaves.', 'err'); }
    if(!cfgN.databaseURL)
      return toast('Falta la línea databaseURL: creá la Realtime Database en Firebase y volvé a copiar el bloque.', 'err');

    const mudanza = conectada && cfg.databaseURL !== cfgN.databaseURL;
    const aplicar = () => {
      registrarCambioNube(conectada ? (mudanza ? 'cambiar' : 'actualizar') : 'conectar', cfgN);
      guardarConfigNube(cfgN);
      toast('Conectando…', 'ok');
      setTimeout(() => location.reload(), 800);
    };
    if(mudanza){
      confirmar('Cambiar de base de datos',
        'Vas a apuntar la aplicación a <b>'+esc(cfgN.projectId || cfgN.databaseURL)+'</b>, distinta de la actual. '+
        'Los socios pasarán a ver los datos de la base nueva. El cambio queda registrado a tu nombre.',
        aplicar, 'Cambiar de base', true);
    } else aplicar();
  };

  if($('#fbDesconectar')) $('#fbDesconectar').onclick = () => confirmar('Desconectar la base compartida',
    'La aplicación vuelve a guardar sólo en este dispositivo. Los datos ya sincronizados quedan en Firebase. '+
    'El cambio queda registrado a tu nombre.',
    () => {
      registrarCambioNube('desconectar', cfg);
      guardarConfigNube(null);
      setTimeout(() => location.reload(), 500);
    }, 'Desconectar', true);

  /* ---------------- copia de seguridad ---------------- */
  if($('#snRespaldo')) $('#snRespaldo').onclick = () => {
    if(!nubeDesbloqueada) return toast('Configuración bloqueada.', 'err');
    descargar('afar-copia-'+hoyISO()+'.json',
      JSON.stringify({ app:'AFAR by Yanina Andino', version:window.AFAR_BUILD,
                       generado:new Date().toISOString(), datos:DB }, null, 2),
      'application/json');
    auditar('respaldo', 'Descarga de copia de seguridad');
    toast('Copia descargada.', 'ok');
  };
  if($('#snRestaurar')) $('#snRestaurar').onclick = () => {
    if(!nubeDesbloqueada) return toast('Configuración bloqueada.', 'err');
    $('#bkArchivo').click();
  };
  if($('#bkArchivo')) $('#bkArchivo').onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    const fr = new FileReader();
    fr.onload = () => {
      try{
        const d = JSON.parse(fr.result);
        const datos = d.datos || d;
        confirmar('Restaurar copia',
          'Se fusionan los datos del archivo con los actuales. Los registros con el mismo identificador se sobrescriben.',
          () => {
            COLECCIONES.forEach(col => Object.keys(datos[col] || {})
              .forEach(id => escribir(col, id, datos[col][id])));
            auditar('restaurar', f.name);
            toast('Copia restaurada.', 'ok');
            cerrarModal(); refrescarVistaActual();
          }, 'Restaurar');
      }catch(err){ toast('El archivo no es una copia válida de AFAR.', 'err'); }
    };
    fr.readAsText(f);
  };
}

/* ================ ui-contable.js ================ */
/* =========================================================================
   PORTAL CONTABLE - AFAR
   Acceso exclusivo del contador de la asociacion.

   NO accede a ningun dato clinico: trabaja unicamente sobre la proyeccion
   anonimizada que devuelve prestacionesContables() (ver core.js). No hay
   pacientes, ni cirugias, ni diagnosticos, ni valoraciones en este portal.
   ========================================================================= */

let contSeccion = 'panel';
let contDesde = '', contHasta = '', contUid = '', contInst = '';

const CONT_SECCIONES = [
  { id:'panel',      ico:'panel',        t:'Tablero' },
  { id:'cartera',    ico:'dinero',       t:'Cartera y deuda' },
  { id:'indexacion', ico:'stats',        t:'Indexación' },
  { id:'fiscal',     ico:'archivo',      t:'Situación fiscal' },
  { id:'consejos',   ico:'guias',        t:'Recomendaciones' },
  { id:'parametros', ico:'ajustes',      t:'Parámetros' }
];

/* ------------------------------------------------------------- Filtros */
function contPeriodo(){
  if(!contHasta) contHasta = mesDe(hoyISO());
  if(!contDesde) contDesde = sumarMeses(contHasta, -11);
  return { desde:contDesde, hasta:contHasta };
}
function contDatos(){
  const p = contPeriodo();
  let l = prestacionesContables().filter(x => x.mes >= p.desde && x.mes <= p.hasta);
  if(contUid)  l = l.filter(x => x.uid === contUid);
  if(contInst) l = l.filter(x => x.institucionId === contInst);
  return l;
}
/* Dias de antiguedad del saldo: desde la presentacion, o desde la prestacion */
function diasDeuda(x){
  const ref = x.fechaPresentacion || x.fecha;
  if(!ref) return 0;
  return Math.max(0, Math.round((Date.now() - new Date(ref + 'T12:00:00').getTime()) / 86400000));
}
function estaImpago(x){
  return x.saldo > 0 && ['Pendiente','Presentado','Facturado','Débito / rechazado'].indexOf(x.estado) >= 0;
}

/* ============================== VISTA ============================== */

  const cont = $('#vContable');
  const p = contPeriodo();
  cont.innerHTML = ''+
  '<div class="vista-head"><div><h1>Contable AFAR</h1>'+

  '<div class="aviso info">'+ico('candado')+'<div><b>Portal sin datos clínicos.</b> '+
    'Este acceso trabaja sobre prestaciones anonimizadas: importes, financiadores, instituciones y '+
    'profesionales. No contiene pacientes, cirugías ni diagnósticos, en cumplimiento de la Ley 25.326.</div></div>'+

  '<div class="filtros">'+
    campoMesAnio('ctDesde','Desde', p.desde)+
    campoMesAnio('ctHasta','Hasta', p.hasta)+
    '<div class="campo"><label>Anestesiólogo</label><select id="ctUid"><option value="">Todos</option>'+
      socios().map(u => '<option value="'+esc(u.uid)+'"'+(contUid===u.uid?' selected':'')+'>'+
        esc(u.apellido+', '+u.nombre)+'</option>').join('')+'</select></div>'+
    '<div class="campo"><label>Institución</label><select id="ctInst"><option value="">Todas</option>'+
      instituciones().map(i => '<option value="'+esc(i.id)+'"'+(contInst===i.id?' selected':'')+'>'+
        esc(i.nombre.split('"')[0].trim())+'</option>').join('')+'</select></div>'+
  '</div>'+

  '<div class="scroll-x mb8">'+ CONT_SECCIONES.map(s =>
    '<button type="button" class="tag'+(contSeccion===s.id?' on':'')+'" data-cs="'+s.id+'"'+
    ' style="border:0;font:inherit;cursor:pointer">'+
    ico(s.ico).replace('<svg','<svg style="width:14px;height:14px;display:inline-block;'+
      'vertical-align:-2px;margin-right:4px"')+esc(s.t)+'</button>').join('') +'</div>'+

  '<div id="ctCuerpo"></div>';

  cablearMesAnio('ctDesde', v => { contDesde = v; vistaContable(); });
  cablearMesAnio('ctHasta', v => { contHasta = v; vistaContable(); });
  $('#ctUid').onchange  = e => { contUid  = e.target.value; vistaContable(); };
  $('#ctInst').onchange = e => { contInst = e.target.value; vistaContable(); };
  $$('#vContable [data-cs]').forEach(b => b.onclick = () => { contSeccion = b.dataset.cs; vistaContable(); });

  const c = $('#ctCuerpo');
  if(contSeccion === 'panel')      { c.innerHTML = ctPanel();      ctCablearPanel(); }
  if(contSeccion === 'cartera')    { c.innerHTML = ctCartera();    ctCablearCartera(); }
  if(contSeccion === 'indexacion') { c.innerHTML = ctIndexacion(); }
  if(contSeccion === 'fiscal')     { c.innerHTML = ctFiscal();     }
  if(contSeccion === 'consejos')   { c.innerHTML = ctConsejos();   ctCablearConsejos(); }
  if(contSeccion === 'parametros') { c.innerHTML = ctParametros(); ctCablearParametros(); }
}

/* --------------------------------------------------------- 1. TABLERO */
function ctPanel(){
  const l = contDatos();
  const devengado = l.reduce((a,x) => a + x.monto, 0);
  const cobrado   = l.reduce((a,x) => a + x.cobrado, 0);
  const impagas   = l.filter(estaImpago);
  const adeudado  = impagas.reduce((a,x) => a + x.saldo, 0);

  /* Deuda llevada a moneda de hoy */
  let indexado = 0, perdida = 0, sinDato = 0;
  impagas.forEach(x => {
    const r = indexarSaldo(x.saldo, x.mes);
    indexado += r.actualizado; perdida += r.perdida;
    if(r.mesesSinDato) sinDato++;
  });

  const proy = proyeccionAnual(6);
  const infl = inflacionUltimos(12);
  const porProf = ctAgrupar(l, x => nombreUsuario(x.uid) || 'Sin asignar');
  const porInst = ctAgrupar(l, x => x.institucion);
  const porFin  = ctAgrupar(l, x => x.financiador);

  return ''+
  '<div class="grid c4 mb8">'+
    kpi('Devengado', fMoneda(devengado), 'azul', ico('dinero'), l.length+' prestaciones')+
    kpi('Cobrado', fMoneda(cobrado), 'ok', ico('check'),
        devengado ? Math.round(cobrado*100/devengado)+' % del devengado' : '')+
    kpi('Adeudado', fMoneda(adeudado), adeudado?'warn':'ok', ico('reloj'), impagas.length+' prestaciones')+
    kpi('Deuda a hoy', fMoneda(indexado), indexado>adeudado?'danger':'', ico('stats'), 'ajustada por IPC')+
  '</div>'+

  (adeudado ? '<div class="aviso '+(perdida > adeudado*0.15 ? 'danger':'warn')+'">'+ico('alerta')+
    '<div><b>Pérdida por exposición a la inflación: '+fMoneda(perdida)+'</b><br>'+
    'Es lo que la asociación resignó en poder adquisitivo por cobrar tarde: el saldo nominal de '+
    fMoneda(adeudado)+' equivale hoy a '+fMoneda(indexado)+'.'+
    (sinDato ? ' <b>Atención:</b> '+sinDato+' saldos abarcan meses sin IPC cargado, así que el ajuste está '+
      'subestimado.' : '')+'</div></div>' : '')+

  '<div class="grid c2">'+
    '<div class="card"><h3>'+ico('stats')+'Inflación</h3>'+
      (infl ? '<div class="tabla-wrap"><table><tbody>'+
        '<tr><td>Acumulada '+infl.meses+' meses ('+nombreMes(infl.desde)+' a '+nombreMes(infl.hasta)+')</td>'+
          '<td class="num"><b>'+fNum(infl.pct,1)+' %</b></td></tr>'+
        (proy ? '<tr><td>Promedio mensual (últimos 6 meses)</td><td class="num">'+fNum(proy.mensual,2)+' %</td></tr>'+
          '<tr><td>Proyección anualizada</td><td class="num"><b>'+fNum(proy.anual,1)+' %</b></td></tr>' : '')+
        '</tbody></table></div>'+
        '<p class="mini mt8">La proyección extrapola el promedio de los últimos seis meses. '+
        'Es una referencia de trabajo, no un pronóstico.</p>'
      : '<div class="aviso warn" style="margin:0">'+ico('alerta')+
        '<div>No hay IPC cargado. Cargalo en <b>Parámetros</b>.</div></div>')+
    '</div>'+
    '<div class="card"><h3>'+ico('reloj')+'Antigüedad de la deuda</h3>'+
      ctTablaAging(impagas)+
    '</div>'+
  '</div>'+

  ctTablaGrupo('Por anestesiólogo', porProf, 'Profesional')+
  '<div class="grid c2">'+
    ctTablaGrupo('Por institución', porInst, 'Institución')+
    ctTablaGrupo('Por financiador', porFin, 'Financiador')+

/* Agrupa sumando devengado, cobrado, saldo e indexado */
function ctAgrupar(l, fn){
  const m = {};
  l.forEach(x => {
    const k = fn(x) || '—';
    if(!m[k]) m[k] = { t:k, n:0, devengado:0, cobrado:0, saldo:0, indexado:0 };
    m[k].n++; m[k].devengado += x.monto; m[k].cobrado += x.cobrado;
    if(estaImpago(x)){
      m[k].saldo += x.saldo;
      m[k].indexado += indexarSaldo(x.saldo, x.mes).actualizado;
    }
  });
  return Object.values(m).sort((a,b) => b.devengado - a.devengado);
}
function ctTablaGrupo(titulo, datos, col){

  const tot = datos.reduce((a,d) => ({

    saldo:a.saldo+d.saldo, indexado:a.indexado+d.indexado
  }), {n:0,devengado:0,cobrado:0,saldo:0,indexado:0});
  return '<div class="card"><h3>'+ico('filtro')+esc(titulo)+'</h3><div class="tabla-wrap"><table>'+

/* Tramos de antiguedad */
const TRAMOS_DEUDA = [
  { t:'Al día (0 a 30 días)',   min:0,   max:30,   cls:'ok'     },
  { t:'31 a 60 días',           min:31,  max:60,   cls:''       },
  { t:'61 a 90 días',           min:61,  max:90,   cls:'warn'   },
  { t:'91 a 180 días',          min:91,  max:180,  cls:'warn'   },
  { t:'181 a 365 días',         min:181, max:365,  cls:'danger' },
  { t:'Más de un año',          min:366, max:1e9,  cls:'danger' }
];
function ctTablaAging(impagas){
  if(!impagas.length) return '<div class="vacio" style="padding:20px">'+ico('check')+
    '<b>Sin deuda pendiente</b><span>Todas las prestaciones del período están cobradas.</span></div>';
  const filas = TRAMOS_DEUDA.map(t => {
    const g = impagas.filter(x => { const d = diasDeuda(x); return d >= t.min && d <= t.max; });
    return { t:t, n:g.length, monto:g.reduce((a,x) => a + x.saldo, 0),
             indexado:g.reduce((a,x) => a + indexarSaldo(x.saldo, x.mes).actualizado, 0) };
  }).filter(f => f.n);
  const total = filas.reduce((a,f) => a + f.monto, 0);
  return '<div class="tabla-wrap"><table><thead><tr><th>Antigüedad</th><th class="num">N.º</th>'+
    '<th class="num">Nominal</th><th class="num">A hoy</th><th class="num">%</th></tr></thead><tbody>'+
    filas.map(f => '<tr><td><span class="tag '+f.t.cls+'">'+esc(f.t.t)+'</span></td>'+
      '<td class="num">'+f.n+'</td><td class="num">'+fMoneda(f.monto)+'</td>'+
      '<td class="num">'+fMoneda(f.indexado)+'</td>'+
      '<td class="num">'+(total?fNum(f.monto*100/total,0):'0')+' %</td></tr>').join('')+
    '</tbody></table></div>';
}
