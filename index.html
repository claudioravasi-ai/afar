function tieneAntecedente(p, n){
  return (p.antecedentes || []).some(a => (a.n || a) === n);
}

function cablearPacAntecedentes(){
  const p = pacEdit;

  const refrescar = () => {
    pintarAntSeleccionados();
    pintarMedsSugeridas();
    $$('#paChips [data-chip]').forEach(b =>
      b.classList.toggle('on', tieneAntecedente(p, b.dataset.chip)));
    $$('.pa-sis').forEach(i => {
      const on = tieneAntecedente(p, i.value);
      i.checked = on;
      i.closest('.chk').classList.toggle('sel', on);
    });
  };

  const alternar = n => {
    const i = (p.antecedentes || []).findIndex(a => (a.n || a) === n);
    if(i >= 0) p.antecedentes.splice(i, 1);
    else {
      const cat = patologiaPorNombre(n);
      p.antecedentes.push({ n:n, sis: cat ? cat.sis : 'Otros' });
    }
    refrescar();
  };

  $$('#paChips [data-chip]').forEach(b => b.onclick = () => alternar(b.dataset.chip));
  $('#paChipOtro').onclick = () => { const i = $('#paAntBuscar'); if(i) i.focus(); };
  $$('.pa-sis').forEach(i => i.onclick = e => { e.preventDefault(); alternar(i.value); });

  montarBuscador({
    input: $('#paAntBuscar'), caja: $('#paAntRes'), manual: true,
    fuente: () => todasPatologias().map(x => ({
      etiqueta:x.n, sub:x.sis, busca: norm(x.n+' '+x.sis+' '+(x.chip||'')), dato:x })),
    onElegir: x => { if(!tieneAntecedente(p, x.dato.n)) alternar(x.dato.n); else refrescar(); },
    onManual: txt => {
      if(!txt) return;
      agregarExtra('pat', { n:txt, sis:'Agregado manualmente' });
      if(!tieneAntecedente(p, txt)){ p.antecedentes.push({ n:txt, sis:'Agregado manualmente' }); }
      refrescar();
      toast('Antecedente agregado al catálogo de la asociación.', 'ok');
    }
  });

  /* «Sin antecedentes relevantes» atenúa el bloque pero no borra nada:
     si el paciente después resulta tener algo, no se perdió lo cargado. */
  const sinAnt = () => {
    const on = $('#paSinAnt').checked;
    $('#paSinAntL').classList.toggle('on', on);
    $('#paAntBloque').classList.toggle('atenuado', on);
  };
  $('#paSinAnt').onchange = sinAnt;

  /* cirugías previas */
  const pintarQx = () => {
    const l = p.antQuirurgicos || [];
    $('#paQxSel').innerHTML = l.length
      ? '<div class="seleccionados">'+ l.map((q,i) =>
          '<span class="pill"><span>'+esc(q.n)+(q.anio?' ('+esc(q.anio)+')':'')+'</span>'+
          '<button data-qxq="'+i+'">&times;</button></span>').join('') +'</div>'
      : '<span class="mini">Sin cirugías previas cargadas.</span>';
    $$('#paQxSel [data-qxq]').forEach(b => b.onclick = () => {
      p.antQuirurgicos.splice(Number(b.dataset.qxq), 1); pintarQx();
      $$('#paQxChips [data-qx]').forEach(c =>
        c.classList.toggle('on', (p.antQuirurgicos||[]).some(q => q.n === c.dataset.qx)));
    });
  };
  $$('#paQxChips [data-qx]').forEach(b => b.onclick = () => {
    const n = b.dataset.qx;
    const i = (p.antQuirurgicos||[]).findIndex(q => q.n === n);
    if(i >= 0) p.antQuirurgicos.splice(i, 1); else p.antQuirurgicos.push({ n:n, anio:'' });
    b.classList.toggle('on', i < 0); pintarQx();
  });
  $('#paQxAdd').onclick = () => {
    const n = $('#paQxOtra').value.trim(); if(!n) return;
    p.antQuirurgicos.push({ n:n, anio:$('#paQxAnio').value.trim() });
    $('#paQxOtra').value = ''; $('#paQxAnio').value = ''; pintarQx();
  };
  pintarQx();

  cablearChks('paAntAnest'); cablearChks('paAntFam');
  const revisarHM = () => {
    const marcado = $$('#paAntAnest input:checked').some(i => i.value.indexOf('Hipertermia maligna') >= 0)
      || $$('#paAntFam input:checked').some(i => i.value.indexOf('Hipertermia maligna') >= 0);
    $('#paAlertaHM').style.display = marcado ? '' : 'none';
  };
  $('#paAntAnest').addEventListener('change', revisarHM);
  $('#paAntFam').addEventListener('change', revisarHM);
  revisarHM();

  refrescar();
}

function pintarAntSeleccionados(){
  const p = pacEdit;
  const c = $('#paAntSel'); if(!c) return;
  const l = p.antecedentes || [];
  c.innerHTML = l.length
    ? l.map((a,i) => '<span class="pill"><span>'+esc(a.n)+'</span>'+
        '<b class="comp">'+esc(a.sis||'')+'</b><button data-ant="'+i+'">&times;</button></span>').join('')
    : '<span class="mini">Sin antecedentes cargados.</span>';
  $$('#paAntSel [data-ant]').forEach(b => b.onclick = () => {
    p.antecedentes.splice(Number(b.dataset.ant), 1);
    pintarAntSeleccionados(); pintarMedsSugeridas();
    $$('#paChips [data-chip]').forEach(x =>
      x.classList.toggle('on', tieneAntecedente(p, x.dataset.chip)));
    $$('.pa-sis').forEach(i => {
      const on = tieneAntecedente(p, i.value);
      i.checked = on; i.closest('.chk').classList.toggle('sel', on);
    });
  });
}

/* Al cargar una patología se ofrece la medicación que habitualmente toma
   ese paciente, con la conducta perioperatoria de cada fármaco. No se
   agrega sola: hay que tocarla. */
function pintarMedsSugeridas(){
  const p = pacEdit;
  const c = $('#paAntMeds'); if(!c) return;
  const sug = medicacionSugerida(p.antecedentes)
    .filter(m => !(p.medicacion || []).some(x => x.n === m.n));
  if(!sug.length){ c.innerHTML = ''; return; }
  c.innerHTML = '<div class="aviso info mt14">'+ico('jeringa')+'<div>'+
    '<b>Medicación habitual asociada a estos antecedentes.</b> Tocá la que el paciente '+
    'realmente toma; cada una viene con su conducta perioperatoria.<div class="chips mt8">'+
    sug.map((m,i) => '<button type="button" class="chip" data-sug="'+i+'">'+ico('mas')+
      esc(m.n)+'</button>').join('')+
    '<button type="button" class="chip on" id="paSugTodas">Agregar todas</button>'+
    '</div></div></div>';
  const agregar = m => {
    if((p.medicacion||[]).some(x => x.n === m.n)) return;
    p.medicacion.push({ n:m.n, g:m.g, accion:m.accion, nota:m.nota, dosis:'', porque:m.porque });
  };
  $$('#paAntMeds [data-sug]').forEach(b => b.onclick = () => {
    agregar(sug[Number(b.dataset.sug)]); pintarMedsSugeridas();
    toast('Agregada a la medicación habitual.', 'ok');
  });
  $('#paSugTodas').onclick = () => { sug.forEach(agregar); pintarMedsSugeridas();
    toast(sug.length+' fármacos agregados a la medicación.', 'ok'); };
}

function cablearPacMedicacion(){
  const p = pacEdit;
  montarBuscador({
    input: $('#paMedBuscar'), caja: $('#paMedRes'), manual: true,
    fuente: () => FARMACOS_PERIOP.map(x => ({
      etiqueta:x.n, sub:x.g+' · '+({continuar:'Continuar',suspender:'Suspender',evaluar:'Evaluar'}[x.accion]),
      busca: norm(x.n+' '+x.g), dato:x })),
    onElegir: x => { if(!p.medicacion.some(m => m.n === x.dato.n))
        p.medicacion.push({ n:x.dato.n, g:x.dato.g, accion:x.dato.accion, nota:x.dato.nota, dosis:'' });
      pintarMedPaciente(); },
    onManual: txt => { if(!txt) return;
      p.medicacion.push({ n:txt, g:'Otro', accion:'evaluar', nota:'', dosis:'' }); pintarMedPaciente(); }
  });
  pintarMedPaciente();

  /* también acá se ofrece lo que sugieren los antecedentes ya cargados */
  const sug = medicacionSugerida(p.antecedentes).filter(m => !p.medicacion.some(x => x.n === m.n));
  const c = $('#paMedSug');
  if(sug.length){
    c.innerHTML = '<div class="aviso info">'+ico('info')+'<div>'+
      '<b>Sugerida por los antecedentes cargados.</b><div class="chips mt8">'+
      sug.map((m,i) => '<button type="button" class="chip" data-msug="'+i+'">'+ico('mas')+esc(m.n)+
        '</button>').join('')+'</div></div></div>';
    $$('#paMedSug [data-msug]').forEach(b => b.onclick = () => {
      const m = sug[Number(b.dataset.msug)];
      p.medicacion.push({ n:m.n, g:m.g, accion:m.accion, nota:m.nota, dosis:'', porque:m.porque });
      cablearPacMedicacion();
    });
  } else c.innerHTML = '';
}

function pintarMedPaciente(){
  const p = pacEdit;
  const cont = $('#paMedLista'); if(!cont) return;
  if(!p.medicacion.length){
    cont.innerHTML = '<p class="mini">Sin medicación cargada.</p>'; return;
  }
  const color = { continuar:'ok', suspender:'danger', evaluar:'warn' };
  const txt = { continuar:'CONTINUAR', suspender:'SUSPENDER', evaluar:'EVALUAR' };
  cont.innerHTML = p.medicacion.map((m,i) =>
    '<div class="med-card">'+
      '<div class="med-head">'+
        '<b>'+esc(m.n)+'</b>'+
        '<span class="tag '+color[m.accion]+'">'+txt[m.accion]+'</span>'+
        '<button class="btn ghost chico" data-mquitar="'+i+'">'+ico('borrar')+'</button>'+
      '</div>'+
      (m.porque ? '<div class="mini">Por su antecedente de '+esc(m.porque)+'</div>' : '')+
      '<div class="grid c2 mt8">'+
        '<div class="campo" style="margin:0"><label>Dosis y frecuencia</label>'+
          '<input type="text" data-mdosis="'+i+'" value="'+esc(m.dosis||'')+'" placeholder="Ej.: 10 mg/día"></div>'+
        '<div class="campo" style="margin:0"><label>Conducta perioperatoria</label>'+
          '<select data-maccion="'+i+'">'+
          ['continuar','suspender','evaluar'].map(a =>
            '<option value="'+a+'"'+(m.accion===a?' selected':'')+'>'+txt[a]+'</option>').join('')+
        '</select></div>'+
      '</div>'+
      (m.nota ? '<div class="med-nota">'+esc(m.nota)+'</div>' : '')+
    '</div>').join('');
  $$('#paMedLista [data-mquitar]').forEach(b => b.onclick = () => {
    p.medicacion.splice(Number(b.dataset.mquitar), 1); pintarMedPaciente(); });
  $$('#paMedLista [data-mdosis]').forEach(i => i.oninput = () =>
    p.medicacion[Number(i.dataset.mdosis)].dosis = i.value);
  $$('#paMedLista [data-maccion]').forEach(s => s.onchange = () => {
    p.medicacion[Number(s.dataset.maccion)].accion = s.value; pintarMedPaciente(); });
}

function leerSolapaPaciente(){

  if(solapaPac === 'fil'){
    if($('#paApellido')){
      p.apellido = g('paApellido'); p.nombre = g('paNombre'); p.dni = g('paDni');
      p.hc = g('paHC'); p.fechaNac = g('paNac'); p.sexo = $('#paSexo').value;
      p.peso = g('paPeso'); p.talla = g('paTalla');
      p.obraSocial = $('#paOS').value; p.nroAfiliado = g('paAfiliado');
      p.telefono = g('paTel'); p.grupoSanguineo = $('#paGrupo').value;
      p.email = g('paEmail'); p.domicilio = g('paDom'); p.localidad = $('#paLocalidad').value;
      p.contactoEmergencia = g('paEmergencia'); p.ocupacion = g('paOcupacion');
      p.observaciones = g('paObs');
    }
  } else if(solapaPac === 'ant'){
    if($('#paSinAnt')){
      p.sinAntecedentes = $('#paSinAnt').checked;
      p.antecedentesOtros = g('paAntOtros');
      p.antAnestesicos = leerChks('paAntAnest'); p.antAnestDetalle = g('paAntAnestDet');
      p.antFamiliares = leerChks('paAntFam');   p.antFamDetalle = g('paAntFamDet');
    }
  } else if(solapaPac === 'med'){
    if($('#paMedOtros')) p.medicacionOtros = g('paMedOtros');
  } else {
    if($('#paAlerg')){
      const sel = leerChks('paAlerg');
      p.alergias = $('#paSinAle').checked
        ? ['Sin alergias conocidas'].concat(sel.filter(x => x !== 'Sin alergias conocidas'))
        : sel.filter(x => x !== 'Sin alergias conocidas');
      p.alergiaDetalle = g('paAlergDet');
      p.habitos = { tabaco:$('#paTabaco').value, tabacoCant:g('paTabacoCant'),
                    alcohol:$('#paAlcohol').value, drogas:$('#paDrogas').value,
                    actividad:$('#paActividad').value };
    }
  }
}

function guardarPacienteEditado(){
  leerSolapaPaciente();
  const p = pacEdit;
  const id = p.__id;
  if(!p.apellido || !p.nombre){
    solapaPac = 'fil'; pintarEditorPaciente();
    return toast('Apellido y nombre son obligatorios.', 'err');
  }
  if(!p.dni){
    solapaPac = 'fil'; pintarEditorPaciente();
    return toast('El DNI es obligatorio.', 'err');
  }
  const dup = lista('pacientes').find(x => x.id !== id && norm(x.dni) === norm(p.dni));
  if(dup && !id) return toast('Ya existe un paciente con ese DNI: '+dup.apellido+', '+dup.nombre, 'err');

  const nid = id || uid('pac');
  const alGuardar = p.__alGuardar;
  delete p.__id; delete p.__alGuardar;
  const reg = Object.assign({}, p, {
    id:nid, ownerUid: p.ownerUid || SESION.uid,
    creado: p.creado || new Date().toISOString(),
    modificado: new Date().toISOString(), modificadoPor: SESION.uid
  });
  escribir('pacientes', nid, reg);
  auditar(id?'paciente-editar':'paciente-alta', reg.apellido+', '+reg.nombre);
  cerrarModal();
  toast(id ? 'Historia del paciente actualizada.' : 'Paciente creado.', 'ok');
  if(vistaActual === 'pacientes') vistaPacientes();
  if(alGuardar) alGuardar(nid);
  else if(!id) setTimeout(() => abrirPaciente(nid), 200);
}

/* =========================================================================
   DETALLE DEL PACIENTE
   ========================================================================= */
function abrirPaciente(id){
  const p = DB.pacientes[id]; if(!p) return;
  const fichas = fichasVisibles().filter(f => f.pacienteId === id)
    .sort((a,b) => (b.fecha||'') < (a.fecha||'') ? -1 : 1);
  const ed = edadDe(p.fechaNac);
  const imc = calcIMC(p.peso, p.talla);
  const ant = p.antecedentes || [];
  const alergias = (p.alergias || []).filter(a => a !== 'Sin alergias conocidas');
  const meds = p.medicacion || [];
  const h = p.habitos || {};

  const bloqueLista = (titulo, items, vacio) =>
    '<h3 class="sec-t">'+esc(titulo)+'</h3>'+
    (items.length
      ? '<div class="seleccionados">'+items.map(x => '<span class="pill"><span>'+esc(x)+'</span></span>').join('')+'</div>'
      : '<p class="mini">'+esc(vacio)+'</p>');

  const cuerpo = ''+
  '<div class="pac-cabecera">'+
    '<div class="avatar grande">'+esc(iniciales(p.nombre,p.apellido))+'</div>'+
    '<div><div class="pac-nombre">'+esc(p.apellido)+', '+esc(p.nombre)+'</div>'+
    '<div class="mini">DNI '+esc(p.dni||'—')+(p.hc?' · HC '+esc(p.hc):'')+
      (ed!==null?' · '+ed+' años':'')+
      (p.sexo?' · '+({F:'Femenino',M:'Masculino',X:'X'}[p.sexo]||''):'')+'</div></div>'+
  '</div>'+

  (alergias.length ? '<div class="aviso danger">'+ico('alerta')+'<div><b>Alergias: </b>'+
    esc(alergias.join(' · '))+(p.alergiaDetalle ? '<br><span class="mini">'+esc(p.alergiaDetalle)+'</span>' : '')+
    '</div></div>' : '')+

  '<div class="grid c3 mb8">'+
    kpiMini('Peso', p.peso ? p.peso+' kg' : '—')+
    kpiMini('Talla', p.talla ? p.talla+' cm' : '—')+
    kpiMini('IMC', imc ? fNum(imc,1) : '—')+
  '</div>'+
  (imc ? '<p class="mini mb8" style="text-align:center">'+esc(clasificaIMC(imc))+'</p>' : '')+

  '<div class="card plano" style="margin-bottom:12px">'+
    fila('Obra social', (p.obraSocial||'Sin cobertura') + (p.nroAfiliado ? ' — N.º '+p.nroAfiliado : ''))+
    fila('Grupo y factor', p.grupoSanguineo || '—')+
    fila('Teléfono', p.telefono || '—')+
    fila('Correo electrónico', p.email || '—')+
    fila('Domicilio', [p.domicilio, p.localidad].filter(Boolean).join(', ') || '—')+
    fila('Ocupación', p.ocupacion || '—')+
    fila('Contacto de emergencia', p.contactoEmergencia || '—')+
    (p.observaciones ? fila('Observaciones', p.observaciones) : '')+
    fila('Cargado por', nombreUsuario(p.ownerUid) +
      (p.modificadoPor && p.modificadoPor !== p.ownerUid
        ? ' · última edición: ' + nombreUsuario(p.modificadoPor) : ''))+
  '</div>'+

  '<h3 class="sec-t">Antecedentes patológicos</h3>'+
  (p.sinAntecedentes && !ant.length
    ? '<div class="aviso ok">'+ico('check')+'<div>Sin antecedentes relevantes.</div></div>'
    : (ant.length
      ? '<div class="seleccionados">'+ant.map(a =>
          '<span class="pill"><span>'+esc(a.n)+'</span><b class="comp">'+esc(a.sis||'')+'</b></span>').join('')+'</div>'
      : '<p class="mini">Sin antecedentes cargados.</p>'))+
  (p.antecedentesOtros ? '<p class="mini mt8">'+esc(p.antecedentesOtros)+'</p>' : '')+

  '<h3 class="sec-t">Medicación habitual</h3>'+
  (meds.length
    ? '<div class="lista chica">'+meds.map(m => {
        const color = { continuar:'ok', suspender:'danger', evaluar:'warn' }[m.accion] || '';
        const txt = { continuar:'CONTINUAR', suspender:'SUSPENDER', evaluar:'EVALUAR' }[m.accion] || '';
        return '<div class="item plano"><div class="txt"><b>'+esc(m.n)+'</b>'+
          '<span>'+esc([m.g, m.dosis].filter(Boolean).join(' · '))+'</span></div>'+
          '<div class="der"><span class="tag '+color+'">'+txt+'</span></div></div>';
      }).join('')+'</div>'
    : '<p class="mini">Sin medicación cargada.</p>')+
  (p.medicacionOtros ? '<p class="mini mt8">'+esc(p.medicacionOtros)+'</p>' : '')+

  bloqueLista('Antecedentes quirúrgicos',
    (p.antQuirurgicos||[]).map(q => q.n + (q.anio ? ' ('+q.anio+')' : '')),
    'Sin cirugías previas cargadas.')+

  bloqueLista('Antecedentes anestésicos', p.antAnestesicos || [], 'Sin antecedentes anestésicos.')+
  (p.antAnestDetalle ? '<p class="mini mt8">'+esc(p.antAnestDetalle)+'</p>' : '')+

  bloqueLista('Antecedentes familiares', p.antFamiliares || [], 'Sin antecedentes familiares.')+
  (p.antFamDetalle ? '<p class="mini mt8">'+esc(p.antFamDetalle)+'</p>' : '')+

  '<h3 class="sec-t">Hábitos</h3>'+
  '<div class="card plano">'+
    fila('Tabaquismo', (h.tabaco || '—') + (h.tabacoCant ? ' — '+h.tabacoCant+' paq/año' : ''))+
    fila('Alcohol', h.alcohol || '—')+
    fila('Otras sustancias', h.drogas || '—')+
    fila('Actividad física', h.actividad || '—')+
  '</div>'+

  '<h3 class="sec-t">Fichas anestésicas ('+fichas.length+')</h3>'+
  (fichas.length ? '<div class="lista">'+ fichas.map(f =>
      '<div class="item" data-ficha="'+f.id+'">'+
        '<div class="avatar" style="background:'+(f.caracter==='urgencia'?'var(--danger-bg);color:var(--danger)':'var(--aqua-200);color:var(--aqua-600)')+'">'+
          ico('ficha')+'</div>'+
        '<div class="txt"><b>'+esc(f.cirugia||'Sin cirugía cargada')+'</b>'+
          '<span>'+fFecha(f.fecha)+' · '+esc(nombreInstitucion(f.institucion).split('"')[0].trim())+
          ' · '+esc(autorFicha(f))+(esAutorFicha(f)?' (vos)':'')+'</span></div>'+
        '<div class="der">'+etiquetaEstadoFicha(f)+'</div>'+
      '</div>').join('') +'</div>'
    : '<p class="mini">Todavía no hay fichas para este paciente.</p>');

  abrirModal('Paciente', cuerpo,
    '<button class="btn ghost" id="pdEditar">'+ico('editar')+' Editar historia</button>'+
    '<button class="btn pri" id="pdNuevaFicha">'+ico('mas')+' Nueva ficha</button>', '980px');

  $('#pdEditar').onclick = () => { cerrarModal(); setTimeout(() => editarPaciente(id), 180); };
  $('#pdNuevaFicha').onclick = () => { cerrarModal(); setTimeout(() => abrirFicha(null, id), 180); };
  $$('#modal .item[data-ficha]').forEach(it => {
    it.onclick = () => { const fid = it.dataset.ficha; cerrarModal(); setTimeout(() => abrirFicha(fid), 180); };
  });
}

function kpiMini(l, v){
  return '<div class="kpi"><div class="lbl">'+esc(l)+'</div><div class="val" style="font-size:19px">'+esc(v)+'</div></div>';
}
function fila(l, v){
  return '<div class="doc-par" style="display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--borde);font-size:13px">'+
    '<b style="min-width:135px;color:var(--texto-2);font-weight:650">'+esc(l)+'</b>'+
    '<span style="flex:1">'+esc(v)+'</span></div>';
}
function etiquetaEstadoFicha(f){
  if(f.estado === 'cerrada')   return '<span class="tag ok">Finalizada</span>';
  if(f.estado === 'realizada') return '<span class="tag info">Realizada</span>';
  return '<span class="tag warn">Borrador</span>';
}

  const o = { actorExterno: v === 'externo' ? val('qxActorExterno') : '' };

  return o;
}

function cablearAsignacionActo(){
  if(!$('#qxAsignado')) return;
  const avisar = () => {
    const v = $('#qxAsignado').value;
    $('#qxExternoBox').classList.toggle('oculto', v !== 'externo');
    const box = $('#qxAsignadoAviso');
    if(v === 'sinasignar')
      box.innerHTML = '<div class="aviso info">'+ico('info')+'<div>Cualquier socio va a poder '+
        'abrir esta ficha y tomar el acto desde el botón <b>«Voy a realizar este acto»</b>. '+
        'Hasta entonces el recordatorio te llega sólo a vos.</div></div>';
    else if(v === 'externo')
      box.innerHTML = '<div class="aviso warn">'+ico('alerta')+'<div>El acto lo realiza alguien '+
        'sin usuario en la app: queda documentado en la ficha, pero <b>su honorario no se factura '+
        'acá</b>. Vos seguís facturando la consulta prequirúrgica.</div></div>';
    else if(v && SESION && v !== SESION.uid)
      box.innerHTML = '<div class="aviso ok">'+ico('check')+'<div><b>'+
        esc(nombreUsuario(v))+'</b> va a recibir el recordatorio de la cirugía y va a poder '+

/* ============================== Cableado ============================== */
let dxSeleccionados = [], medSeleccionados = [];

function cablearValoracion(f){
  const v = f.v || {};
  const p = DB.pacientes[f.pacienteId] || {};

  /* La ficha arranca con lo que ya esta en la historia del paciente. Si el
     anestesiologo despues lo cambia, el cambio vale para esta ficha. */
  const traerDelPaciente = () => {
    dxSeleccionados  = (p.antecedentes || []).map(a => ({ n:a.n, sis:a.sis }));
    medSeleccionados = (p.medicacion || []).map(m => Object.assign({}, m));
  };
  if(v.antecedentes2 || v.medicacion){
    dxSeleccionados  = (v.antecedentes2 || []).slice();
    medSeleccionados = (v.medicacion || []).slice();
  } else traerDelPaciente();

  const alternarDx = n => {
    const i = dxSeleccionados.findIndex(d => (d.n || d.d) === n);
    if(i >= 0) dxSeleccionados.splice(i, 1);
    else {
      const cat = patologiaPorNombre(n);
      dxSeleccionados.push({ n:n, sis: cat ? cat.sis : 'Otros' });
    }
    pintarDx();
    if(window.__recalcValoracion) window.__recalcValoracion();
  };
  window.__alternarDx = alternarDx;

  /* --- buscador de antecedentes patologicos --- */
  montarBuscador({
    input: $('#dxBuscar'), caja: $('#dxRes'), manual: true,
    fuente: () => todasPatologias().map(x => ({
      etiqueta:x.n, sub:x.sis, busca: norm(x.n+' '+x.sis+' '+(x.chip||'')), dato:x })),
    onElegir: x => { if(!dxSeleccionados.some(d => (d.n||d.d) === x.dato.n)) alternarDx(x.dato.n); },
    onManual: txt => {
      if(!txt) return;
      agregarExtra('pat', { n:txt, sis:'Agregado manualmente' });
      if(!dxSeleccionados.some(d => (d.n||d.d) === txt))
        dxSeleccionados.push({ n:txt, sis:'Agregado manualmente' });
      pintarDx();
      toast('Antecedente agregado al catálogo.', 'ok');
    }
  });
  $$('#dxChips [data-dxchip]').forEach(b => b.onclick = () => alternarDx(b.dataset.dxchip));
  $$('.dx-sis').forEach(i => i.onclick = e => { e.preventDefault(); alternarDx(i.value); });
  if($('#dxTraer')) $('#dxTraer').onclick = () => {
    traerDelPaciente(); pintarDx(); pintarMed();
    toast('Antecedentes y medicación traídos de la historia.', 'ok');
    if(window.__recalcValoracion) window.__recalcValoracion();
  };
  $('#dxSinL').onclick = () => setTimeout(() =>
    $('#dxSinL').classList.toggle('on', chk('dxSin')), 0);
  pintarDx();

  /* --- buscador de fármacos --- */
  montarBuscador({
    input: $('#medBuscar'), caja: $('#medRes'), manual: true,
    fuente: () => FARMACOS_PERIOP.map(x => ({
      etiqueta:x.n, sub:x.g+' · '+({continuar:'Continuar',suspender:'Suspender',evaluar:'Evaluar'}[x.accion]),
      busca: norm(x.n+' '+x.g), dato:x })),
    onElegir: x => { if(!medSeleccionados.some(m => m.n === x.dato.n))
        medSeleccionados.push({ n:x.dato.n, g:x.dato.g, accion:x.dato.accion, nota:x.dato.nota, dosis:'' });
      pintarMed(); },
    onManual: txt => { if(!txt) return;
      medSeleccionados.push({ n:txt, g:'Otro', accion:'evaluar', nota:'', dosis:'' }); pintarMed(); }
  });
  pintarMed();

  /* --- checkboxes con estilo --- */
  ['antAnest','alerg','vaOtros','ayRiesgo','ayProfilaxis'].forEach(cablearChks);
  ['plTecnica','plVA','plMonEst','plMonAv','plNVPO','plAnalgesia'].forEach(cablearChks);
  $$('#vFicha .chk').forEach(l => {
    l.onclick = () => setTimeout(() => l.classList.toggle('sel', l.querySelector('input').checked), 0);
  });

  /* --- alerta de hipertermia maligna --- */
  const revisarHM = () => {
    const marcado = $$('#antAnest input:checked').some(i => i.value.indexOf('Hipertermia maligna') >= 0);
    $('#alertaHM').style.display = marcado ? '' : 'none';
  };
  $('#antAnest').addEventListener('change', revisarHM); revisarHM();

  /* --- recalcular todo --- */
  const recalcular = () => {
    /* antropometría */
    const peso = val('exPeso'), talla = val('exTalla');
    const imc = calcIMC(peso, talla);
    const p = DB.pacientes[f.pacienteId] || {};
    const ed = edadDe(p.fechaNac, f.fecha);
    $('#exAntropo').innerHTML = imc ?
      '<div class="aviso info">'+ico('info')+'<div><b>IMC '+imc.toFixed(1)+'</b> — '+clasificaIMC(imc)+
      ' · SC '+superficieCorporal(peso,talla).toFixed(2)+' m²'+
      ' · Peso ideal '+(pesoIdeal(talla, p.sexo)||0).toFixed(1)+' kg</div></div>' : '';

    /* MET */
    const m = interpMET(val('mets'));
    $('#metsOut').innerHTML = '<div class="aviso '+(m.nivel==='bajo'?'ok':(m.nivel==='moderado'?'warn':'danger'))+'">'+
      ico('corazon')+'<div>'+m.texto+'</div></div>';

    /* vía aérea */
    const eg = calcElGanzouri({
      aperturaBucal: val('vaApertura'), tiromentoniana: val('vaTiro'),
      mallampati: val('vaMallampati'), cuelloMov: val('vaCuello'),
      protrusion: val('vaProtrusion'), peso: peso, intubacionPrevia: val('vaIntPrev')
    });
    $('#vaScore').innerHTML = tarjetaScore('Índice de El-Ganzouri (riesgo de vía aérea difícil)', eg);

    /* laboratorio */
    const lab = {};
    [['hb','labHb'],['hto','labHto'],['plaquetas','labPlaq'],['rin','labRIN'],['potasio','labK'],
     ['sodio','labNa'],['glucemia','labGlu'],['hba1c','labHba1c'],['creatinina','labCrea']]
      .forEach(([k,id]) => lab[k] = val(id));
    const al = alertasLaboratorio(lab);
    $('#labAlertas').innerHTML = al.map(a =>
      '<div class="aviso '+a[0]+'">'+ico(a[0]==='danger'?'alerta':'info')+'<div>'+esc(a[1])+'</div></div>').join('');
    const g = eGFR(val('labCrea'), ed, p.sexo);
    if($('#labEgfr')) $('#labEgfr').value = g ? Math.round(g)+' ml/min/1,73m² — '+estadioERC(g) : '—';

    /* ASA */
    const a = ASA_PS.find(x => x.v === val('scAsa'));
    $('#scAsaDesc').innerHTML = a ? '<b>'+esc(a.t)+'.</b> '+esc(a.d) : '';

    /* RCRI */
    const rc = {}; RCRI_ITEMS.forEach((it,i) => rc[it.k] = chk('rcri'+i));
    const rcri = calcRCRI(rc);
    $('#rcriOut').innerHTML = tarjetaScore('RCRI', rcri);

    /* ARISCAT */
    const ar = calcARISCAT({
      edad: ed, spo2: val('exSpo2'), hb: val('labHb'),
      infeccionRespiratoria: chk('arInf'), incision: val('arIncision'),
      duracion: val('arDuracion'), urgencia: (f.caracter && f.caracter !== 'programada')
    });
    $('#ariscatOut').innerHTML = tarjetaScore('ARISCAT', ar);

    /* STOP-BANG */
    const sbv = {}; STOPBANG_ITEMS.forEach(it => sbv[it.k] = chk('sb_'+it.k));
    const sb = calcSTOPBANG(sbv);
    $('#sbOut').innerHTML = tarjetaScore('STOP-BANG', sb);

    /* Apfel */
    const apv = {}; APFEL_ITEMS.forEach(it => apv[it.k] = chk('ap_'+it.k));
    const ap = calcApfel(apv);
    $('#apOut').innerHTML = tarjetaScore('Apfel', ap);

    /* Caprini */
    const capSel = $$('.cap:checked').map(i => Number(i.dataset.i));
    const cap = calcCaprini(capSel);
    $('#capOut').innerHTML = tarjetaScore('Caprini', cap);

    /* Ayuno */
    const tipo = val('ayTipo'), hora = val('ayHora');
    const reg = AYUNO_ASA.find(x => x.t === tipo);
    if(reg && hora){
      const [hh,mm] = hora.split(':').map(Number);
      const ahora = new Date();
      const ult = new Date(); ult.setHours(hh, mm, 0, 0);
      if(ult > ahora) ult.setDate(ult.getDate() - 1);
      const hrs = (ahora - ult) / 3600000;
      const ok = hrs >= reg.h;
      $('#ayOut').innerHTML = '<div class="aviso '+(ok?'ok':'warn')+'">'+ico('reloj')+
        '<div><b>'+hrs.toFixed(1)+' h de ayuno</b> — se requieren '+reg.h+' h para «'+esc(reg.t)+'». '+
        (ok ? 'Cumple el ayuno recomendado.' : 'AYUNO INSUFICIENTE: manejar como estómago ocupado o postergar.')+
        '<br><span class="mini">'+esc(reg.d)+'</span></div></div>';
    } else if(reg){
      $('#ayOut').innerHTML = '<div class="aviso info">'+ico('info')+'<div>Requiere '+reg.h+' h de ayuno. '+esc(reg.d)+'</div></div>';
    } else $('#ayOut').innerHTML = '';

    /* estudios sugeridos */
    /* Las marcas salen del catálogo de patologías, no de adivinar por texto */
    const fl = flagsDeAntecedentes(dxSeleccionados);
    const cond = {
      anticoagulado: fl.anticoagulado ||
        medSeleccionados.some(m => /anticoagul|warfar|rivarox|apix|dabig|edox|heparin/i.test(m.n+m.g)),
      renal: fl.renal || (!!val('labCrea') && Number(val('labCrea')) > 1.5),
      hta: !!fl.hta,
      diabetes: !!fl.diabetes,
      cardiopatia: rc.cardiopatia || rc.icc || !!fl.cardiopatia,
      arritmia: !!fl.arritmia,
      respiratorio: !!fl.respiratorio,
      tabaquismo: val('habTabaco') === 'Fumador activo' || !!fl.tabaquismo,
      hepatopatia: !!fl.hepatopatia,
      sangrado: ar.nivel === 'alto' || !!fl.sangrado,
      soplo: false, disnea: false,
      embarazoPosible: p.sexo === 'F' && ed !== null && ed >= 12 && ed <= 55
    };
    const riesgoCx = val('arIncision') === 'periferica' ? 'bajo' : (val('arIncision') === 'toracica' ? 'alto' : 'medio');
    $('#esSugeridos').innerHTML = '<div class="aviso info">'+ico('lista')+
      '<div><b>Estudios preoperatorios sugeridos</b><br>'+
      estudiosSugeridos(ed, val('scAsa'), riesgoCx, cond).map(esc).join(' · ')+'</div></div>';

    /* resumen final */
    const alto = [eg, rcri, ar, sb, cap].filter(x => x.nivel === 'alto');
    $('#resumenRiesgo').innerHTML =
      '<div class="grid c2 mb8">'+
        tarjetaScore('Vía aérea (El-Ganzouri)', eg)+
        tarjetaScore('Cardíaco (RCRI)', rcri)+
        tarjetaScore('Pulmonar (ARISCAT)', ar)+
        tarjetaScore('SAHOS (STOP-BANG)', sb)+
        tarjetaScore('NVPO (Apfel)', ap)+
        tarjetaScore('TEV (Caprini)', cap)+
      '</div>'+
      (alto.length ? '<div class="aviso danger">'+ico('alerta')+'<div><b>'+alto.length+
        ' dominio(s) en riesgo alto.</b> Revisá la fundamentación y las medidas de mitigación antes de emitir la aptitud.</div></div>'
      : '<div class="aviso ok">'+ico('check')+'<div>Ningún dominio evaluado alcanza el nivel de riesgo alto.</div></div>');
  };
  window.__recalcValoracion = recalcular;

  const cont = $('#fiCuerpo');
  cont.addEventListener('input', debounce(recalcular, 200));
  cont.addEventListener('change', recalcular);

  /* segmento de aptitud */
  $$('#segAptitud button').forEach(b => {
    b.onclick = () => { $$('#segAptitud button').forEach(x => x.classList.remove('on')); b.classList.add('on'); };
  });
  $('#scAsaEL').onclick = () => setTimeout(() =>
    $('#scAsaEL').classList.toggle('sel', $('#scAsaE').checked), 0);

  cablearAsignacionActo();      /* punto 14 */
  cablearEnvioValoracion(f);    /* envío de la valoración a contaduría */

  recalcular();
}

function nombreAnt(d){ return d.n || d.d || ''; }

function pintarDx(){
  const c = $('#dxSel'); if(!c) return;
  c.innerHTML = dxSeleccionados.length
    ? dxSeleccionados.map((d,i) =>
        '<span class="pill"><span>'+esc(nombreAnt(d))+'</span>'+
        (d.sis ? '<b class="comp">'+esc(d.sis)+'</b>' : '')+
        '<button data-dx="'+i+'">&times;</button></span>').join('')
    : '<span class="mini">Sin antecedentes cargados.</span>';
  $$('#dxSel button').forEach(b => b.onclick = () => {
    dxSeleccionados.splice(Number(b.dataset.dx), 1); pintarDx();
    if(window.__recalcValoracion) window.__recalcValoracion();
  });
  /* los chips y la revisión por sistemas reflejan lo mismo */
  const tiene = n => dxSeleccionados.some(d => nombreAnt(d) === n);
  $$('#dxChips [data-dxchip]').forEach(b => b.classList.toggle('on', tiene(b.dataset.dxchip)));
  $$('.dx-sis').forEach(i => {
    const on = tiene(i.value);
    i.checked = on;
    const l = i.closest('.chk'); if(l) l.classList.toggle('sel', on);
  });
  pintarMedsDeAntecedentes();
}

/* Al cargar una patología se ofrece la medicación que suele acompañarla */
function pintarMedsDeAntecedentes(){
  const c = $('#dxMeds'); if(!c) return;
  const sug = medicacionSugerida(dxSeleccionados)
    .filter(m => !medSeleccionados.some(x => x.n === m.n));
  if(!sug.length){ c.innerHTML = ''; return; }
  c.innerHTML = '<div class="aviso info">'+ico('jeringa')+'<div>'+
    '<b>Medicación habitual asociada a estos antecedentes.</b> Tocá la que el paciente toma; '+
    'cada una trae su conducta perioperatoria.<div class="chips mt8">'+
    sug.map((m,i) => '<button type="button" class="chip" data-vsug="'+i+'">'+ico('mas')+
      esc(m.n)+'</button>').join('')+'</div></div></div>';
  $$('#dxMeds [data-vsug]').forEach(b => b.onclick = () => {
    const m = sug[Number(b.dataset.vsug)];
    medSeleccionados.push({ n:m.n, g:m.g, accion:m.accion, nota:m.nota, dosis:'', porque:m.porque });
    pintarMed(); pintarMedsDeAntecedentes();
    if(window.__recalcValoracion) window.__recalcValoracion();
  });
}

    '<div class="campo"><label>Carácter</label><select id="fCaracter">'+
      '<option value="">Todos</option>'+
      ['programada','urgencia','emergencia'].map(c => '<option value="'+c+'"'+
        (filtroFichas.caracter===c?' selected':'')+'>'+c.charAt(0).toUpperCase()+c.slice(1)+'</option>').join('')+
    '</select></div>'+
    '<div class="campo"><label>Institución</label><select id="fInst">'+
      '<option value="">Todas</option>'+
      instituciones().map(i => '<option value="'+esc(i.id)+'"'+(filtroFichas.institucion===i.id?' selected':'')+'>'+
        esc(i.nombre.split('"')[0].trim())+'</option>').join('')+

    '<div class="campo"><label>Estado</label><select id="fEstado">'+
      '<option value="">Todos</option>'+
      [['borrador','Borrador'],['realizada','Realizada'],['cerrada','Finalizada']].map(e =>
        '<option value="'+e[0]+'"'+(filtroFichas.estado===e[0]?' selected':'')+'>'+e[1]+'</option>').join('')+
    '</select></div>'+

  (l.length ? '<div class="lista">'+ l.map(f => {
    const p = DB.pacientes[f.pacienteId] || {};
    return '<div class="item" data-f="'+f.id+'">'+
      '<div class="avatar" style="'+(f.caracter==='programada'
        ? 'background:var(--azul-100);color:var(--azul-700)'
        : 'background:var(--danger-bg);color:var(--danger)')+'">'+
        (f.caracter==='programada'?ico('calendario'):ico('alerta'))+'</div>'+
      '<div class="txt"><b>'+esc(p.apellido||'—')+', '+esc(p.nombre||'')+'</b>'+
        '<span>'+esc(f.cirugia||'Sin cirugía')+' · '+fFecha(f.fecha)+' · '+
        esc(nombreInstitucion(f.institucion).split('"')[0].trim())+
        (esAutorFicha(f) ? '' : ' · '+esc(autorFicha(f)))+'</span></div>'+
      '<div class="der">'+(esAutorFicha(f)?'':'<span class="tag info">de colega</span> ')+etiquetaEstadoFicha(f)+
        (f.hon && f.hon.total ? '<div class="mini mt8">'+fMoneda(f.hon.total)+'</div>' : '')+
      '</div></div>';
  }).join('') +'</div>'
  : '<div class="vacio">'+ico('ficha')+'<b>Sin fichas</b><span>Creá la primera desde «Nueva ficha».</span></div>');

  $('#btnNuevaFicha').onclick = () => abrirFicha(null);
  $('#fBuscar').oninput = debounce(e => { filtroFichas.texto = e.target.value; vistaFichas();
    const i = $('#fBuscar'); if(i){ i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 260);
  $$('#fAlcance button').forEach(b => b.onclick = () => {
    filtroFichas.alcance = b.dataset.v; vistaFichas(); });
  $('#fCaracter').onchange = e => { filtroFichas.caracter = e.target.value; vistaFichas(); };
  $('#fInst').onchange = e => { filtroFichas.institucion = e.target.value; vistaFichas(); };
  $('#fEstado').onchange = e => { filtroFichas.estado = e.target.value; vistaFichas(); };
  $$('#vFichas .item').forEach(it => it.onclick = () => abrirFicha(it.dataset.f));
}

/* Las fichas viejas guardaban el acto de otra manera. Se traduce al abrir,
   sin tocar la base: si el anestesiologo guarda, se graba ya migrada. */
function migrarFicha(f){
  const a = f.acto = f.acto || {};
  if(!a.__v2){
    a.__v2 = true;
    a.drogas   = a.drogas   || [];
    a.controles= a.controles|| [];
    a.eventos2 = a.eventos2 || [];
    a.monitor  = a.monitor  || [];
    a.monitorExtra = a.monitorExtra || [];
    a.tecnicas = a.tecnicas || [];
    a.balance  = a.balance || {};
    /* el balance vivia en campos sueltos */
    ['cristaloides','coloides','diuresis'].forEach(k => {
      if(a[k] && a.balance[k] === undefined) a.balance[k] = a[k];
    });
    if(a.sangrado && a.balance.sangrado === undefined) a.balance.sangrado = a.sangrado;
    /* el texto libre de farmacos se conserva como nota, no se inventa una
       lista de drogas que nadie cargo asi */
    if(a.farmacos && !a.drogasNota) a.drogasNota = a.farmacos;
    /* los eventos eran una lista de casillas */
    if((a.eventos || []).length && !a.eventos2.length){
      a.eventos2 = a.eventos.filter(e => e !== 'Sin eventos').map(e => ({
        id: uid('ev'), tipo:e, hora:'', descripcion: a.eventosDetalle || '', conducta:'' }));
      if((a.eventos || []).indexOf('Sin eventos') >= 0) a.sinEventos = true;
    }
    /* tecnica y via aerea */
    if(!a.tecnicas.length && (a.tecnica || []).length){
      const mapa = [['general','general'],['sedaci','sedacion'],['raqu','raquidea'],
                    ['peridural','peridural'],['combinada','combinada'],['bloqueo','bloqueo']];
      a.tecnica.forEach(t => {
        const m = mapa.find(x => norm(t).indexOf(x[0]) >= 0);
        if(m && a.tecnicas.indexOf(m[1]) < 0) a.tecnicas.push(m[1]);
      });
      a.tecnicaDetalle = a.tecnica.join(' · ');
    }
    if(!a.dispositivo && (a.dispositivosVA || []).length){
      const d = a.dispositivosVA.join(' ');
      a.dispositivo = /endotraqueal/i.test(d) ? 'tet' : (/laríngea|laringea/i.test(d) ? 'ml' : 'ninguno');
      a.tamano = a.tubo || '';
    }
    if(!a.monitor.length && (f.plan || {}).monitoreoEstandar){
      const mapa = { 'ECG continuo':'ECG', 'Presión arterial no invasiva (PANI)':'PANI',
        'Oximetría de pulso (SpO₂)':'SpO₂', 'Capnografía (EtCO₂)':'EtCO₂',
        'Temperatura':'Temperatura', 'Monitoreo de bloqueo neuromuscular (TOF)':'TOF' };
      f.plan.monitoreoEstandar.forEach(m => { if(mapa[m]) a.monitor.push(mapa[m]); });
    }
  }
  /* El equipo quirurgico vivia suelto en la raiz de la ficha, cargado en el
     paso 1. Ahora se registra en el paso «Anestesia», dentro de f.acto, para
     que tambien lo pueda guardar el colega que toma el acto. Las fichas
     viejas se mudan solas, sin perder nada. */
  if(!a.equipo){
    a.equipo = { cirujano:f.cirujano || '', cirujanoMP:'', ayudante:f.ayudante || '',
                 instrumentador:f.instrumentador || '', anestesista2:f.anestesista2 || '',
                 circulante:'' };
  }
  /* Adjuntos de la foja o parte quirurgico (dentro del acto, ver core.js) */
  a.parteQuirurgico = a.parteQuirurgico || f.parteQuirurgico || [];
  if(f.parteQuirurgico) delete f.parteQuirurgico;

  /* la recuperacion se separo del acto */
  if(!f.recup){
    f.recup = {
      aldrete: a.aldrete || {}, aldreteTotal: a.aldreteTotal || 0,
      eva: '', nauseas: '', destino: a.destinoReal || '',
      observaciones: a.observaciones || '', hora: a.salida || ''
    };
  }
  f.firma = f.firma || {};
  /* Antes del flujo de trabajo, «cerrada» era el equivalente de firmada.
     Se respeta para que las fichas viejas no aparezcan como pendientes. */
  if(f.estado === 'cerrada' && !f.firma.firmado){
    const u = DB.usuarios[actorFicha(f)] || DB.usuarios[f.ownerUid] || {};
    f.firma = {
      firmado:true, uid: u.uid || f.ownerUid,
      nombre: (u.apellido||'')+', '+(u.nombre||''),
      mp: u.matriculaProvincial || '',
      fecha: f.fecha || hoyISO(), hora: (f.acto||{}).salida || '',
      firmaDataUrl: u.firmaDataUrl || '',
      retroactiva: true
    };
  }
  return f;
}

function abrirFicha(id, pacienteId){
  const nueva = !id;
  if(id && !DB.fichas[id]) return toast('No se encontró la ficha.', 'err');
  fichaActual = migrarFicha(id ? JSON.parse(JSON.stringify(DB.fichas[id])) : {
    id: uid('fic'), ownerUid: SESION.uid, pacienteId: pacienteId || '',
    fecha: hoyISO(), hora: ahoraHora(), caracter:'programada',
    institucion:'', obraSocial:'', estado:'borrador',
    v:{}, plan:{}, acto:{}, recup:{}, hon:{}, consent:{}, firma:{},
    creado:new Date().toISOString()
  });
  if(pacienteId) fichaActual.pacienteId = pacienteId;
  cxSeleccionada = fichaActual.cirugia ? {
    n: fichaActual.cirugia, ua: fichaActual.cirugiaUA,
    cod: fichaActual.cirugiaCod || '', comp: fichaActual.cirugiaComp || '',
    grillaB: !!fichaActual.cirugiaGrillaB, nota: fichaActual.cirugiaNota || ''
  } : null;
  /* Si la ficha es de un colega y el acto no es mio, se entra por el paso
     de anestesia: es lo unico que ese colega puede tocar. */
  const g = id ? DB.fichas[id] : null;
  pasoFicha = (g && !puedeEditarFicha(g) && !esActorFicha(g)) ? 'anestesia' : 'paciente';
  irA('ficha');
  pintarFicha();
  if(nueva) toast('Nueva ficha creada. Recordá guardarla.', 'ok');
}

/* Avanza al paso siguiente / anterior guardando lo que haya en pantalla */
function irAPaso(k){
  guardarPasoActual();
  pasoFicha = k;
  pintarFicha();
  const m = $('main'); if(m) m.scrollTop = 0;
  window.scrollTo({ top:0, behavior:'auto' });
}
function pasoVecino(delta){
  const i = PASOS_FICHA.findIndex(p => p.k === pasoFicha);
  const j = i + delta;
  return (j >= 0 && j < PASOS_FICHA.length) ? PASOS_FICHA[j].k : null;
}

/* Cuánto tiene completo cada paso: el punto del stepper se pinta con esto */
function estadoPaso(f, k){
  const v = f.v || {}, a = f.acto || {}, r = f.recup || {};
  if(k === 'paciente')     return f.pacienteId && f.cirugia && f.institucion ? 'ok' : 'pend';
  if(k === 'preanestesia') return (v.scores||{}).asa ? ((v.riesgo||{}).fundamento ? 'ok' : 'medio') : 'pend';
  if(k === 'anestesia')    return (a.tecnicas||[]).length ? (a.finCirugia ? 'ok' : 'medio') : 'pend';
  if(k === 'recuperacion') return r.aldreteTotal ? 'ok' : 'pend';
  if(k === 'firma')        return (f.firma||{}).firmado ? 'ok' : 'pend';
  return 'pend';
}

   ========================================================================= */
function pintarFicha(){
  const f = fichaActual;
  const guardada = DB.fichas[f.id];
  const soloActo = !!guardada && !puedeEditarFicha(guardada);
  const p = DB.pacientes[f.pacienteId] || null;
  const cont = $('#vFicha');
  const idx = PASOS_FICHA.findIndex(x => x.k === pasoFicha);
  const firmada = !!(f.firma || {}).firmado;

  cont.innerHTML = ''+
  '<div class="fi-top no-print">'+
    '<button class="btn ghost chico" id="fiVolver">'+ico('atras')+' Fichas</button>'+
    '<div class="fi-top-txt">'+
      '<h1>'+(p ? esc(p.apellido+', '+p.nombre) : 'Ficha sin paciente')+'</h1>'+
      '<p>'+(p && p.dni ? 'DNI/HC '+esc(p.hc || p.dni)+' · ' : '')+
        (p ? (edadDe(p.fechaNac, f.fecha) !== null ? edadDe(p.fechaNac, f.fecha)+' años · ' : '') : '')+
        esc(nombreInstitucion(f.institucion).split('"')[0].trim() || 'sin institución')+'</p>'+
    '</div>'+
    etiquetaEstadoFicha(f)+
  '</div>'+

  /* ------- barra de pasos, igual que el flujo de trabajo del manual ------- */
  '<div class="stepper no-print">'+ PASOS_FICHA.map((s,i) => {
    const est = estadoPaso(f, s.k);
    return '<button type="button" class="step'+(s.k===pasoFicha?' on':'')+' '+est+
      '" data-paso="'+s.k+'">'+
      '<span class="dot">'+(est==='ok' ? ico('check') : ico(s.ico))+'</span>'+
      '<span class="lbl">'+esc(s.t)+'</span>'+
      (i < PASOS_FICHA.length-1 ? '<span class="linea"></span>' : '')+
      '</button>';
  }).join('') +'</div>'+
  '<div class="paso-cabecera no-print">'+
    '<div><b>Paso '+(idx+1)+' de '+PASOS_FICHA.length+'</b> · '+esc(PASOS_FICHA[idx].sub)+'</div>'+
    '<div class="barra"><span style="width:'+Math.round((idx+1)/PASOS_FICHA.length*100)+'%"></span></div>'+
  '</div>'+

  (firmada ? '<div class="aviso ok no-print">'+ico('candado')+'<div><b>Registro finalizado y firmado.</b> '+
    'Queda en sólo lectura. Si hay que corregir algo, reabrilo desde el paso «Firmar».</div></div>' : '')+
  (soloActo ? bannerFichaAjena(f) : bannerFaltantes(f))+

  '<div id="fiCuerpo"></div>'+

  /* ---------------------- navegación entre pasos ---------------------- */
  '<div class="paso-nav no-print">'+
    (pasoVecino(-1) ? '<button class="btn ghost" id="fiAtras">'+ico('atras')+' Anterior</button>' : '<span></span>')+
    '<button class="btn pri grande" id="fiGuardar">'+ico('check')+' Guardar</button>'+
    (pasoVecino(1) ? '<button class="btn pri" id="fiSiguiente">Siguiente '+
      ico('flecha').replace('<svg','<svg style="transform:rotate(-90deg)"')+'</button>' : '<span></span>')+
  '</div>'+

  '<div class="btn-row mt14 no-print fi-extras">'+
    '<button class="btn ghost chico" id="fiHon">'+ico('dinero')+' Honorarios</button>'+
    (soloActo ? '' : '<button class="btn ghost chico" id="fiConsent">'+ico('firma')+' Consentimiento</button>')+
    '<button class="btn ghost chico" id="fiWord">'+ico('word')+' Word</button>'+
    '<button class="btn ghost chico" id="fiPdf">'+ico('imprimir')+' PDF</button>'+
    /* Al paciente se le manda SOLO la valoración pre-anestésica con su
       consentimiento: es la documentación que él necesita llevar el día de la
       cirugía. El registro intraoperatorio, la recuperación y el cierre
       firmado son historia clínica para el equipo tratante y para la
       auditoría, no para entregarle por correo. Por eso el botón sólo existe
       en los dos pasos que componen la valoración. */
    ((soloActo || ['paciente','preanestesia'].indexOf(pasoFicha) < 0)
      ? '' : '<button class="btn ghost chico" id="fiMail">'+ico('adjunto')+
        ' Enviar valoración al paciente</button>')+
    (DB.fichas[f.id] && !soloActo ? '<button class="btn danger chico" id="fiBorrar">'+ico('borrar')+'</button>' : '')+
  '</div>';

  $('#fiVolver').onclick = () => { guardarPasoActual(); irA('fichas'); vistaFichas(); };
  /* El banner de ficha ajena vive fuera del cuerpo del paso: su botón se
     cablea acá para que funcione en los cinco pasos, no sólo en el primero. */
  if($('#fiTomar')) $('#fiTomar').onclick = () => tomarActo(f);
  $$('#vFicha [data-paso]').forEach(b => b.onclick = () => irAPaso(b.dataset.paso));
  if($('#fiAtras'))     $('#fiAtras').onclick = () => irAPaso(pasoVecino(-1));
  if($('#fiSiguiente')) $('#fiSiguiente').onclick = () => irAPaso(pasoVecino(1));
  $('#fiGuardar').onclick = () => { guardarPasoActual(); guardarFicha(); };
  $('#fiHon').onclick = () => { guardarPasoActual(); abrirHonorarios(fichaActual); };
  $('#fiWord').onclick = () => { guardarPasoActual(); exportarFichaWord(fichaActual); };
  $('#fiPdf').onclick  = () => { guardarPasoActual(); imprimirFicha(fichaActual); };
  if($('#fiConsent')) $('#fiConsent').onclick = () => { guardarPasoActual(); abrirConsentimiento(fichaActual); };
  if($('#fiMail')) $('#fiMail').onclick = () => { guardarPasoActual(); enviarDocumentacionPaciente(fichaActual); };
  if($('#fiBorrar')) $('#fiBorrar').onclick = () => confirmar('Eliminar ficha',
    'Se elimina de forma permanente en todos los dispositivos. Esta acción no se puede deshacer.',
    () => { eliminar('fichas', f.id); auditar('ficha-borrar', f.id);
            toast('Ficha eliminada.', 'ok'); irA('fichas'); vistaFichas(); }, 'Eliminar', true);

  const cuerpo = $('#fiCuerpo');
  if(pasoFicha === 'paciente')          { cuerpo.innerHTML = htmlPasoPaciente(f);     cablearPasoPaciente(f); }
  else if(pasoFicha === 'preanestesia') { cuerpo.innerHTML = htmlValoracion(f);       cablearValoracion(f); }
  else if(pasoFicha === 'anestesia')    { pintarPasoAnestesia(f); }
  else if(pasoFicha === 'recuperacion') { cuerpo.innerHTML = htmlPasoRecuperacion(f); cablearPasoRecuperacion(f); }
  else                                  { cuerpo.innerHTML = htmlPasoFirma(f);        cablearPasoFirma(f); }

  /* Un colega puede tocar el acto y la recuperación; el resto queda en
     lectura. Y una ficha firmada no se toca hasta que se reabra. */
  const editable = (!soloActo || pasoFicha === 'anestesia' || pasoFicha === 'recuperacion')
    && (!firmada || pasoFicha === 'firma');
  if(!editable) bloquearCuerpo();
}

/* Deja el paso en modo lectura: se ve todo, no se cambia nada.
   Lo que sirve para MIRAR sigue vivo: las solapas del acto, el detalle de
   dosis, el gráfico y el vademécum. Bloquear también la navegación dejaría
   una ficha firmada imposible de consultar. */
const SOLO_LECTURA = '.acto-solapas button, [data-lectura], [data-drver]';
function bloquearCuerpo(){
  $$('#fiCuerpo input, #fiCuerpo select, #fiCuerpo textarea').forEach(e => { e.disabled = true; });
  $$('#fiCuerpo button').forEach(e => {
    if(e.closest(SOLO_LECTURA) || e.matches(SOLO_LECTURA)) return;
    e.disabled = true; e.style.opacity = '.5';
  });
  $$('#fiCuerpo .buscador').forEach(e => { e.style.opacity = '.55'; });
  $$('#fiCuerpo .chk, #fiCuerpo .seg, #fiCuerpo .chips').forEach(e => { e.style.pointerEvents = 'none'; });
}

/* =========================================================================
   GUARDADO
   ========================================================================= */
function guardarPasoActual(){
  const f = fichaActual;
  const guardada = DB.fichas[f.id];
  if((f.firma || {}).firmado && pasoFicha !== 'firma') return;   /* firmada: no se toca */
  if(guardada && !puedeEditarFicha(guardada)){
    if(pasoFicha === 'anestesia')    f.acto = leerPasoAnestesia();
    if(pasoFicha === 'recuperacion') f.recup = leerPasoRecuperacion();
    return;                                   /* lo demás no se toca */
  }
  if(pasoFicha === 'paciente')          Object.assign(f, leerPasoPaciente());
  else if(pasoFicha === 'preanestesia'){ f.v = leerValoracion(); f.plan = leerPlan();
                                        Object.assign(f, leerAsignacionActo()); }
  else if(pasoFicha === 'anestesia')     f.acto = leerPasoAnestesia();
  else if(pasoFicha === 'recuperacion')  f.recup = leerPasoRecuperacion();
}

function guardarFicha(silencioso){
  const f = fichaActual;
  const guardada = DB.fichas[f.id];

  /* Ficha de un colega: se escribe únicamente lo que le corresponde, sobre la
     versión vigente en la base, para no pisar nada de lo que él cargó. */
  if(guardada && !puedeEditarFicha(guardada)){
    const base = migrarFicha(JSON.parse(JSON.stringify(guardada)));
    base.acto = f.acto || {};
    base.recup = f.recup || {};
    if(esActorFicha(guardada) && f.hon) base.hon = f.hon;   /* su propio honorario */
    base.actoPorUid = SESION.uid;
    base.actoPorNombre = USUARIO ? (USUARIO.apellido + ', ' + USUARIO.nombre) : '';
    base.modificado = new Date().toISOString();
    base.modificadoPor = SESION.uid;
    base.modificadoPorNombre = base.actoPorNombre;
    escribir('fichas', base.id, base);
    auditar('ficha-acto-colega',
      'Acto anestésico registrado en la ficha de ' + autorFicha(guardada));
    fichaActual = base;
    if(!silencioso) toast('Acto anestésico guardado' + (nubeOK ? ' y sincronizado.' : '.'), 'ok');
    pintarFicha();
    return;
  }

  if(!f.pacienteId){ pasoFicha = 'paciente'; pintarFicha();
    return toast('Seleccioná un paciente en el paso 1.', 'err'); }
  f.modificado = new Date().toISOString();
  f.modificadoPor = SESION.uid;
  f.modificadoPorNombre = USUARIO ? (USUARIO.apellido + ', ' + USUARIO.nombre) : '';
  escribir('fichas', f.id, f);
  auditar('ficha-guardar', (DB.pacientes[f.pacienteId]||{}).apellido + ' — ' + (f.cirugia||''));
  if(!silencioso) toast('Ficha guardada' + (nubeOK ? ' y sincronizada.' : ' en este dispositivo.'), 'ok');
  pintarFicha();
}

        toast('Se usó el financiador que ya existía.', 'ok');

    };
    $('#noNombre').oninput = debounce(revisar, 250);

      if(!n) return toast('Ingresá el nombre.', 'err');

            'Cardiovascular, Tórax, Neurocirugía, Hemodinamia, Maxilofacial o cirujano itinerante.</div>' : '')+
        (cxSeleccionada.nota
          ? '<div class="ayuda">'+esc(cxSeleccionada.nota.replace(/;/g,' · ')
              .replace('RX:','Requiere radioscopia: ').replace('RF:','Radiofrecuencia: ')
              .replace('INT:','Internación: '))+'</div>' : '')+
        (cxSeleccionada.cod && !cxSeleccionada.ua
          ? '<div class="ayuda">El nomenclador tabula por complejidad. Si tu convenio se liquida '+
            'por unidades anestésicas, cargá las UA en Honorarios.</div>' : '')

  montarBuscador({
    input:$('#cxBuscar'), caja:$('#cxRes'), manual:true,
    fuente: () => NOMENCLADOR.map(x => ({
        cod: x.cod,
        etiqueta: x.n,
        sub: 'Complejidad '+x.comp+' · '+x.grupo+(x.sub ? ' · '+x.sub : '')+(x.grillaB ? ' · Grilla B' : ''),
        /* el nombre va primero para que el ranking por prefijo funcione;
           el codigo sigue siendo buscable */
        busca: norm(x.n+' '+x.cod+' '+x.grupo+' '+x.sub), peso:0, dato:x
      })).concat(todasCirugias().map(x => ({
        etiqueta: x.n, sub: 'Catálogo propio · '+x.esp+' · '+x.ua+' unidades anestésicas',
        busca: norm(x.n+' '+x.esp), peso:1, dato:x }))),
    onElegir: x => {
      const d = x.dato;
      cxSeleccionada = d.cod
        ? { n:d.n, cod:d.cod, comp:d.comp, grillaB:d.grillaB, nota:d.nota, ua:0 }
        : { n:d.n, ua:d.ua, cod:'', comp:'', grillaB:false, nota:'' };
      if(!$('#qxEsp').value && d.esp) $('#qxEsp').value = d.esp;
      pintarCx();
    },
    onManual: txt => { if(!txt) return;
      abrirModal('Agregar procedimiento al catálogo',
        campoTxt('ncNombre','Nombre del procedimiento', txt)+
        campoSel('ncEsp','Especialidad', ESPECIALIDADES)+
        campoNum('ncUA','Unidades anestésicas', 10)+
        '<div class="ayuda">Sólo para prácticas que no figuran en el nomenclador anestésico AFAAR. '+
        'El nomenclador indica facturar por similitud antes que crear una práctica nueva.</div>',
        '<button class="btn ghost" data-cerrar>Cancelar</button>'+
        '<button class="btn pri" id="ncGuardar">Agregar</button>');
      $('#ncGuardar').onclick = () => {
        const n = $('#ncNombre').value.trim(); if(!n) return;
        agregarExtra('cx', { n, esp:$('#ncEsp').value, ua:Number($('#ncUA').value)||10 });
        cxSeleccionada = { n, ua:Number($('#ncUA').value)||10, cod:'', comp:'', grillaB:false, nota:'' };
        cerrarModal(); pintarCx(); toast('Procedimiento agregado al catálogo.', 'ok');
      };
    }
  });
  pintarCx();
}

function leerPasoPaciente(){
  const b = $('#qxCaracter button.on');
  /* el peso y la talla se guardan en la historia del paciente, que es donde
     viven: la ficha no lleva su propia copia que después queda vieja */
  const pid = val('qxPaciente');
  if(pid && DB.pacientes[pid] && $('#qxPeso')){
    const p = JSON.parse(JSON.stringify(DB.pacientes[pid]));
    const peso = val('qxPeso'), talla = val('qxTalla');
    if(String(p.peso||'') !== String(peso) || String(p.talla||'') !== String(talla)){
      p.peso = peso; p.talla = talla;
      p.modificado = new Date().toISOString(); p.modificadoPor = SESION.uid;
      escribir('pacientes', pid, p);
    }
  }
  return {
    pacienteId: pid, caracter: b ? b.dataset.v : 'programada',
    fecha: val('qxFecha'), hora: val('qxHora'), turno: val('qxTurno'),
    institucion: val('qxInst'), obraSocial: val('qxOS'), nroAfiliado: val('qxAfiliado'),
    especialidad: val('qxEsp'),
    diagnostico: val('qxDx'),
    cirugia: cxSeleccionada ? cxSeleccionada.n : '',
    cirugiaUA: cxSeleccionada ? cxSeleccionada.ua : 0,
    cirugiaCod: cxSeleccionada ? (cxSeleccionada.cod || '') : '',
    cirugiaComp: cxSeleccionada ? (cxSeleccionada.comp || '') : '',
    cirugiaGrillaB: cxSeleccionada ? !!cxSeleccionada.grillaB : false,
    cirugiaNota: cxSeleccionada ? (cxSeleccionada.nota || '') : '',
    lateralidad: val('qxLateralidad')
    /* El equipo quirúrgico se lee en el paso Anestesia (acto.equipo) y la
       designación del actuante en el paso Preanestesia (punto 14). Si se
       leyeran acá, cada vez que se guarda el paso 1 se borrarían. */
  };
}

/* Un colega toma el acto operatorio a su nombre */
function tomarActo(f){
  confirmar('Voy a realizar este acto',
    'Vas a quedar registrado como el anestesiólogo que realiza este acto. '+
    'El honorario del acto pasa a tu nombre; la consulta prequirúrgica sigue siendo de '+
    esc(autorFicha(f))+'.',
    () => {
      const base = migrarFicha(JSON.parse(JSON.stringify(DB.fichas[f.id])));
      base.asignadoUid = SESION.uid;
      base.actorExterno = '';
      base.modificado = new Date().toISOString();
      escribir('fichas', base.id, base);
      auditar('ficha-tomar-acto', 'Acto de la ficha de ' + autorFicha(base));
      fichaActual = base;
      pasoFicha = 'anestesia';
      pintarFicha();
      toast('El acto quedó a tu nombre.', 'ok');
    }, 'Tomar el acto');
}

function cablearPasoRecuperacion(f){
  const segs = id => $$('#'+id+' button').forEach(b => b.onclick = () => {
    $$('#'+id+' button').forEach(x => x.classList.remove('on')); b.classList.add('on'); });
  segs('reNauseas'); segs('reDestino');

  const recalc = () => {
    let total = 0;
    ALDRETE.forEach(item => {
      const on = $('#fiCuerpo [data-ald="'+item.k+'"] button.on');
      const v = on ? Number(on.dataset.v) : null;
      if(v !== null) total += v;
      const t = $('#aldTxt_'+item.k);
      const op = v !== null ? item.o.find(o => String(o[0]) === String(v)) : null;
      if(t) t.textContent = op ? op[1] : 'Sin evaluar';
    });
    const completo = ALDRETE.every(item => $('#fiCuerpo [data-ald="'+item.k+'"] button.on'));
    const ok = total >= 9;
    $('#aldTotal').innerHTML = '<span class="lbl">Puntaje total</span>'+
      '<span class="val '+(completo ? (ok?'ok':'warn') : '')+'">'+(completo ? total : '—')+' / 10</span>';
    $('#aldOut').innerHTML = !completo
      ? '<div class="aviso info">'+ico('info')+'<div>Completá los cinco parámetros para obtener el puntaje.</div></div>'
      : '<div class="aviso '+(ok?'ok':'warn')+'">'+ico(ok?'check':'alerta')+
        '<div><b>Aldrete '+total+'/10</b> — '+(ok
          ? 'Cumple criterios de alta de la recuperación postanestésica.'
          : 'No alcanza el puntaje de alta (≥ 9). Continuar la vigilancia en la URPA.')+'</div></div>';
  };
  ALDRETE.forEach(item => {
    $$('#fiCuerpo [data-ald="'+item.k+'"] button').forEach(b => b.onclick = () => {
      $$('#fiCuerpo [data-ald="'+item.k+'"] button').forEach(x => x.classList.remove('on'));
      b.classList.add('on'); recalc();
    });
  });
  recalc();

  const eva = $('#reEva');
  const pintarEva = () => {
    const v = Number(eva.value);
    $('#reEvaOut').textContent = v;
    eva.className = v <= 3 ? 'ok' : (v <= 6 ? 'warn' : 'danger');
    $('#reEvaTxt').innerHTML = '<div class="aviso '+(v<=3?'ok':(v<=6?'warn':'danger'))+'">'+
      ico(v<=3?'check':'alerta')+'<div>'+(v===0 ? 'Sin dolor.'
        : v<=3 ? 'Dolor leve. Analgesia habitual.'
        : v<=6 ? 'Dolor moderado. Revisar el esquema analgésico antes del alta de la URPA.'
        : 'Dolor severo. Rescate analgésico y reevaluación antes del alta.')+'</div></div>';
  };
  eva.oninput = pintarEva;
  pintarEva();
}

function htmlPasoFirma(f){

  const a = f.acto || {}, r = f.recup || {}, v = f.v || {}, pl = f.plan || {};
  const fi = f.firma || {};
  const bal = calcularBalance(a.balance);
  const durCx = minutosEntre(a.inicioCirugia, a.finCirugia);
  const durAn = minutosEntre(a.inicioAnestesia, a.finAnestesia);
  const eventos = (a.eventos2 || []);
  const faltan = faltantesFicha(f).filter(x => x.critico);
  const disp = DISPOSITIVOS_FLUJO.find(d => d.k === a.dispositivo);
  const alertas = alertasVitales(a.controles || []);
  const analgesia = (pl.analgesia || []).length || pl.analgesiaDetalle ? 'Planificada' : 'Sin planificar';

    '<div class="res-fila"><span>'+esc(l)+'</span><b'+(cls?' class="'+cls+'"':'')+'>'+valor+'</b></div>';

      '</div>'+
    '</div>'+

  /* ---------------- VENTANA 9: resumen de anestesia ---------------- */

      linea('Vía aérea', esc((disp ? disp.t : '—') + (a.tamano ? ' '+a.tamano : '') +
        (a.vaDificil === 'si' ? ' · difícil' : ' · no difícil')),

function cablearPasoFirma(f){
  cablearParteQuirurgico(f);
  cablearEnvioFicha(f);

  if($('#fiReabrir')) $('#fiReabrir').onclick = () => confirmar('Reabrir la ficha',
    'La ficha vuelve a quedar editable. Queda registrado en la auditoría quién la reabrió y cuándo.',
    () => {
      fichaActual.firma = Object.assign({}, fichaActual.firma, { firmado:false,
        reabiertaPor: SESION.uid, reabierta: new Date().toISOString() });
      fichaActual.estado = 'realizada';
      auditar('ficha-reabrir', fichaActual.id);
      guardarFicha();
    }, 'Reabrir');

  if($('#fiDocPdf'))  $('#fiDocPdf').onclick  = () => imprimirFicha(fichaActual);
  if($('#fiDocWord')) $('#fiDocWord').onclick = () => exportarFichaWord(fichaActual);
  if($('#fiInicio'))  $('#fiInicio').onclick  = () => irA('panel');

  $$('#fiDestino button').forEach(b => b.onclick = () => {
    $$('#fiDestino button').forEach(x => x.classList.remove('on')); b.classList.add('on'); });

  if(!$('#fiFirmaCanvas')) return;
  let firma = (USUARIO && USUARIO.firmaDataUrl) || '';
  const c = montarFirma($('#fiFirmaCanvas'), d => firma = d);
  setTimeout(() => { if(firma) c.cargar(firma); }, 150);
  $('#fiFirmaLimpiar').onclick = () => { c.limpiar(); firma = ''; };
  $('#fiFirmaPerfil').onclick = () => {
    if(!USUARIO || !USUARIO.firmaDataUrl) return toast('No tenés firma guardada en Mi perfil.', 'err');
    c.limpiar(); c.cargar(USUARIO.firmaDataUrl); firma = USUARIO.firmaDataUrl;
  };
  $('#fiFirmar').onclick = () => {
    if(!firma) return toast('Firmá antes de finalizar el registro.', 'err');
    confirmar('Finalizar y firmar',
      'La ficha queda cerrada y en sólo lectura. Se puede reabrir después, dejando constancia.',
      () => {
        const u = USUARIO || {};
        /* el destino y las observaciones que se ajustaron acá van a la recuperación */
        const d = $('#fiDestino button.on');
        fichaActual.recup = Object.assign({}, fichaActual.recup, {
          destino: d ? d.dataset.v : (fichaActual.recup||{}).destino,
          observaciones: val('fiObsFinal')
        });
        fichaActual.firma = {
          firmado:true, uid:SESION.uid,
          nombre:(u.apellido||'')+', '+(u.nombre||''),
          mp: u.matriculaProvincial || '',
          fecha: hoyISO(), hora: ahoraHora(), firmaDataUrl: firma
        };
        fichaActual.estado = 'cerrada';
        auditar('ficha-firmar', fichaActual.id);
        guardarFicha();
        toast('Ficha anestésica completa.', 'ok');
      }, 'Finalizar y firmar');
  };
}

function cablearHonorariosModal(f){
  cablearGenerico();
  /* La consulta la edita quien hizo la valoración; el acto, quien opera. */
  const puedeConsulta = esAutorFicha(f) || esCoordinador();
  const puedeActoHon  = esActorFicha(f) || esCoordinador();
  if(!puedeConsulta) ['hcModalidad','hcMonto','hcEstado','hcFecha','hcComprobante','hcCobrado']
    .forEach(i => { const e = $('#'+i); if(e) e.disabled = true; });
  if(!puedeActoHon){
    ['hoModalidad','hoUA','hoVU','hoMontoFijo','hoEstado','hoFecha','hoComprobante',
     'hoCobrado','hoObs'].forEach(i => { const e = $('#'+i); if(e) e.disabled = true; });
    $$('#hoAdic input').forEach(e => { e.disabled = true; });
    const a = $('#hoAdic'); if(a) a.style.pointerEvents = 'none';
  }
  const recalc = () => {
    const mod = val('hoModalidad');
    const m = MODALIDADES_HONORARIOS.find(x => x.id === mod);
    $('#hoModDesc').textContent = m ? m.d : '';
    const porUnidades = mod === 'abierto';
    const fijo = (mod === 'cerrado' || mod === 'particular');
    $('#hoAbierto').style.display = porUnidades ? '' : 'none';
    $('#hoFijo').style.display    = fijo ? '' : 'none';

    let total = 0, detalle = '';
    if(porUnidades){
      const ua = Number(val('hoUA')) || 0, vu = Number(val('hoVU')) || 0;
      const base = ua * vu;
      const sel = $$('#hoAdic input:checked').map(i => i.value);
      const pct = sel.reduce((a,id) => a + (ADICIONALES_HONORARIOS.find(x => x.id === id) || {pct:0}).pct, 0);
      total = base * (1 + pct/100);
      detalle = '<table><tbody>'+
        '<tr><td>Base: '+ua+' UA × '+fMoneda(vu)+'</td><td class="num">'+fMoneda(base)+'</td></tr>'+
        sel.map(id => { const a = ADICIONALES_HONORARIOS.find(x => x.id === id);
          return '<tr><td>'+esc(a.n)+' (+'+a.pct+' %)</td><td class="num">'+fMoneda(base*a.pct/100)+'</td></tr>'; }).join('')+
        '<tr style="font-weight:800"><td>TOTAL</td><td class="num">'+fMoneda(total)+'</td></tr>'+
      '</tbody></table>';
      $('#hoCalculo').innerHTML = '<div class="tabla-wrap">'+detalle+'</div>'+
        (vu === 0 ? '<div class="aviso warn mt8">'+ico('alerta')+
          '<div>No hay valor de unidad cargado para «'+esc(f.obraSocial||'este financiador')+'». '+
          'El coordinador puede definirlo en Catálogos para que se complete solo.</div></div>' : '');
    } else if(fijo){
      total = Number(val('hoMontoFijo')) || 0;
    }
    const mc = MODALIDADES_CONSULTA.find(x => x.id === val('hcModalidad'));
    if($('#hcDesc')) $('#hcDesc').textContent = mc ? mc.d : '';
    const sinConsulta = val('hcModalidad') === 'incluida' || val('hcModalidad') === 'sincargo';
    if($('#hcMontoBox')) $('#hcMontoBox').style.display = sinConsulta ? 'none' : '';
    const consulta = sinConsulta ? 0 : (Number(val('hcMonto')) || 0);

    $('#hoResumen').innerHTML = '<div class="grid c3">'+
      '<div class="kpi aqua"><div class="lbl">'+ico('valoracion')+' Consulta</div>'+
        '<div class="val">'+fMoneda(consulta)+'</div>'+
        '<div class="pie">'+esc(autorFicha(fichaActual))+'</div></div>'+
      '<div class="kpi azul"><div class="lbl">'+ico('jeringa')+' Acto anestésico</div>'+
        '<div class="val">'+fMoneda(total)+'</div>'+
        '<div class="pie">'+esc(nombreActor(fichaActual))+'</div></div>'+
      '<div class="kpi ok"><div class="lbl">'+ico('dinero')+' Total de la ficha</div>'+
        '<div class="val">'+fMoneda(consulta + total)+'</div>'+
        '<div class="pie">'+(esAutorFicha(fichaActual) && esActorFicha(fichaActual)
          ? 'todo tuyo' : 'repartido entre dos profesionales')+'</div></div>'+
    '</div>';
    fichaActual.hon = Object.assign(fichaActual.hon || {}, { total });
    fichaActual.honConsulta = Object.assign(fichaActual.honConsulta || {}, { total:consulta });
  };
  $('#honCuerpo').addEventListener('change', recalc);
  $('#honCuerpo').addEventListener('input', debounce(recalc, 220));
  recalc();
}
function leerHonorariosConsulta(){
  const mod = val('hcModalidad');
  const monto = (mod === 'incluida' || mod === 'sincargo') ? 0 : (Number(val('hcMonto')) || 0);
  return { modalidad:mod, total:monto, estado:val('hcEstado'),
           fechaPresentacion:val('hcFecha'), comprobante:val('hcComprobante'),
           cobrado:Number(val('hcCobrado')) || 0 };
}
function leerHonorarios(){
  const mod = val('hoModalidad');
  const ua = Number(val('hoUA')) || 0, vu = Number(val('hoVU')) || 0;
  const adicionales = leerChks('hoAdic');
  const pct = adicionales.reduce((a,id) => a + (ADICIONALES_HONORARIOS.find(x => x.id === id) || {pct:0}).pct, 0);
  let total = 0;
  if(mod === 'abierto') total = ua * vu * (1 + pct/100);
  else if(mod === 'cerrado' || mod === 'particular') total = Number(val('hoMontoFijo')) || 0;
  return {
    modalidad: mod, ua, valorUnidad: vu, adicionales, pctAdicional: pct,
    montoFijo: Number(val('hoMontoFijo')) || 0, total,
    estado: val('hoEstado'), fechaPresentacion: val('hoFecha'),
    comprobante: val('hoComprobante'), cobrado: Number(val('hoCobrado')) || 0,
    observaciones: val('hoObs')
  };
}

/* =========================================================================
   PASO 3 - ANESTESIA (registro intraoperatorio)
   Cinco solapas: Resumen · Drogas · Signos vitales · Balance · Eventos.

   El modulo de drogas usa el vademecum anestesico de AFAAR. Calcula por
   peso y muestra el rango, pero NUNCA registra una dosis sola: el
   anestesiologo la confirma. Es la regla 4 del capitulo 14 del vademecum.
   ========================================================================= */

let solapaActo = 'resumen';

const SOLAPAS_ACTO = [
  ['resumen','ficha','Resumen'],
  ['drogas','jeringa','Drogas'],
  ['vitales','monitor','Signos vitales'],
  ['balance','gota','Balance'],
  ['eventos','alerta','Eventos']
];

function pintarPasoAnestesia(f){
  const a = f.acto || {};
  const cuenta = { drogas:(a.drogas||[]).length, vitales:(a.controles||[]).length,
                   eventos:(a.eventos2||[]).length };
  $('#fiCuerpo').innerHTML =
    '<div class="acto-solapas no-print">'+ SOLAPAS_ACTO.map(s =>
      '<button type="button" class="'+(solapaActo===s[0]?'on':'')+'" data-asolapa="'+s[0]+'">'+
        ico(s[1]).replace('<svg','<svg style="width:14px;height:14px;vertical-align:-2px;margin-right:5px"')+
        esc(s[2])+(cuenta[s[0]] ? '<span class="badge">'+cuenta[s[0]]+'</span>' : '')+
      '</button>').join('') +'</div>'+
    '<div id="actoCuerpo"></div>';

  $$('#fiCuerpo [data-asolapa]').forEach(b => b.onclick = () => {
    fichaActual.acto = leerPasoAnestesia();
    solapaActo = b.dataset.asolapa;
    pintarPasoAnestesia(fichaActual);
  });

  const c = $('#actoCuerpo');
  if(solapaActo === 'resumen'){ c.innerHTML = htmlActoResumen(f); cablearActoResumen(f); }
  else if(solapaActo === 'drogas'){ c.innerHTML = htmlActoDrogas(f); cablearActoDrogas(f); }
  else if(solapaActo === 'vitales'){ c.innerHTML = htmlActoVitales(f); cablearActoVitales(f); }
  else if(solapaActo === 'balance'){ c.innerHTML = htmlActoBalance(f); cablearActoBalance(f); }
  else { c.innerHTML = htmlActoEventos(f); cablearActoEventos(f); }
}

/* El peso del paciente manda en todo el modulo de drogas */
function pesoDeFicha(f){
  const p = DB.pacientes[f.pacienteId] || {};
  return Number(p.peso) || 0;
}
function edadDeFicha(f){
  const p = DB.pacientes[f.pacienteId] || {};
  return edadDe(p.fechaNac, f.fecha);
}

function cablearActoResumen(f){
  $$('#actoCuerpo [data-ahora]').forEach(b => b.onclick = () => {
    $('#'+b.dataset.ahora).value = ahoraHora(); recalcTiempos();
  });
  $$('#acTecnicas .tec').forEach(b => b.onclick = () => b.classList.toggle('on'));
  $$('#acVaDificil button').forEach(b => b.onclick = () => {
    $$('#acVaDificil button').forEach(x => x.classList.remove('on')); b.classList.add('on');
    avisarVA();
  });
  ['acMonitor','acMonitorExtra','acOMS'].forEach(id => $$('#'+id+' .chk').forEach(l => {
    l.onclick = () => setTimeout(() => l.classList.toggle('sel', l.querySelector('input').checked), 0);
  }));

  const pintarTam = () => {
    const d = DISPOSITIVOS_FLUJO.find(x => x.k === $('#acDisp').value) || DISPOSITIVOS_FLUJO[0];
    const box = $('#acTamBox');
    if(!(d.tam || []).length){ box.style.display = 'none'; return; }
    box.style.display = '';
    $('#acTamLbl').textContent = 'Tamaño' + (d.um ? ' ('+d.um+')' : '');
    const actual = $('#acTam').value;
    $('#acTam').innerHTML = d.tam.map(t =>
      '<option'+(String(actual)===String(t)?' selected':'')+'>'+esc(t)+'</option>').join('');
  };
  $('#acDisp').onchange = pintarTam;
  pintarTam();

  const avisarVA = () => {
    const dif = ($('#acVaDificil button.on') || {}).dataset;
    $('#acVaAviso').innerHTML = (dif && dif.v === 'si')
      ? '<div class="aviso danger">'+ico('alerta')+'<div><b>Vía aérea difícil.</b> Queda asentado '+
        'en la ficha y en la historia del paciente. Detallá en las observaciones qué dispositivo '+
        'resolvió la intubación, para que el próximo anestesiólogo lo sepa.</div></div>'
      : '';
  };
  avisarVA();

  const recalcTiempos = () => {
    const dcx = minutosEntre(val('acIniCx'), val('acFinCx'));
    const dan = minutosEntre(val('acIniAnest'), val('acFinAnest'));
    let h = '';
    if(dcx !== null) h += '<div class="tiempo"><span>Duración de cirugía</span><b>'+duracionTexto(dcx)+'</b></div>';
    if(dan !== null) h += '<div class="tiempo"><span>Duración de anestesia</span><b>'+duracionTexto(dan)+'</b></div>';
    $('#acDuracion').innerHTML = h
      ? '<div class="tiempos">'+h+'</div>'+
        (dan !== null && dan > 120 ? '<div class="aviso info">'+ico('dinero')+
          '<div>Más de 2 horas de anestesia: corresponde el adicional por prolongación del '+
          'nomenclador anestésico. Cargalo en Honorarios.</div></div>' : '')
      : '';
  };
  $('#actoCuerpo').addEventListener('input', debounce(recalcTiempos, 200));
  $('#actoCuerpo').addEventListener('change', recalcTiempos);
  recalcTiempos();
}
