  '<div class="card"><h3>'+ico('calendario')+'Calendario de obligaciones</h3>'+
    '<div class="tabla-wrap"><table><thead><tr><th>Obligación</th><th>Periodicidad</th>'+
    '<th>Alcanza a</th><th>Referencia</th></tr></thead><tbody>'+
    [['Cuota del monotributo','Mensual','Monotributistas','Vence según terminación de CUIT'],
     ['Recategorización','Semestral (enero y julio)','Monotributistas','Sobre los 12 meses anteriores'],
     ['IVA — declaración jurada','Mensual','Responsables inscriptos',
      'Alícuota general '+fNum(pf.ivaAlicuota,1)+' %; prestaciones de salud '+fNum(pf.ivaSalud,1)+' %'],
     ['Ingresos Brutos','Mensual','Todos los que facturan',
      'Tierra del Fuego, '+fNum(pf.iibbAlicuota,1)+' %'],
     ['Ganancias — anticipos','Bimestral','Responsables inscriptos','Según declaración anterior'],
     ['Ganancias — declaración jurada','Anual','Responsables inscriptos','Ejercicio calendario'],
     ['Bienes Personales','Anual','Según patrimonio','Sobre bienes al 31 de diciembre'],
     ['Libro IVA Digital','Mensual','Responsables inscriptos','Registro de comprobantes']
    ].map(r => '<tr><td><b>'+esc(r[0])+'</b></td><td>'+esc(r[1])+'</td><td>'+esc(r[2])+'</td>'+
      '<td class="mini">'+esc(r[3])+'</td></tr>').join('')+
    '</tbody></table></div>'+
    '<div class="aviso warn mt8" style="margin-bottom:0">'+ico('info')+'<div>Los vencimientos concretos '+
      'los fija ARCA cada año. Este calendario es un recordatorio de qué hay que presentar, no un '+
      'almanaque de fechas.</div></div>'+
  '</div>'+

  '<div class="card"><h3>'+ico('dinero')+'Retenciones a considerar</h3>'+
    '<div class="tabla-wrap"><table><thead><tr><th>Concepto</th><th class="num">Alícuota</th>'+
    '<th>Quién retiene</th></tr></thead><tbody>'+
    '<tr><td>Retención de Ganancias sobre honorarios</td><td class="num">'+fNum(pf.retencionGanancias,1)+
      ' %</td><td>Financiadores designados agentes de retención</td></tr>'+
    '<tr><td>Retención de IVA</td><td class="num">'+fNum(pf.retencionIva,1)+
      ' %</td><td>Sobre el IVA facturado, responsables inscriptos</td></tr>'+
    '<tr><td>Retención de Ingresos Brutos</td><td class="num">'+fNum(pf.iibbAlicuota,1)+
      ' %</td><td>Agentes de recaudación provinciales</td></tr>'+
    '</tbody></table></div>'+
    '<p class="mini mt8">Las retenciones sufridas son pago a cuenta: hay que computarlas en la '+
    'declaración del período y reclamar los certificados al financiador que las practicó.</p></div>';
}

/* ------------------------------------------------- 5. RECOMENDACIONES */
function ctConsejos(){
  const pf = paramsFiscales();
  const l = contDatos().filter(estaImpago);
  const proy = proyeccionAnual(6);
  const mensual = proy ? proy.mensual : 0;
  const c = [];

  /* --- Deuda por tramos --- */
  const t60  = l.filter(x => diasDeuda(x) > pf.diasAlerta && diasDeuda(x) <= 180);
  const t180 = l.filter(x => diasDeuda(x) > 180 && diasDeuda(x) <= pf.diasIncobrable);
  const t365 = l.filter(x => diasDeuda(x) > pf.diasIncobrable);

  if(t60.length) c.push({ n:'warn', i:'reloj',
    t:'Reclamar formalmente '+t60.length+' prestaciones por '+
      fMoneda(t60.reduce((a,x)=>a+x.saldo,0)),
    d:'Superaron los '+pf.diasAlerta+' días. A esta altura conviene la intimación por medio fehaciente: '+
      'corta la prescripción, deja constancia y habilita el reclamo de intereses. '+
      'Con una inflación mensual del '+fNum(mensual,1)+' %, cada mes de demora les quita '+
      fMoneda(t60.reduce((a,x)=>a+x.saldo,0) * mensual/100)+' de poder adquisitivo.' });

  if(t180.length) c.push({ n:'danger', i:'alerta',
    t:'Gestión intensiva sobre '+fMoneda(t180.reduce((a,x)=>a+x.saldo,0))+' con más de 180 días',
    d:'Pasado el semestre la probabilidad de cobro cae fuerte. Corresponde escalar: nota a la '+
      'gerencia del financiador, mesa de trabajo con la institución y, si no hay respuesta, '+
      'evaluar la vía judicial. Documentar cada gestión.' });

  if(t365.length) c.push({ n:'danger', i:'equis',
    t:'Evaluar previsión por incobrabilidad: '+fMoneda(t365.reduce((a,x)=>a+x.saldo,0)),
    d:'Con más de un año de mora y gestiones de cobro documentadas sin resultado, estos saldos '+
      'reúnen los índices de incobrabilidad que admite la ley de Ganancias. Deducirlos reduce la '+
      'carga fiscal de quien ya tributó por un ingreso que nunca entró. Requiere respaldo: '+
      'intimaciones, respuestas y constancia de la gestión.' });

  /* --- Cuando indexar --- */
  const umbral = 10;
  const paraIndexar = l.filter(x => {
    const r = indexarSaldo(x.saldo, x.mes);
    return (r.coeficiente - 1) * 100 >= umbral;
  });
  if(paraIndexar.length){
    const nom = paraIndexar.reduce((a,x)=>a+x.saldo,0);
    const act = paraIndexar.reduce((a,x)=>a+indexarSaldo(x.saldo,x.mes).actualizado,0);
    c.push({ n:'danger', i:'stats',
      t:'Momento de renegociar valores: '+paraIndexar.length+' prestaciones perdieron más del '+umbral+' %',
      d:'Su valor nominal es '+fMoneda(nom)+' y a moneda de hoy equivalen a '+fMoneda(act)+
        ' ('+fMoneda(act-nom)+' de diferencia). Cuando la brecha supera el '+umbral+' % conviene '+
        'reclamar el ajuste por IPC o, si el convenio no lo prevé, usar este número como argumento '+
        'para renegociar el valor de la unidad anestésica hacia adelante.' });
  }

  /* --- Valor de la unidad por financiador --- */
  const porFin = ctAgrupar(contDatos(), x => x.financiador);
  const malPagador = porFin.filter(f => f.devengado > 0 && f.cobrado / f.devengado < 0.5 && f.saldo > 0);
  if(malPagador.length) c.push({ n:'warn', i:'filtro',
    t:'Financiadores con cobranza por debajo del 50 %',
    d: malPagador.map(f => f.t + ' (' + fNum(f.cobrado*100/f.devengado,0) + ' % cobrado, ' +
       fMoneda(f.saldo) + ' pendiente)').join(' · ') +
       '. Conviene revisar el convenio: plazos de pago, penalidad por mora y ajuste automático. '+
       'Un financiador que paga tarde en un contexto inflacionario está pagando menos.' });

  /* --- Prestaciones sin comprobante --- */
  const sinComp = contDatos().filter(x => !x.comprobante &&
    ['Presentado','Facturado','Cobrado'].indexOf(x.estado) >= 0);
  if(sinComp.length) c.push({ n:'warn', i:'archivo',
    t:sinComp.length+' prestaciones facturadas sin número de comprobante',
    d:'Sin el número no se puede conciliar el cobro ni respaldar la deducción. '+
      'Pedirle a cada anestesiólogo que complete el dato en su ficha de honorarios.' });

  /* --- Presentaciones atrasadas --- */
  const sinPresentar = contDatos().filter(x => x.estado === 'Pendiente' &&
    diasDeuda(x) > pf.diasPlazoNormal);
  if(sinPresentar.length) c.push({ n:'danger', i:'campana',
    t: sinPresentar.length === 1 ? 'Una prestación nunca se presentó a cobro'
                                 : sinPresentar.length+' prestaciones nunca se presentaron a cobro',
    d:'Por '+fMoneda(sinPresentar.reduce((a,x)=>a+x.saldo,0))+'. '+
      (sinPresentar.length === 1 ? 'Sigue' : 'Siguen')+' en estado «Pendiente» pasados '+
      pf.diasPlazoNormal+' días. Es plata devengada que ni siquiera empezó el circuito de cobro: '+
      'es lo primero a destrabar, porque el plazo del financiador recién arranca cuando se presenta.' });

  /* --- IPC incompleto --- */
  const faltan = ctMesesSinIPC();
  if(faltan.length) c.push({ n:'danger', i:'alerta',
    t: faltan.length === 1 ? 'Cargar el mes de IPC pendiente'
                           : 'Cargar '+faltan.length+' meses de IPC pendientes',
    d:'Sin la serie completa toda la indexación de este portal queda subestimada y las '+
      'recomendaciones pierden precisión. Es la tarea de mantenimiento más importante: '+
      'cinco minutos por mes en Parámetros.' });

  /* --- Monotributo --- */
  if(monotributoEsPrecargado()) c.push({ n:'danger', i:'archivo',
    t:'Confirmar la escala del monotributo',
    d:'Está en uso la escala de referencia precargada. Se actualiza cada semestre: mientras no se '+
      'reemplace por la vigente, las categorías y los márgenes que muestra el portal son orientativos.' });

  if(!c.length) c.push({ n:'ok', i:'check', t:'No hay acciones pendientes',
    d:'La cartera está al día, la serie de IPC completa y la escala fiscal confirmada.' });

  return ''+
  '<div class="aviso info">'+ico('guias')+'<div>Recomendaciones generadas a partir de los datos '+
    'cargados. Son un apoyo a la decisión profesional del contador, no un dictamen: cada situación '+
    'concreta exige su propio análisis.</div></div>'+

  c.map(x => '<div class="card"><h3>'+ico(x.i)+esc(x.t)+'</h3>'+
    '<p style="margin:0;line-height:1.7">'+esc(x.d)+'</p></div>').join('')+

  '<div class="card"><h3>'+ico('info')+'Criterio general para indexar</h3>'+
    '<div class="tabla-wrap"><table><thead><tr><th>Situación</th><th>Qué conviene hacer</th>'+
    '</tr></thead><tbody>'+
    [['Deuda de menos de 30 días','Nada. Está dentro del plazo normal de pago.'],
     ['Deuda de 30 a 60 días','Seguimiento. Confirmar que la presentación fue recibida y conformada.'],
     ['Pérdida acumulada menor al 10 %','Reclamar el capital. El ajuste todavía no justifica el desgaste.'],
     ['Pérdida acumulada del 10 al 25 %','Reclamar con ajuste por IPC. Dejar asentado el cálculo en la intimación.'],
     ['Pérdida acumulada mayor al 25 %','Ajuste innegociable y revisión del convenio hacia adelante.'],
     ['Más de un año sin cobrar','Previsión por incobrabilidad y evaluación de la vía judicial.']
    ].map(r => '<tr><td><b>'+esc(r[0])+'</b></td><td>'+esc(r[1])+'</td></tr>').join('')+
    '</tbody></table></div></div>'+

  '<div class="btn-row mt14">'+
    '<button class="btn pri" id="ctConsejoReclamo">'+ico('correo')+
      ' Comunicar estas conclusiones</button></div>';
}

/* ================ ui-mensajes.js ================ */
/* =========================================================================
   COMUNICACION INTERNA - reclamos, consultas y avisos
   Correo/chat interno entre anestesiologos acreditados, la coordinacion y
   el contador. Con recordatorio de respuesta pendiente a las 2 horas.

   Un hilo lo ven UNICAMENTE sus participantes: ni la coordinacion ni el
   contador leen conversaciones ajenas.
   ========================================================================= */

const HORAS_SIN_RESPONDER = 2;      /* umbral de reclamo sin resolver */

const TIPOS_HILO = [
  { id:'reclamo',  n:'Reclamo',  d:'Requiere respuesta y seguimiento hasta resolverse.', cls:'danger' },
  { id:'consulta', n:'Consulta', d:'Pregunta o pedido de información.',                  cls:'info'   },
  { id:'aviso',    n:'Aviso',    d:'Comunicación informativa, no exige respuesta.',      cls:''       }
];
const PRIORIDADES_HILO = [
  { id:'alta',   n:'Alta',   cls:'danger' },
  { id:'normal', n:'Normal', cls:'info'   },
  { id:'baja',   n:'Baja',   cls:''       }
];

let filtroMensajes = 'todos';

/* ------------------------------------------------------ Datos del hilo */
function hilos(){ return lista('mensajes'); }

/* Solo los hilos en los que participo. */
function misHilos(){
  if(!SESION) return [];
  return hilos().filter(h => (h.participantes || []).indexOf(SESION.uid) >= 0)
    .sort((a,b) => (b.actualizado || b.creado || '').localeCompare(a.actualizado || a.creado || ''));
}
function mensajesDe(h){
  return Object.values(h.mensajes || {})
    .sort((a,b) => (a.cuando || '').localeCompare(b.cuando || ''));
}
function ultimoMensaje(h){
  const m = mensajesDe(h);
  return m.length ? m[m.length-1] : null;
}
/* Horas transcurridas desde el último mensaje */
function horasDesde(iso){
  if(!iso) return 0;
  return (Date.now() - new Date(iso).getTime()) / 3600000;
}
/* ¿Este hilo espera una respuesta MIA y ya pasaron las 2 horas?
   Sólo aplica a hilos abiertos cuyo último mensaje lo escribió otro. */
function esperaRespuestaMia(h){
  if(!SESION || h.estado === 'resuelto' || h.tipo === 'aviso') return false;
  const u = ultimoMensaje(h);
  if(!u || u.uid === SESION.uid) return false;
  return true;
}
function hiloVencido(h){
  return esperaRespuestaMia(h) && horasDesde((ultimoMensaje(h) || {}).cuando) >= HORAS_SIN_RESPONDER;
}
/* Reclamo abierto que YO inicié y nadie contestó a tiempo */
function miReclamoSinRespuesta(h){
  if(!SESION || h.estado === 'resuelto' || h.tipo !== 'reclamo') return false;
  const u = ultimoMensaje(h);
  if(!u || u.uid !== SESION.uid) return false;
  return horasDesde(u.cuando) >= HORAS_SIN_RESPONDER;
}
function hiloNoLeido(h){
  if(!SESION) return false;
  const u = ultimoMensaje(h);
  if(!u || u.uid === SESION.uid) return false;
  const visto = (h.leido || {})[SESION.uid] || '';
  return (u.cuando || '') > visto;
}
function marcarLeido(h){
  if(!SESION) return;
  const u = ultimoMensaje(h);
  if(!u) return;
  const leido = Object.assign({}, h.leido || {});
  if(leido[SESION.uid] === u.cuando) return;
  leido[SESION.uid] = u.cuando;
  escribir('mensajes', h.id, Object.assign({}, h, { leido:leido }));
}
function conteoMensajes(){
  const l = misHilos();
  return {
    noLeidos:  l.filter(hiloNoLeido).length,
    vencidos:  l.filter(hiloVencido).length,
    abiertos:  l.filter(h => h.estado !== 'resuelto').length
  };
}

/* Personas con las que se puede hablar */
/* Coordinacion y Contable son roles institucionales fijos: se ofrecen siempre,
   aunque todavia no hayan entrado nunca desde este dispositivo. El mensaje
   queda esperandolos, como un correo. */
function destinatariosPosibles(){
  const l = socios().map(u => ({ uid:u.uid, n:u.apellido + ', ' + u.nombre, rol:'Anestesiólogo' }));
  l.unshift({ uid:'coordinador', n:'Coordinación AFAAR', rol:'Coordinación' });
  l.unshift({ uid:'contable',    n:'Contable AFAAR',     rol:'Contable' });
  return l.filter(x => !SESION || x.uid !== SESION.uid);
}
function nombreParticipante(u){
  if(u === 'coordinador') return 'Coordinación AFAAR';
  if(u === 'contable')    return 'Contable AFAAR';
  return nombreUsuario(u);
}

/* --------------------------------------------------------- Acciones --- */
function crearHilo(datos){
  const id = uid('hilo');
  const ahora = new Date().toISOString();
  const m0 = uid('msg');
  const parts = [SESION.uid].concat(datos.participantes.filter(p => p !== SESION.uid));
  escribir('mensajes', id, {
    id:id, asunto:datos.asunto, tipo:datos.tipo, prioridad:datos.prioridad,
    creadoPor:SESION.uid, creado:ahora, actualizado:ahora,
    participantes:parts, estado:'abierto',
    mensajes:{ [m0]:{ id:m0, uid:SESION.uid, texto:datos.texto, cuando:ahora } },
    leido:{ [SESION.uid]:ahora }
  });
  auditar('mensaje-nuevo', datos.tipo + ' «' + datos.asunto + '» a ' +
    parts.filter(p => p !== SESION.uid).map(nombreParticipante).join(', '));
  return id;
}
function responderHilo(id, texto){
  const h = DB.mensajes[id]; if(!h || !texto.trim()) return;
  const ahora = new Date().toISOString();
  const mid = uid('msg');
  const ms = Object.assign({}, h.mensajes || {});
  ms[mid] = { id:mid, uid:SESION.uid, texto:texto.trim(), cuando:ahora };
  escribir('mensajes', id, Object.assign({}, h, {
    mensajes:ms, actualizado:ahora,
    leido: Object.assign({}, h.leido || {}, { [SESION.uid]:ahora })
  }));
}
function resolverHilo(id, resolver){
  const h = DB.mensajes[id]; if(!h) return;
  escribir('mensajes', id, Object.assign({}, h, {
    estado: resolver ? 'resuelto' : 'abierto',
    cerradoPor: resolver ? SESION.uid : '',
    cerradoEn: resolver ? new Date().toISOString() : '',
    actualizado: new Date().toISOString()
  }));
  auditar('mensaje-estado', (resolver ? 'Resuelto' : 'Reabierto') + ' «' + h.asunto + '»');
}

    '<div class="acciones"><button class="btn pri chico" id="msgNuevo">'+ico('mas')+' Nuevo mensaje</button></div>'+

  (c.vencidos ? '<div class="aviso danger">'+ico('reloj')+'<div><b>'+c.vencidos+

    'Un reclamo sin responder frena la gestión del colega que lo abrió.</div></div>' : '')+
  (pendientesMios ? '<div class="aviso warn">'+ico('alerta')+'<div><b>'+pendientesMios+
    ' reclamo'+(pendientesMios===1?'':'s')+' tuyo'+(pendientesMios===1?'':'s')+' sin respuesta.</b><br>'+
    'Pasaron más de '+HORAS_SIN_RESPONDER+' horas desde tu último mensaje sin que nadie contestara.</div></div>' : '')+

  '<div class="grid c4 mb8">'+
    kpi('Sin leer', c.noLeidos, c.noLeidos?'aqua':'', ico('correo'), '')+
    kpi('Abiertos', c.abiertos, 'azul', ico('lista'), '')+
    kpi('Esperan tu respuesta', c.vencidos, c.vencidos?'danger':'ok', ico('reloj'), '+'+HORAS_SIN_RESPONDER+' h')+
    kpi('Sin respuesta ajena', pendientesMios, pendientesMios?'warn':'ok', ico('campana'), 'reclamos míos')+
  '</div>'+

  '<div class="filtros">'+
    '<div class="campo"><label>Ver</label><select id="msgFiltro">'+
      [['todos','Todos'],['abiertos','Abiertos'],['noleidos','Sin leer'],
       ['vencidos','Esperan respuesta'],['resueltos','Resueltos']]
        .map(o => '<option value="'+o[0]+'"'+(filtroMensajes===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+
    '</select></div>'+
  '</div>'+

  (l.length ? '<div class="lista">'+ l.map(h => {
    const u = ultimoMensaje(h) || {};
    const t = TIPOS_HILO.find(x => x.id === h.tipo) || TIPOS_HILO[1];
    const pr = PRIORIDADES_HILO.find(x => x.id === h.prioridad) || PRIORIDADES_HILO[1];
    const venc = hiloVencido(h), noLeido = hiloNoLeido(h);
    const otros = (h.participantes||[]).filter(p => p !== SESION.uid).map(nombreParticipante).join(', ');
    return '<div class="item" data-hilo="'+esc(h.id)+'">'+

        (noLeido?'background:var(--aqua-200);color:var(--aqua-600)':''))+'">'+

/* ------------------------------------------------------- Nuevo hilo --- */
function componerHilo(preParticipante, preAsunto){
  const dest = destinatariosPosibles();
  if(!dest.length) return toast('No hay otros usuarios habilitados todavía.', 'err');
  abrirModal('Nuevo mensaje interno',
    '<div class="campo"><label>Para <span class="req">*</span></label>'+
      '<div class="chks" id="mhDest">'+ dest.map(d =>
        '<label class="chk'+(preParticipante===d.uid?' sel':'')+'">'+
        '<input type="checkbox" value="'+esc(d.uid)+'"'+(preParticipante===d.uid?' checked':'')+'>'+
        esc(d.n)+' <b style="opacity:.55">'+esc(d.rol)+'</b></label>').join('') +'</div></div>'+
    '<div class="grid c2">'+
      '<div class="campo"><label>Tipo</label><select id="mhTipo">'+
        TIPOS_HILO.map(t => '<option value="'+t.id+'">'+esc(t.n)+'</option>').join('')+
        '</select><div class="ayuda" id="mhTipoD"></div></div>'+
      '<div class="campo"><label>Prioridad</label><select id="mhPrio">'+
        PRIORIDADES_HILO.map(p => '<option value="'+p.id+'"'+(p.id==='normal'?' selected':'')+'>'+
          esc(p.n)+'</option>').join('')+'</select></div>'+
    '</div>'+
    '<div class="campo"><label>Asunto <span class="req">*</span></label>'+
      '<input type="text" id="mhAsunto" maxlength="90" value="'+esc(preAsunto||'')+'" '+
      'placeholder="Débito de OSDE en la facturación de marzo"></div>'+
    '<div class="campo"><label>Mensaje <span class="req">*</span></label>'+
      '<textarea id="mhTexto" rows="5" placeholder="Escribí el detalle del reclamo o la consulta"></textarea></div>'+
    '<div class="aviso warn" style="margin-bottom:0">'+ico('candado')+'<div>No incluyas datos del paciente. '+
      'Este canal es administrativo y el contable no está habilitado a acceder a información clínica.</div></div>',
    '<button class="btn ghost" data-cerrar>Cancelar</button>'+
    '<button class="btn pri" id="mhEnviar">'+ico('correo')+' Enviar</button>', '620px');

  cablearChks('mhDest');
  const desc = () => { const t = TIPOS_HILO.find(x => x.id === $('#mhTipo').value);
    $('#mhTipoD').textContent = t ? t.d : ''; };
  $('#mhTipo').onchange = desc; desc();

  $('#mhEnviar').onclick = () => {
    const parts = leerChks('mhDest');
    const asunto = $('#mhAsunto').value.trim();
    const texto  = $('#mhTexto').value.trim();
    if(!parts.length) return toast('Elegí al menos un destinatario.', 'err');
    if(!asunto)       return toast('Poné un asunto.', 'err');
    if(!texto)        return toast('Escribí el mensaje.', 'err');
    const id = crearHilo({ participantes:parts, asunto:asunto, texto:texto,
      tipo:$('#mhTipo').value, prioridad:$('#mhPrio').value });
    cerrarModal();
    toast('Mensaje enviado.', 'ok');
    if(vistaActual === 'mensajes') vistaMensajes();
    pintarBadgeAvisos();
    setTimeout(() => abrirHilo(id), 220);
  };
}

/* --------------------------------------------------------- Ver hilo --- */
function abrirHilo(id){
  const h = DB.mensajes[id];
  if(!h) return toast('El mensaje ya no existe.', 'err');
  marcarLeido(h);
  const ms = mensajesDe(h);
  const t = TIPOS_HILO.find(x => x.id === h.tipo) || TIPOS_HILO[1];
  const otros = (h.participantes||[]).filter(p => p !== SESION.uid).map(nombreParticipante).join(', ');
  const venc = hiloVencido(h);

  const cuerpo = ''+
    '<div class="aviso '+(h.estado==='resuelto'?'ok':(venc?'danger':'info'))+'">'+
      ico(h.estado==='resuelto'?'check':(venc?'reloj':'info'))+
      '<div><b>'+esc(t.n)+(h.prioridad==='alta'?' · prioridad alta':'')+'</b><br>'+

/* ================ ui-prestadores.js ================ */
/* =========================================================================
   PRESTADORES  (Coordinación)
   Instituciones y financiadores: alta, edición, datos de facturación,
   detección y fusión de duplicados, y baja de los que no tienen fichas.
   Toda operación se escribe en la base compartida y queda auditada.
   ========================================================================= */

let prestSolapa = 'financiadores';

/* =================== OPERACIONES SOBRE LOS DATOS =================== */

/* Reasigna todas las fichas y pacientes de un financiador a otro.
   Sirve tanto para fusionar duplicados como para renombrar. */
function fusionarFinanciador(desde, hacia, motivo){
  const kd = clavePrestador(desde), kh = clavePrestador(hacia);
  if(!kd || !kh) return 0;
  let n = 0;

  lista('fichas').forEach(f => {
    if(clavePrestador(f.obraSocial) === kd){
      f.obraSocial = hacia;
      f.modificado = new Date().toISOString();
      escribir('fichas', f.id, f); n++;
    }
  });
  lista('pacientes').forEach(p => {
    if(clavePrestador(p.obraSocial) === kd){
      p.obraSocial = hacia;
      escribir('pacientes', p.id, p); n++;
    }
  });

  /* El valor de la unidad viaja con el nombre */
  const vu = Object.assign({}, DB.config.valoresUnidad || {});
  let tocado = false;
  Object.keys(vu).forEach(k => {
    if(k !== '_default' && clavePrestador(k) === kd){
      if(vu[hacia] === undefined && vu[k]) vu[hacia] = vu[k];
      delete vu[k]; tocado = true;
    }
  });
  if(tocado){ escribir('config', 'valoresUnidad', Object.assign({ id:'valoresUnidad' }, vu));
              DB.config.valoresUnidad = vu; }

  /* Los datos de facturación se conservan si el destino no tiene */
  const rd = datosFinanciador(desde), rh = datosFinanciador(hacia);
  if(rd){
    if(!rh){
      escribir('obrasSociales', rd.id, Object.assign({}, rd, { nombre:hacia }));
    } else {
      ['cuit','contacto','telefono','email','domicilio','plazoPago','notas'].forEach(c => {
        if(!rh[c] && rd[c]) rh[c] = rd[c];
      });
      escribir('obrasSociales', rh.id, rh);
      eliminar('obrasSociales', rd.id);
    }
  }

  /* Si el nombre viejo venía de la lista de base, se oculta */
  if(kd !== kh){
    const oc = prestadoresOcultos();
    if(oc.finOcultos.indexOf(kd) < 0){ oc.finOcultos.push(kd); guardarOcultos(oc); }
  }

  auditar('prestador-fusionar',
    '«' + desde + '» → «' + hacia + '» · ' + n + ' registros reasignados' +
    (motivo ? ' · ' + motivo : ''));
  return n;
}

/* Igual, para instituciones (las fichas guardan el identificador) */
function fusionarInstitucion(desdeId, haciaId, motivo){
  if(!desdeId || !haciaId || desdeId === haciaId) return 0;
  let n = 0;
  lista('fichas').forEach(f => {
    if(f.institucion === desdeId){
      f.institucion = haciaId;
      f.modificado = new Date().toISOString();
      escribir('fichas', f.id, f); n++;
    }
  });
  lista('usuarios').forEach(u => {
    const ins = u.instituciones || [];
    if(ins.indexOf(desdeId) >= 0){
      u.instituciones = ins.map(x => x === desdeId ? haciaId : x)
        .filter((x,i,a) => a.indexOf(x) === i);
      escribir('usuarios', u.uid, u); n++;
    }
  });
  const rec = lista('instituciones').find(i => i.id === desdeId);
  if(rec) eliminar('instituciones', desdeId);
  else {
    const oc = prestadoresOcultos();
    if(oc.instOcultas.indexOf(desdeId) < 0){ oc.instOcultas.push(desdeId); guardarOcultos(oc); }
  }
  auditar('prestador-fusionar',
    '«' + nombreInstitucion(desdeId) + '» → «' + nombreInstitucion(haciaId) + '» · ' +
    n + ' registros reasignados' + (motivo ? ' · ' + motivo : ''));
  return n;
}

/* Duplicados sospechados, en pares */
function duplicadosFinanciadores(){
  const l = obrasSociales(), pares = [];
  for(let i = 0; i < l.length; i++)
    for(let j = i + 1; j < l.length; j++){
      const m = parecidoPrestador(l[i], l[j]);
      if(m && !parIgnorado(clavePrestador(l[i]), clavePrestador(l[j]))){
        const ui = usoFinanciador(l[i]), uj = usoFinanciador(l[j]);
        /* el que más se usa se propone como el bueno */
        pares.push(ui >= uj ? { a:l[j], b:l[i], usoA:uj, usoB:ui, motivo:m }
                            : { a:l[i], b:l[j], usoA:ui, usoB:uj, motivo:m });
      }
    }
  return pares;
}
function duplicadosInstituciones(){
  const l = instituciones(), pares = [];
  for(let i = 0; i < l.length; i++)
    for(let j = i + 1; j < l.length; j++){
      const m = parecidoPrestador(l[i].nombre, l[j].nombre);
      if(m && !parIgnorado(l[i].id, l[j].id)){
        const ui = usoInstitucion(l[i].id), uj = usoInstitucion(l[j].id);
        pares.push(ui >= uj ? { a:l[j], b:l[i], usoA:uj, usoB:ui, motivo:m }
                            : { a:l[i], b:l[j], usoA:ui, usoB:uj, motivo:m });
      }
    }
  return pares;
}

/* =========================== PANTALLA =========================== */
function seccionPrestadores(c){
  const dupF = duplicadosFinanciadores(), dupI = duplicadosInstituciones();
  const dup = prestSolapa === 'financiadores' ? dupF : dupI;

  c.innerHTML = ''+
  '<div class="seg mb8" id="prSeg">'+
    '<button type="button" data-v="financiadores"'+(prestSolapa==='financiadores'?' class="on"':'')+'>'+
      'Financiadores ('+obrasSociales().length+')'+(dupF.length?' ⚠':'')+'</button>'+
    '<button type="button" data-v="instituciones"'+(prestSolapa==='instituciones'?' class="on"':'')+'>'+
      'Instituciones ('+instituciones().length+')'+(dupI.length?' ⚠':'')+'</button>'+
  '</div>'+

  (dup.length
    ? '<div class="card" style="border:1.5px solid var(--warn)">'+
        '<h3>'+ico('alerta')+'Posibles duplicados ('+dup.length+')</h3>'+
        '<p class="mini mb8">Se detectaron nombres que parecen el mismo prestador escrito distinto. '+
          'Al fusionarlos, todas las fichas y pacientes pasan al nombre que elijas.</p>'+
        dup.map((d,i) => {
          const na = prestSolapa === 'financiadores' ? d.a : d.a.nombre;
          const nb = prestSolapa === 'financiadores' ? d.b : d.b.nombre;
          return '<div class="aviso warn" style="align-items:center">'+ico('copiar')+
            '<div style="flex:1;min-width:0"><b>'+esc(na)+'</b> ('+d.usoA+' ficha'+(d.usoA===1?'':'s')+')'+
            ' &nbsp;→&nbsp; <b>'+esc(nb)+'</b> ('+d.usoB+')'+
            '<div class="mini" style="color:inherit;opacity:.85">Motivo: '+esc(d.motivo)+'</div></div>'+
            '<div class="btn-row" style="flex:none;flex-wrap:nowrap">'+
              '<button class="btn ghost chico" data-dist="'+i+'">Son distintos</button>'+
              '<button class="btn warn chico" data-fus="'+i+'">Fusionar</button>'+
            '</div></div>';
        }).join('')+
      '</div>'
    : '<div class="aviso ok">'+ico('check')+'<div>No se detectan nombres duplicados.</div></div>')+

  '<div class="card">'+
    '<h3>'+ico(prestSolapa==='financiadores'?'dinero':'hospital')+
      (prestSolapa==='financiadores'?'Financiadores':'Instituciones')+
      '<button class="btn pri chico" id="prNuevo" style="margin-left:auto">'+ico('mas')+' Agregar</button></h3>'+
    (prestSolapa === 'financiadores' ? tablaFinanciadores() : tablaInstituciones())+
  '</div>'+

  tarjetaParesIgnorados()+

  '<p class="mini">Los prestadores fusionados o dados de baja dejan de ofrecerse en los desplegables, '+
    'pero las fichas históricas conservan el nombre con el que se emitieron. Todos estos cambios se '+
    'guardan en la base compartida y quedan en la auditoría.</p>';

  $$('#prSeg button').forEach(b => b.onclick = () => { prestSolapa = b.dataset.v; vistaCoordinador(); });
  $$('#coCuerpo [data-dist]').forEach(b => b.onclick = () => {
    const d = dup[Number(b.dataset.dist)];
    const esFin = prestSolapa === 'financiadores';
    const na = esFin ? d.a : d.a.nombre, nb = esFin ? d.b : d.b.nombre;
    confirmar('Marcar como distintos',
      '<b>'+esc(na)+'</b> y <b>'+esc(nb)+'</b> quedan registrados como dos prestadores '+
      'diferentes y no se vuelven a proponer para fusionar. No se modifica ninguna ficha.<br><br>'+
      'Si más adelante cambiás de opinión, podés volver a revisarlos desde «Pares descartados».',
      () => {
        ignorarPar(esFin ? 'financiador' : 'institucion',
                   esFin ? clavePrestador(d.a) : d.a.id,
                   esFin ? clavePrestador(d.b) : d.b.id, na, nb);
        vistaCoordinador();
        toast('Marcados como distintos.', 'ok');
      }, 'Son distintos');
  });
  $$('#coCuerpo [data-rev]').forEach(b => b.onclick = () => {
    revisarParDeNuevo(b.dataset.rev);
    vistaCoordinador();
    toast('Vuelve a revisarse.', 'ok');
  });
  $$('#coCuerpo [data-fus]').forEach(b => b.onclick = () => {
    const d = dup[Number(b.dataset.fus)];
    prestSolapa === 'financiadores'
      ? confirmarFusionFinanciador(d.a, d.b, d.motivo)
      : confirmarFusionInstitucion(d.a, d.b, d.motivo);
  });
  $('#prNuevo').onclick = () => prestSolapa === 'financiadores'
    ? editarFinanciador(null) : editarInstitucion(null);
  $$('#coCuerpo [data-fin]').forEach(t => t.onclick = () => editarFinanciador(t.dataset.fin));
  $$('#coCuerpo [data-ins]').forEach(t => t.onclick = () => editarInstitucion(t.dataset.ins));
}

function tablaFinanciadores(){
  const vu = DB.config.valoresUnidad || {};
  const l = obrasSociales().map(n => {
    const d = datosFinanciador(n) || {};
    return { n, d, uso:usoFinanciador(n), vu: vu[n] };
  }).sort((a,b) => b.uso - a.uso || a.n.localeCompare(b.n, 'es'));
  if(!l.length) return '<p class="mini">Sin financiadores.</p>';
  return '<div class="tabla-wrap"><table><thead><tr>'+
    '<th>Financiador</th><th>CUIT</th><th>Contacto</th>'+
    '<th class="num">Valor unidad</th><th class="num">Consulta</th>'+
    '<th class="num">Fichas</th></tr></thead><tbody>'+
    l.map(x => '<tr data-fin="'+esc(x.n)+'" style="cursor:pointer">'+
      '<td><b>'+esc(x.n)+'</b></td>'+
      '<td>'+(x.d.cuit ? esc(x.d.cuit) : '<span style="opacity:.4">—</span>')+'</td>'+
      '<td>'+esc([x.d.contacto, x.d.telefono].filter(Boolean).join(' · ') || '—')+'</td>'+
      '<td class="num">'+(x.vu ? fMoneda(x.vu) : '<span style="opacity:.4">por defecto</span>')+'</td>'+
      '<td class="num">'+(x.d.valorConsulta ? fMoneda(x.d.valorConsulta) : '<span style="opacity:.4">—</span>')+'</td>'+
      '<td class="num">'+(x.uso || '<span style="opacity:.4">0</span>')+'</td></tr>').join('')+
    '</tbody></table></div>';
}

function tablaInstituciones(){
  const l = instituciones().map(i => Object.assign({ uso:usoInstitucion(i.id) }, i))
    .sort((a,b) => b.uso - a.uso || a.nombre.localeCompare(b.nombre, 'es'));
  return '<div class="tabla-wrap"><table><thead><tr>'+
    '<th>Institución</th><th>Ciudad</th><th>Tipo</th><th>Contacto</th>'+
    '<th class="num">Fichas</th></tr></thead><tbody>'+
    l.map(x => '<tr data-ins="'+esc(x.id)+'" style="cursor:pointer">'+
      '<td><b>'+esc(x.nombre)+'</b>'+(x.base?' <span class="tag" style="font-size:9.5px">de base</span>':'')+'</td>'+
      '<td>'+esc(x.ciudad||'—')+'</td><td>'+esc(x.tipo||'—')+'</td>'+
      '<td>'+esc([x.contacto, x.telefono].filter(Boolean).join(' · ') || '—')+'</td>'+
      '<td class="num">'+(x.uso || '<span style="opacity:.4">0</span>')+'</td></tr>').join('')+
    '</tbody></table></div>';
}

/* ==================== FICHA DE UN FINANCIADOR ==================== */
function editarFinanciador(nombre){
  const nuevo = !nombre;
  const d = nuevo ? {} : (datosFinanciador(nombre) || {});
  const uso = nuevo ? 0 : usoFinanciador(nombre);
  const vu = (DB.config.valoresUnidad || {})[nombre];

  abrirModal(nuevo ? 'Nuevo financiador' : nombre,
    (nuevo ? '' :
      '<div class="grid c3 mb8">'+
        kpi('Fichas', uso, uso?'azul':'', ico('ficha'))+
        kpi('Valor unidad', vu ? fMoneda(vu) : 'por defecto', 'aqua', ico('dinero'))+
        kpi('Devengado', fMoneda(lista('fichas')
          .filter(f => clavePrestador(f.obraSocial) === clavePrestador(nombre))
          .reduce((a,f) => a + Number((f.hon||{}).total||0), 0)), 'ok', ico('stats'))+
      '</div>')+
    campoTxt('fnNombre','Nombre *', nombre || '')+
    '<div id="fnAviso"></div>'+
    '<hr class="sep"><label class="mini strong" style="display:block;margin-bottom:8px">'+
      'Datos para la facturación</label>'+
    '<div class="grid c2">'+
      campoTxt('fnCuit','CUIT', d.cuit)+
      campoSel('fnPlazo','Plazo de pago',
        ['','30 días','45 días','60 días','90 días','Contra presentación','A convenir'], d.plazoPago)+
    '</div>'+
    '<div class="grid c2">'+
      campoTxt('fnContacto','Persona de contacto / auditoría', d.contacto)+
      campoTxt('fnTel','Teléfono', d.telefono)+
    '</div>'+
    '<div class="grid c2">'+
      campoTxt('fnEmail','Correo para presentaciones', d.email)+
      campoTxt('fnDom','Domicilio', d.domicilio)+
    '</div>'+
    '<div class="grid c2">'+
      campoNum('fnVU','Valor de la unidad anestésica', vu, 'step="0.01"')+
      campoNum('fnVC','Valor de la consulta prequirúrgica', d.valorConsulta, 'step="0.01"')+
    '</div>'+
    campoArea('fnNotas','Notas del convenio', d.notas,
      'Módulos pactados, débitos frecuentes, requisitos de presentación…')+
    (nuevo ? '' :
      '<hr class="sep">'+
      '<div class="btn-row">'+
        '<button class="btn warn chico" id="fnFusionar">'+ico('copiar')+' Fusionar con otro</button>'+
        (uso === 0
          ? '<button class="btn danger chico" id="fnBorrar">'+ico('borrar')+' Borrar</button>'
          : '<button class="btn ghost chico" id="fnOcultar">'+ico('candado')+' Dar de baja</button>')+
      '</div>'+
      '<p class="mini mt8">'+(uso === 0
        ? 'No tiene ninguna ficha asociada: se puede borrar sin consecuencias.'
        : 'Tiene '+uso+' ficha'+(uso===1?'':'s')+', así que no se puede borrar. Darlo de baja lo saca '+
          'de los desplegables y conserva el historial.')+'</p>'),
    '<button class="btn ghost" data-cerrar>Cancelar</button>'+
    '<button class="btn pri" id="fnGuardar">'+ico('check')+' Guardar</button>');

  /* aviso de parecido mientras escribe */
  const revisar = () => {
    const v = $('#fnNombre').value.trim();
    const par = v ? obrasSociales().filter(o =>
      clavePrestador(o) !== clavePrestador(nombre || '') && parecidoPrestador(v, o)) : [];
    $('#fnAviso').innerHTML = par.length
      ? '<div class="aviso warn">'+ico('alerta')+'<div><b>Ya existe algo parecido:</b> '+
        par.map(esc).join(' · ')+'.<br>Si es el mismo, usá ese nombre o fusionalos después.</div></div>'
      : '';
  };
  $('#fnNombre').oninput = debounce(revisar, 250);
  revisar();

  $('#fnGuardar').onclick = () => {
    const n = $('#fnNombre').value.trim();
    if(!n) return toast('El nombre es obligatorio.', 'err');
    const datos = { cuit:val('fnCuit'), plazoPago:val('fnPlazo'), contacto:val('fnContacto'),
                    telefono:val('fnTel'), email:val('fnEmail'), domicilio:val('fnDom'),
                    valorConsulta:Number(val('fnVC')) || 0, notas:val('fnNotas') };
    const nuevoVU = Number(val('fnVU')) || 0;

    if(!nuevo && clavePrestador(n) !== clavePrestador(nombre)){
      /* renombrado: arrastra fichas y pacientes */
      const cant = fusionarFinanciador(nombre, n, 'renombrado');
      guardarDatosFinanciador(n, datos);
      aplicarValorUnidad(n, nuevoVU);
      cerrarModal(); vistaCoordinador();
      return toast('Renombrado. Se actualizaron ' + cant + ' registros.', 'ok');
    }
    guardarDatosFinanciador(n, datos);
    aplicarValorUnidad(n, nuevoVU);
    auditar(nuevo ? 'prestador-alta' : 'prestador-editar', 'Financiador «' + n + '»');
    cerrarModal(); vistaCoordinador();
    toast(nuevo ? 'Financiador agregado.' : 'Datos guardados.', 'ok');
  };

  if($('#fnFusionar')) $('#fnFusionar').onclick = () => elegirDestinoFinanciador(nombre);
  if($('#fnBorrar')) $('#fnBorrar').onclick = () => confirmar('Borrar financiador',
    'No tiene fichas asociadas, así que se puede quitar del catálogo sin afectar nada.',
    () => {
      const r = datosFinanciador(nombre);
      if(r) eliminar('obrasSociales', r.id);
      const oc = prestadoresOcultos();
      const k = clavePrestador(nombre);
      if(oc.finOcultos.indexOf(k) < 0){ oc.finOcultos.push(k); guardarOcultos(oc); }
      auditar('prestador-borrar', 'Financiador «' + nombre + '» (sin fichas)');
      cerrarModal(); vistaCoordinador(); toast('Financiador eliminado.', 'ok');
    }, 'Borrar', true);
  if($('#fnOcultar')) $('#fnOcultar').onclick = () => confirmar('Dar de baja',
    'Deja de aparecer en los desplegables. Las ' + uso + ' fichas ya emitidas lo conservan.',
    () => {
      const oc = prestadoresOcultos(), k = clavePrestador(nombre);
      if(oc.finOcultos.indexOf(k) < 0){ oc.finOcultos.push(k); guardarOcultos(oc); }
      auditar('prestador-baja', 'Financiador «' + nombre + '»');
      cerrarModal(); vistaCoordinador(); toast('Financiador dado de baja.', 'ok');
    }, 'Dar de baja', true);
}

function aplicarValorUnidad(nombre, valor){
  const vu = Object.assign({}, DB.config.valoresUnidad || {});
  if(valor > 0) vu[nombre] = valor; else delete vu[nombre];
  vu.id = 'valoresUnidad';
  escribir('config', 'valoresUnidad', vu);
  DB.config.valoresUnidad = vu;
}

function elegirDestinoFinanciador(desde){
  const otros = obrasSociales().filter(o => clavePrestador(o) !== clavePrestador(desde));
  abrirModal('Fusionar «' + desde + '»',
    '<p class="mini mb8">Elegí con cuál se une. Las ' + usoFinanciador(desde) +
      ' fichas de «' + esc(desde) + '» pasan a llamarse como el que elijas.</p>'+

/* ==================== FICHA DE UNA INSTITUCIÓN ==================== */

  const nuevo = !id;

  const uso = nuevo ? 0 : usoInstitucion(id);

  abrirModal(nuevo ? 'Nueva institución' : i.nombre,
    (nuevo ? '' :
      '<div class="grid c2 mb8">'+
        kpi('Fichas', uso, uso?'azul':'', ico('ficha'))+
        kpi('Anestesiólogos', lista('usuarios')
          .filter(u => (u.instituciones||[]).indexOf(id) >= 0).length, 'aqua', ico('pacientes'))+
      '</div>')+
    campoTxt('inNombre','Nombre *', i.nombre)+
    '<div id="inAviso"></div>'+
    '<div class="grid c2">'+
      campoSel('inCiudad','Ciudad',
        ['Ushuaia','Río Grande','Tolhuin','Otra localidad de TDF','Fuera de la provincia'], i.ciudad)+
      campoSel('inTipo','Tipo',
        ['Público','Privado','Obra social','Fuerzas Armadas','Municipal','Otro'], i.tipo)+
    '</div>'+
    '<hr class="sep"><label class="mini strong" style="display:block;margin-bottom:8px">'+
      'Datos administrativos</label>'+
    '<div class="grid c2">'+
      campoTxt('inCuit','CUIT', i.cuit)+
      campoTxt('inTel','Teléfono', i.telefono)+
    '</div>'+
    '<div class="grid c2">'+
      campoTxt('inContacto','Contacto (jefatura, facturación)', i.contacto)+
      campoTxt('inEmail','Correo', i.email)+
    '</div>'+
    campoTxt('inDom','Domicilio', i.domicilio)+
    campoArea('inNotas','Notas', i.notas)+
    (nuevo ? '' :
      '<hr class="sep">'+
      '<div class="btn-row">'+
        '<button class="btn warn chico" id="inFusionar">'+ico('copiar')+' Fusionar con otra</button>'+
        (uso === 0
          ? '<button class="btn danger chico" id="inBorrar">'+ico('borrar')+' Borrar</button>'
          : '<button class="btn ghost chico" id="inOcultar">'+ico('candado')+' Dar de baja</button>')+
      '</div>'+
      '<p class="mini mt8">'+(uso === 0
        ? 'No tiene fichas asociadas: se puede borrar sin consecuencias.'
        : 'Tiene '+uso+' ficha'+(uso===1?'':'s')+'. Darla de baja la saca de los desplegables y '+
          'conserva el historial.')+'</p>'),
    '<button class="btn ghost" data-cerrar>Cancelar</button>'+
    '<button class="btn pri" id="inGuardar">'+ico('check')+' Guardar</button>');

  const revisar = () => {
    const v = $('#inNombre').value.trim();
    const par = v ? instituciones().filter(o => o.id !== id && parecidoPrestador(v, o.nombre)) : [];
    $('#inAviso').innerHTML = par.length
      ? '<div class="aviso warn">'+ico('alerta')+'<div><b>Ya existe algo parecido:</b> '+
        par.map(o => esc(o.nombre)).join(' · ')+'</div></div>'
      : '';
  };
  $('#inNombre').oninput = debounce(revisar, 250);
  revisar();

  $('#inGuardar').onclick = () => {
    const n = val('inNombre').trim();
    if(!n) return toast('El nombre es obligatorio.', 'err');
    const datos = { nombre:n, ciudad:val('inCiudad'), tipo:val('inTipo'), cuit:val('inCuit'),
                    telefono:val('inTel'), contacto:val('inContacto'), email:val('inEmail'),
                    domicilio:val('inDom'), notas:val('inNotas') };
    if(nuevo){
      const nid = uid('ins');
      escribir('instituciones', nid, Object.assign({ id:nid }, datos));
      auditar('prestador-alta', 'Institución «' + n + '»');
    } else if(i.base){
      /* Las de base no se editan en su lugar: se crea una copia propia y se
         fusiona la de base hacia ella, para que las fichas la sigan. */
      const nid = uid('ins');
      escribir('instituciones', nid, Object.assign({ id:nid }, datos));
      fusionarInstitucion(id, nid, 'edición de institución de base');
    } else {
      escribir('instituciones', id, Object.assign({}, i, datos, { id }));
      auditar('prestador-editar', 'Institución «' + n + '»');
    }
    cerrarModal(); vistaCoordinador();
    toast(nuevo ? 'Institución agregada.' : 'Institución actualizada.', 'ok');
  };

  if($('#inFusionar')) $('#inFusionar').onclick = () => {
    const otras = instituciones().filter(o => o.id !== id);
    abrirModal('Fusionar «' + i.nombre + '»',
      '<p class="mini mb8">Las ' + uso + ' fichas de esta institución pasan a la que elijas.</p>'+
      campoSel('fiDestino','Unir con', [{v:'',t:'—'}].concat(
        otras.map(o => ({ v:o.id, t:o.nombre })))),
      '<button class="btn ghost" data-cerrar>Cancelar</button>'+
      '<button class="btn warn" id="fiOK">Fusionar</button>');
    $('#fiOK').onclick = () => {
      const h = $('#fiDestino').value;
      if(!h) return toast('Elegí la institución de destino.', 'err');
      confirmarFusionInstitucion(i, institucionPorId(h), 'fusión manual');
    };
  };
  if($('#inBorrar')) $('#inBorrar').onclick = () => confirmar('Borrar institución',
    'No tiene fichas asociadas, así que se puede quitar del catálogo sin afectar nada.',
    () => {
      if(!i.base) eliminar('instituciones', id);
      const oc = prestadoresOcultos();
      if(oc.instOcultas.indexOf(id) < 0){ oc.instOcultas.push(id); guardarOcultos(oc); }
      auditar('prestador-borrar', 'Institución «' + i.nombre + '» (sin fichas)');
      cerrarModal(); vistaCoordinador(); toast('Institución eliminada.', 'ok');
    }, 'Borrar', true);
  if($('#inOcultar')) $('#inOcultar').onclick = () => confirmar('Dar de baja',
    'Deja de aparecer en los desplegables. Las ' + uso + ' fichas ya emitidas la conservan.',
    () => {
      const oc = prestadoresOcultos();
      if(oc.instOcultas.indexOf(id) < 0){ oc.instOcultas.push(id); guardarOcultos(oc); }
      auditar('prestador-baja', 'Institución «' + i.nombre + '»');
      cerrarModal(); vistaCoordinador(); toast('Institución dada de baja.', 'ok');
    }, 'Dar de baja', true);
}

/* =========================================================================
   AVISOS Y ALARMAS
   Recordatorios de cirugías próximas, datos faltantes en cada ficha,
   pendientes de facturación y de cobro, y perfil incompleto.
   Se muestran en la campana del encabezado y resumidos en el panel.
   ========================================================================= */

/* ------------------------------------------- Qué le falta a una ficha -- */
function faltantesFicha(f){
  const m = [];
  const hoy = hoyISO();
  const pasada = (f.fecha || '') < hoy;
  const v = f.v || {}, sc = v.scores || {}, pl = f.plan || {}, a = f.acto || {}, h = f.hon || {};

  const r = f.recup || {};
  /* La solapa que se nombra es el paso del flujo al que hay que ir */
  if(!f.pacienteId)                        m.push({ t:'paciente', s:'paciente', critico:true });
  if(!f.institucion)                       m.push({ t:'institución', s:'paciente', critico:true });
  if(!f.cirugia)                           m.push({ t:'cirugía', s:'paciente', critico:true });
  if(!f.diagnostico && !f.dxQuirurgico)    m.push({ t:'diagnóstico', s:'paciente' });
  if(!f.obraSocial)                        m.push({ t:'financiador', s:'paciente' });
  if(!f.cirujano)                          m.push({ t:'cirujano', s:'paciente' });
  if(!pesoDePaciente(f))                   m.push({ t:'peso del paciente', s:'paciente', critico:true });
  if(!sc.asa)                              m.push({ t:'clasificación ASA', s:'preanestesia', critico:true });
  if(!(v.antecedentes2 || []).length && !v.sinAntecedentes)
                                           m.push({ t:'antecedentes patológicos', s:'preanestesia' });
  if(!(v.examen || {}).ta)                 m.push({ t:'signos vitales de la consulta', s:'preanestesia' });
  if(!(v.va || {}).mallampati)             m.push({ t:'evaluación de la vía aérea', s:'preanestesia', critico:true });
  if(!(v.lab || {}).hb)                    m.push({ t:'laboratorio', s:'preanestesia' });
  if(!(v.ayuno || {}).tipo)                m.push({ t:'control de ayuno', s:'preanestesia' });
  if(!(v.riesgo || {}).fundamento)         m.push({ t:'conclusión de aptitud', s:'preanestesia', critico:true });
  if(!(pl.tecnica || []).length)           m.push({ t:'plan anestésico', s:'preanestesia', critico:true });
  if(!(f.consent || {}).quien)             m.push({ t:'consentimiento informado', s:'consent', critico:true });
  if(pasada){
    if(!(a.tecnicas || []).length)         m.push({ t:'técnica anestésica realizada', s:'anestesia', critico:true });
    if(!a.finCirugia && !a.finAnestesia)   m.push({ t:'tiempos del procedimiento', s:'anestesia', critico:true });
    if(!(a.drogas || []).length)           m.push({ t:'drogas administradas', s:'anestesia' });
    if(!(a.controles || []).length)        m.push({ t:'controles de signos vitales', s:'anestesia' });
    if(!(a.eventos2 || []).length && !a.sinEventos)
                                           m.push({ t:'eventos intraoperatorios', s:'anestesia' });
    if(!r.aldreteTotal)                    m.push({ t:'Aldrete al egreso', s:'recuperacion' });
    if(!(f.firma || {}).firmado)           m.push({ t:'firma de la ficha', s:'firma', critico:true });
  }
  if(esActorFicha(f) && !h.modalidad)      m.push({ t:'honorarios del acto', s:'hon' });
  if(esAutorFicha(f) && !(f.honConsulta||{}).modalidad)
                                           m.push({ t:'honorarios de la consulta', s:'hon' });
  return m;
}

/* El peso vive en la historia del paciente, no en la ficha */
function pesoDePaciente(f){
  const p = DB.pacientes[f.pacienteId] || {};
  return Number(p.peso) || 0;
}

function diasHasta(iso){
  if(!iso) return null;
  const a = new Date(hoyISO() + 'T12:00:00'), b = new Date(iso + 'T12:00:00');
  return Math.round((b - a) / 86400000);
}
function cuandoTexto(d){
  if(d === 0) return 'HOY';
  if(d === 1) return 'MAÑANA';
  if(d === -1) return 'ayer';
  if(d < 0) return 'hace ' + (-d) + ' días';
  return 'en ' + d + ' días';
}

/* ------------------------------------------------- Cálculo de avisos -- */
function calcularAvisos(){
  const av = [];
  const hoy = hoyISO();

  /* --- 0. Comunicación interna: reclamos sin responder --- */
  misHilos().forEach(h => {
    const u = ultimoMensaje(h) || {};
    const hs = Math.floor(horasDesde(u.cuando));
    if(hiloVencido(h)){
      av.push({ nivel:'danger', icono:'correo', orden:1,
        titulo:'Sin responder hace ' + hs + ' h — ' + h.asunto,
        detalle: nombreParticipante(u.uid) + ' escribió y todavía no contestaste.' +
                 '\n«' + String(u.texto||'').slice(0,160) + '»',
        accion: () => abrirHilo(h.id) });
    } else if(miReclamoSinRespuesta(h)){
      av.push({ nivel:'warn', icono:'reloj', orden:2,
        titulo:'Tu reclamo lleva ' + hs + ' h sin respuesta — ' + h.asunto,
        detalle:'Nadie contestó desde tu último mensaje. Podés insistir o darlo por resuelto.',
        accion: () => abrirHilo(h.id) });
    } else if(hiloNoLeido(h)){
      av.push({ nivel:'info', icono:'correo', orden:3,
        titulo:'Mensaje nuevo — ' + h.asunto,
        detalle: nombreParticipante(u.uid) + ': «' + String(u.texto||'').slice(0,160) + '»',
        accion: () => abrirHilo(h.id) });
    }
  });

  /* El contable no accede a información clínica: sus avisos terminan acá. */
  if(!verDatosClinicos()) return av.sort((a,b) => a.orden - b.orden);

  const fichas = misFichas();

  /* --- 1. Solicitudes de acceso (coordinación) --- */
  if(esCoordinador()){
    const p = pendientes().length;
    if(p) av.push({ nivel:'danger', icono:'campana', orden:0,
      titulo: p + ' solicitud' + (p===1?'':'es') + ' de acceso sin resolver',
      detalle:'Verificá la matrícula para habilitar el ingreso.',
      accion: () => { coordSeccion = 'solicitudes'; irA('coordinador'); } });
  }

  /* --- 2. Cirugías de los próximos 7 días --- */
  fichas.filter(f => f.fecha && f.fecha >= hoy && diasHasta(f.fecha) <= 7)
    .sort((a,b) => (a.fecha + (a.hora||'')) < (b.fecha + (b.hora||'')) ? -1 : 1)
    .forEach(f => {
      const d = diasHasta(f.fecha);
      const p = DB.pacientes[f.pacienteId] || {};
      const falt = faltantesFicha(f);
      const criticos = falt.filter(x => x.critico);
      const urgente = d <= 1 && criticos.length;
      av.push({
        nivel: urgente ? 'danger' : (d === 0 ? 'warn' : 'info'),
        icono: d === 0 ? 'alerta' : 'calendario',
        orden: 10 + d,
        titulo: cuandoTexto(d) + (f.hora ? ' ' + f.hora + ' h' : '') + ' — ' +
                (p.apellido ? p.apellido + ', ' + p.nombre : 'sin paciente'),
        detalle: (f.cirugia || 'sin cirugía cargada') + ' · ' +
                 nombreInstitucion(f.institucion).split('"')[0].trim() +
                 (f.caracter !== 'programada' ? ' · ' + f.caracter.toUpperCase() : '') +
                 (actorFicha(f) !== f.ownerUid
                   ? '\nValoración: ' + autorFicha(f) + ' · Acto: ' + nombreActor(f) : '') +
                 (criticos.length
                   ? '\n⚠ Faltan datos esenciales: ' + criticos.map(x => x.t).join(', ') + '.'
                   : (falt.length ? '\nFaltan: ' + falt.map(x => x.t).join(', ') + '.' : '\nFicha completa.')),
        fichaId: f.id, solapa: criticos.length ? criticos[0].s : 'qx'
      });
    });

  /* --- 3. Cirugías ya realizadas sin registro del acto --- */
  fichas.filter(f => f.fecha && f.fecha < hoy && !(f.acto || {}).finAnestesia)
    .sort((a,b) => a.fecha < b.fecha ? 1 : -1).slice(0, 12)
    .forEach(f => {
      const p = DB.pacientes[f.pacienteId] || {};
      av.push({ nivel:'warn', icono:'monitor', orden:30,
        titulo:'Sin registro del acto anestésico — ' + (p.apellido||'—') + ', ' + (p.nombre||''),
        detalle:(f.cirugia||'') + ' del ' + fFecha(f.fecha) + ' (' + cuandoTexto(diasHasta(f.fecha)) + ').' +
                '\nCompletá tiempos, técnica realizada, eventos y Aldrete.',
        fichaId:f.id, solapa:'acto' });
    });

  /* --- 4. Cirugías realizadas sin honorarios cargados --- */
  fichas.filter(f => f.fecha && f.fecha < hoy && esActorFicha(f) && !(f.hon || {}).modalidad)
    .sort((a,b) => a.fecha < b.fecha ? 1 : -1).slice(0, 12)
    .forEach(f => {
      const p = DB.pacientes[f.pacienteId] || {};
      av.push({ nivel:'warn', icono:'dinero', orden:35,
        titulo:'Sin honorarios cargados — ' + (p.apellido||'—') + ', ' + (p.nombre||''),
        detalle:(f.cirugia||'') + ' del ' + fFecha(f.fecha) +
                '.\nMientras no cargues la modalidad del acto no aparece en tu facturación del mes.',
        fichaId:f.id, solapa:'hon' });
    });

  /* --- 5. Facturación del mes anterior sin presentar --- */
  const mesAnt = (() => { const d = new Date(); d.setMonth(d.getMonth()-1); return mesDe(d.toISOString()); })();
  const sinPresentar = misPrestaciones().filter(x => mesDe(x.fecha) === mesAnt &&
    x.monto > 0 && x.estado === 'Pendiente');
  if(sinPresentar.length){
    const t = sinPresentar.reduce((a,x) => a + x.monto, 0);
    av.push({ nivel:'warn', icono:'archivo', orden:40,
      titulo:'Facturación de ' + nombreMes(mesAnt) + ' sin presentar',
      detalle: sinPresentar.length + ' prestaciones por ' + fMoneda(t) +
               ' siguen en estado Pendiente.\nRevisalas y descargá el resumen en Excel o PDF.',
      accion: () => { facMes = mesAnt; facEstado = 'Pendiente'; irA('facturacion'); } });
  }

  /* --- 6. Cobros demorados más de 60 días --- */
  const demorados = misPrestaciones().filter(x => {
    if(['Presentado','Facturado'].indexOf(x.estado) < 0) return false;
    const d = diasHasta(x.fechaPresentacion || x.fecha);
    return d !== null && d < -60;
  });
  if(demorados.length){
    const t = demorados.reduce((a,x) => a + x.monto, 0);
    av.push({ nivel:'warn', icono:'reloj', orden:45,
      titulo: demorados.length + ' prestacion' + (demorados.length===1?'':'es') + ' sin cobrar hace más de 60 días',
      detalle:'Total pendiente: ' + fMoneda(t) + '.\nRevisá el estado con cada financiador.',
      accion: () => { facEstado = 'Facturado'; irA('facturacion'); } });
  }

  /* --- 7. Borradores olvidados --- */
  const viejos = fichas.filter(f => (f.estado || 'borrador') === 'borrador' &&
    f.fecha && diasHasta(f.fecha) < -14);
  if(viejos.length){
    av.push({ nivel:'info', icono:'editar', orden:50,
      titulo: viejos.length + ' ficha' + (viejos.length===1?'':'s') + ' en borrador hace más de dos semanas',
      detalle:'Completalas o eliminalas para que las estadísticas reflejen tu actividad real.',
      accion: () => { filtroFichas.estado = 'borrador'; irA('fichas'); } });
  }

  /* --- 8. Perfil incompleto --- */
  if(!esCoordinador() && USUARIO){
    const f = [];
    if(!USUARIO.matriculaProvincial || USUARIO.matriculaProvincial === '—') f.push('matrícula provincial');
    if(!USUARIO.cuit) f.push('CUIT');
    if(!USUARIO.firmaDataUrl) f.push('firma digital');
    if(f.length) av.push({ nivel:'info', icono:'usuario', orden:60,
      titulo:'Tu perfil está incompleto',
      detalle:'Falta cargar: ' + f.join(', ') + '.\nEstos datos encabezan y firman cada ficha que emitís.',
      accion: () => irA('perfil') });
  }

  /* --- 9. Sincronización sin configurar (sólo coordinación) --- */
  if(esCoordinador() && !configNube()){
    av.push({ nivel:'info', icono:'nube', orden:70,
      titulo:'Los datos se guardan sólo en este dispositivo',
      detalle:'Todavía no está conectada la base de datos compartida. Hasta que se conecte, ' +
              'lo que carga cada socio no se ve en los demás equipos.',
      accion: abrirSincronizacion });
  }

  return av.sort((a,b) => a.orden - b.orden);
}

function conteoAvisos(){
  const a = calcularAvisos();
  return { total:a.length, urgentes:a.filter(x => x.nivel === 'danger').length };
}

/* --------------------------------------------------- Panel de avisos -- */
function abrirAvisos(){
  const av = calcularAvisos();
  const cuerpo = av.length
    ? av.map((a,i) =>
        '<div class="aviso '+a.nivel+'" style="cursor:'+((a.accion||a.fichaId)?'pointer':'default')+
          ';align-items:flex-start" data-av="'+i+'">'+
          ico(a.icono)+
          '<div style="flex:1;min-width:0"><b>'+esc(a.titulo)+'</b>'+
          '<div style="white-space:pre-line;margin-top:3px;opacity:.92">'+esc(a.detalle)+'</div></div>'+
          ((a.accion||a.fichaId) ? '<span style="opacity:.5;flex:none">'+ico('flecha')
            .replace('<svg','<svg style="transform:rotate(-90deg);width:15px;height:15px"')+'</span>' : '')+
        '</div>').join('')
    : '<div class="vacio">'+ico('check')+'<b>No hay nada pendiente</b>'+
      '<span>Todas tus fichas están completas y al día.</span></div>';

  const permiso = ('Notification' in window) ? Notification.permission : 'no-soportado';
  const pie = ('Notification' in window)
    ? '<hr class="sep"><label class="chk'+(permiso==='granted'?' sel':'')+'" id="avNotif" style="width:100%">'+
      '<input type="checkbox"'+(permiso==='granted'?' checked disabled':'')+'>'+
      (permiso === 'granted'
        ? 'Recordatorios del sistema activados'
        : (permiso === 'denied'
           ? 'Recordatorios bloqueados en este navegador'
           : 'Avisarme con una notificación del sistema'))+
      '</label>'+
      '<p class="mini mt8">Al abrir la app te recuerda las cirugías del día y las del día siguiente.</p>'
    : '';

  abrirModal('Avisos y recordatorios', cuerpo + pie,
    '<button class="btn pri" data-cerrar>Cerrar</button>');

  $$('#modal [data-av]').forEach(el => el.onclick = () => {
    const a = av[Number(el.dataset.av)];
    cerrarModal();
    setTimeout(() => {
      if(a.fichaId){
        abrirFicha(a.fichaId);
        if(a.solapa === 'consent'){ abrirConsentimiento(fichaActual); }
        else if(a.solapa){ solapaFicha = a.solapa; pintarFicha(); }
      } else if(a.accion) a.accion();
    }, 180);
  });

  const sw = $('#avNotif');
  if(sw && permiso === 'default') sw.onclick = e => {
    e.preventDefault();
    Notification.requestPermission().then(p => {
      if(p === 'granted'){ toast('Recordatorios activados.', 'ok'); notificarCirugias(true); }
      else toast('No se activaron los recordatorios.', 'warn');
      cerrarModal();
    });
  };
}

/* ------------------------------------------ Notificaciones del sistema */
function notificarCirugias(forzar){
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  const clave = 'afar_notif_' + hoyISO();
  if(!forzar && localStorage.getItem(clave)) return;
  const hoy = misFichas().filter(f => f.fecha === hoyISO());
  const man = misFichas().filter(f => f.fecha === diaRel(1));
  if(!hoy.length && !man.length) return;
  const partes = [];
  if(hoy.length) partes.push(hoy.length + ' hoy');
  if(man.length) partes.push(man.length + ' mañana');
  const incompletas = hoy.concat(man).filter(f => faltantesFicha(f).some(x => x.critico)).length;
  try{
    new Notification('AFAAR — ' + partes.join(' y '), {
      body: (hoy.length
        ? hoy.map(f => (f.hora||'') + ' ' + (f.cirugia||'sin cirugía')).join('\n')
        : 'Sin cirugías hoy.') +
        (incompletas ? '\n⚠ ' + incompletas + ' ficha(s) con datos esenciales sin cargar.' : ''),
      icon:'icons/icon-192.png', tag:'afaar-cirugias'
    });
    localStorage.setItem(clave, '1');
  }catch(e){}
}

/* ------------------------- Banner de faltantes dentro de la ficha ----- */
function bannerFaltantes(f){
  const m = faltantesFicha(f);
  if(!m.length) return '<div class="aviso ok no-print">'+ico('check')+
    '<div><b>Ficha completa.</b> No falta ningún dato.</div></div>';
  const criticos = m.filter(x => x.critico), otros = m.filter(x => !x.critico);
  const d = diasHasta(f.fecha);
  const inminente = d !== null && d >= 0 && d <= 1;
  return '<div class="aviso '+(criticos.length ? (inminente ? 'danger' : 'warn') : 'info')+' no-print">'+
    ico(criticos.length ? 'alerta' : 'info')+
    '<div><b>'+(criticos.length
      ? 'Faltan ' + criticos.length + ' dato' + (criticos.length===1?'':'s') + ' esencial' + (criticos.length===1?'':'es')
      : 'Faltan datos opcionales')+
      (inminente && criticos.length ? ' y la cirugía es ' + cuandoTexto(d).toLowerCase() : '')+'.</b><br>'+
    (criticos.length ? '<b>Esenciales:</b> '+esc(criticos.map(x=>x.t).join(' · '))+'<br>' : '')+
    (otros.length ? '<span style="opacity:.85">Opcionales: '+esc(otros.map(x=>x.t).join(' · '))+'</span>' : '')+
    '</div></div>';
}

/* ========================== CALCULADORAS ========================== */
function abrirCalculadoras(){
  abrirModal('Calculadoras anestesiológicas',
    '<div class="campo"><label>Peso del paciente (kg)</label>'+
      '<input type="number" id="calcPeso" step="0.1" placeholder="70" inputmode="decimal"></div>'+
    '<div class="grid c2">'+
      '<div class="campo"><label>Talla (cm)</label><input type="number" id="calcTalla" placeholder="170"></div>'+
      '<div class="campo"><label>Edad (años)</label><input type="number" id="calcEdad" placeholder="45"></div>'+
    '</div>'+
    '<div class="campo"><label>Sexo</label><select id="calcSexo">'+
      '<option value="M">Masculino</option><option value="F">Femenino</option></select></div>'+
    '<div class="grid c2">'+
      '<div class="campo"><label>Hematocrito inicial (%)</label><input type="number" id="calcHto" placeholder="40"></div>'+
      '<div class="campo"><label>Hematocrito mínimo aceptable (%)</label><input type="number" id="calcHtoMin" placeholder="24"></div>'+
    '</div>'+
    '<div id="calcOut"></div>',
    '<button class="btn pri" data-cerrar>Cerrar</button>', '620px');

  const recalc = () => {
    const p = Number($('#calcPeso').value) || 0;
    const t = Number($('#calcTalla').value) || 0;
    const e = Number($('#calcEdad').value) || 0;
    const sx = $('#calcSexo').value;
    if(!p){ $('#calcOut').innerHTML = '<p class="mini">Ingresá el peso para calcular.</p>'; return; }

    const pi = t ? pesoIdeal(t, sx) : null;
    const imc = calcIMC(p, t);
    const sc = t ? superficieCorporal(p, t) : null;
    const volemia = e && e < 1 ? 85 : (e && e < 12 ? 75 : (sx === 'F' ? 65 : 70));
    const vs = p * volemia;
    const hto = Number($('#calcHto').value) || 0, htoMin = Number($('#calcHtoMin').value) || 0;
    const psp = (hto && htoMin && hto > htoMin) ? vs * (hto - htoMin) / hto : null;
    const mant = p <= 10 ? p*4 : (p <= 20 ? 40 + (p-10)*2 : 60 + (p-20));
    const tubo = e ? (e/4 + 4) : null;

    const t3 = (l, v, s) => '<tr><td>'+l+'</td><td class="num"><b>'+v+'</b></td><td class="mini">'+(s||'')+'</td></tr>';
    $('#calcOut').innerHTML =
    '<div class="tabla-wrap mt14"><table><tbody>'+
      (imc ? t3('IMC', imc.toFixed(1)+' kg/m²', clasificaIMC(imc)) : '')+
      (sc ? t3('Superficie corporal', sc.toFixed(2)+' m²', 'Mosteller') : '')+
      (pi ? t3('Peso ideal', pi.toFixed(1)+' kg', 'Devine — dosificar relajantes y volumen tidal') : '')+
      t3('Volemia estimada', Math.round(vs)+' ml', volemia+' ml/kg')+
      (psp ? t3('Pérdida sanguínea permisible', Math.round(psp)+' ml', 'Hasta el Hto mínimo indicado') : '')+
      t3('Mantenimiento hídrico', Math.round(mant)+' ml/h', 'Regla 4-2-1')+
      t3('Volumen tidal protector', Math.round((pi||p)*6)+'–'+Math.round((pi||p)*8)+' ml', '6-8 ml/kg de peso ideal')+
      (tubo && e < 16 ? t3('Tubo endotraqueal', (tubo).toFixed(1)+' sin balón / '+(e/4+3.5).toFixed(1)+' con balón',
        'Profundidad ≈ '+Math.round(tubo*3)+' cm') : '')+
    '</tbody></table></div>'+

    '<h3 style="font-size:14px;margin:18px 0 8px">Dosis calculadas</h3>'+
    '<div class="tabla-wrap"><table><tbody>'+
      t3('Propofol inducción', (p*1.5).toFixed(0)+'–'+(p*2.5).toFixed(0)+' mg', '1,5-2,5 mg/kg')+
      t3('Fentanilo', (p*1).toFixed(0)+'–'+(p*3).toFixed(0)+' µg', '1-3 µg/kg')+
      t3('Rocuronio', (p*0.6).toFixed(0)+' mg', '1,2 mg/kg = '+(p*1.2).toFixed(0)+' mg para secuencia rápida')+
      t3('Succinilcolina', (p*1).toFixed(0)+'–'+(p*1.5).toFixed(0)+' mg', '1-1,5 mg/kg')+
      t3('Sugammadex', (p*2).toFixed(0)+' / '+(p*4).toFixed(0)+' / '+(p*16).toFixed(0)+' mg',
         'Bloqueo moderado / profundo / reversión inmediata')+
      t3('Ketamina', (p*1).toFixed(0)+'–'+(p*2).toFixed(0)+' mg', '1-2 mg/kg EV')+
      t3('Lidocaína máx.', (p*4.5).toFixed(0)+' mg ('+(p*7).toFixed(0)+' con adrenalina)', 'al 2 % = '+((p*4.5)/20).toFixed(1)+' ml')+
      t3('Bupivacaína máx.', (p*2).toFixed(0)+' mg', 'al 0,5 % = '+((p*2)/5).toFixed(1)+' ml')+
      t3('Ropivacaína máx.', (p*3).toFixed(0)+' mg', 'al 0,75 % = '+((p*3)/7.5).toFixed(1)+' ml')+
      t3('Ácido tranexámico', (p*15).toFixed(0)+' mg', '15 mg/kg antes de la incisión')+
      t3('Adrenalina en paro', p < 40 ? (p*10).toFixed(0)+' µg' : '1 mg', p<40?'10 µg/kg':'dosis del adulto')+
    '</tbody></table></div>'+

    '<div class="aviso danger mt14">'+ico('gota')+'<div><b>Rescate lipídico (LAST) para '+p+' kg</b><br>'+
      'Bolo de emulsión lipídica al 20 %: <b>'+(p*1.5).toFixed(0)+' ml</b> en 2-3 min.<br>'+
      'Infusión: <b>'+(p*0.25).toFixed(0)+' ml/min</b> (≈ '+(p*15).toFixed(0)+' ml/h).<br>'+
      'Máximo acumulado: '+(p*12).toFixed(0)+' ml. Adrenalina ≤ '+(p*1).toFixed(0)+' µg por bolo.</div></div>'+

    '<div class="aviso warn">'+ico('fuego')+'<div><b>Dantrolene para '+p+' kg</b><br>'+
      'Dosis inicial 2,5 mg/kg = <b>'+(p*2.5).toFixed(0)+' mg</b> ('+Math.ceil(p*2.5/20)+' viales de 20 mg). '+
      'Repetir cada 5 min hasta el control; habitualmente hasta '+(p*10).toFixed(0)+' mg.</div></div>';
  };
  ['calcPeso','calcTalla','calcEdad','calcSexo','calcHto','calcHtoMin'].forEach(id => {
    const e = $('#'+id); if(e){ e.oninput = recalc; e.onchange = recalc; }
  });
  recalc();
}

/* ============================ FICHA ANESTESICA ============================ */
/* opts.paraPaciente: copia para el propio paciente. Sale todo lo clinico y el
   consentimiento, y NO salen los honorarios ni el registro intraoperatorio.
   Los honorarios son informacion economica entre el anestesiologo y el
   financiador, no del paciente. */
/* opts.parte recorta el documento segun para que se lo pide:
     'valoracion' -> solo lo preoperatorio, que es lo que se factura como
                     consulta prequirurgica;
     'acto'       -> la ficha completa, incluido el registro intraoperatorio
                     y la recuperacion, que es lo que respalda el honorario
                     del acto anestesico;
     sin opts     -> el documento entero de siempre. */
function documentoFicha(f, opts){
  const paraPaciente = !!(opts && opts.paraPaciente);
  const parte = (opts && opts.parte) || '';
  const soloVal = parte === 'valoracion';
  __secN = 0;
  const p = DB.pacientes[f.pacienteId] || {};
  const v = f.v || {}, pl = f.plan || {}, a = f.acto || {}, h = f.hon || {}, co = f.consent || {};
  const eq = a.equipo || {};
  const u = DB.usuarios[f.ownerUid] || USUARIO || {};
  const ed = edadDe(p.fechaNac, f.fecha);
  const imc = calcIMC((v.examen||{}).peso || p.peso, (v.examen||{}).talla || p.talla);
  const sc = v.scores || {};

  /* recomputar escalas para el documento */
  const eg = calcElGanzouri({
    aperturaBucal:(v.va||{}).aperturaBucal, tiromentoniana:(v.va||{}).tiromentoniana,
    mallampati:(v.va||{}).mallampati, cuelloMov:(v.va||{}).cuelloMov,
    protrusion:(v.va||{}).protrusion, peso:(v.examen||{}).peso || p.peso,
    intubacionPrevia:(v.va||{}).intubacionPrevia });
  const rc = {}; RCRI_ITEMS.forEach((it,i) => rc[it.k] = (sc.rcri||[]).indexOf(i) >= 0);
  const rcri = calcRCRI(rc);
  const sb = calcSTOPBANG(sc.stopbang || {});
  const ap = calcApfel(sc.apfel || {});
  const cap = calcCaprini(sc.caprini || []);
  const ar = calcARISCAT({ edad:ed, spo2:(v.examen||{}).spo2, hb:(v.lab||{}).hb,
    infeccionRespiratoria:sc.arInf, incision:sc.arIncision, duracion:sc.arDuracion,
    urgencia:f.caracter !== 'programada' });

  const aptitud = { apto:'APTO para el acto anestésico', reservas:'APTO CON RESERVAS',
    optimizar:'REQUIERE OPTIMIZACIÓN PREVIA', noapto:'NO APTO en las condiciones actuales'
  }[(v.riesgo||{}).aptitud || 'apto'];

  seccion('Laboratorio y estudios',

    par('Electrocardiograma', (v.estudios||{}).ecg)+

  seccion('Estratificación del riesgo',
    '<table><tr><th>Escala</th><th>Resultado</th><th>Interpretación</th></tr>'+
      (sc.asa ? '<tr><td>ASA Physical Status</td><td><b>ASA '+esc(sc.asa)+(sc.asaE?' E':'')+'</b></td>'+
        '<td>'+esc((ASA_PS.find(x => x.v === sc.asa)||{}).t||'')+'</td></tr>' : '')+
      '<tr><td>El-Ganzouri (vía aérea)</td><td><b>'+eg.n+'/12</b></td><td>'+esc(eg.texto)+'</td></tr>'+
      '<tr><td>RCRI (cardíaco)</td><td><b>'+rcri.n+'/6</b></td><td>'+esc(rcri.texto)+'</td></tr>'+
      '<tr><td>ARISCAT (pulmonar)</td><td><b>'+ar.n+'</b></td><td>'+esc(ar.texto)+'</td></tr>'+
      '<tr><td>STOP-BANG (SAHOS)</td><td><b>'+sb.n+'/8</b></td><td>'+esc(sb.texto)+'</td></tr>'+
      '<tr><td>Apfel (NVPO)</td><td><b>'+ap.n+'/4</b></td><td>'+esc(ap.texto)+'</td></tr>'+
      '<tr><td>Caprini (TEV)</td><td><b>'+cap.n+'</b></td><td>'+esc(cap.texto)+'</td></tr>'+
    '</table>')+

  seccion('Ayuno preoperatorio',
    par('Última ingesta', (v.ayuno||{}).tipo) + par('Hora', (v.ayuno||{}).hora)+
    par('Factores de riesgo de aspiración', (v.ayuno||{}).riesgos)+
    par('Profilaxis indicada', (v.ayuno||{}).profilaxis))+

  seccion('Plan anestésico',
    par('Técnica propuesta', pl.tecnica) + par('Manejo de la vía aérea', pl.dispositivosVA)+
    par('Monitoreo estándar', pl.monitoreoEstandar) + par('Monitoreo avanzado', pl.monitoreoAvanzado)+
    par('Accesos vasculares', pl.accesos)+
    par('Profilaxis antibiótica', pl.atb === 'Otro' ? pl.atbOtro : pl.atb)+
    par('Tromboprofilaxis', pl.tev) + par('Profilaxis de NVPO', pl.nvpo)+
    par('Analgesia postoperatoria', pl.analgesia) + par('Esquema analgésico', pl.analgesiaDetalle)+
    par('Previsión transfusional', pl.transfusion) + par('Destino postoperatorio', pl.destino)+
    par('Indicaciones al paciente', pl.indicaciones) + par('Observaciones', pl.observaciones))+

  seccion('Conclusión de la valoración preanestésica',
    '<div style="border:2px solid #0b2545;padding:9px;margin-bottom:8px;text-align:center;font-weight:bold;font-size:13px">'+
      esc(aptitud)+'</div>'+
    par('Fundamentación', (v.riesgo||{}).fundamento)+
    par('Interconsultas solicitadas', (v.riesgo||{}).interconsultas)+
    par('Fecha de la evaluación', fFecha((v.riesgo||{}).fecha))+
    par('Ámbito', (v.riesgo||{}).ambito))+

  ((paraPaciente || soloVal) ? '' : documentoActo(f))+
  ((paraPaciente || soloVal) ? '' : documentoRecuperacion(f))+

  (co.quien ? seccion('Consentimiento informado anestésico',
    '<div style="font-size:10.5px;white-space:pre-line;text-align:justify;line-height:1.45;'+
      'border:1px solid #c9d6e3;padding:9px;background:#fbfdff">'+esc(TEXTO_CONSENTIMIENTO)+'</div>'+
    par('Firma', co.quien) + par('Firmante', co.firmante)+
    par('Declaraciones', co.items) + par('Aclaraciones', co.observaciones)+
    par('Fecha del consentimiento', fFecha(co.fecha) + (co.hora ? ' — ' + co.hora + ' h' : ''))) : '')+

  ((!paraPaciente && (h.modalidad || (f.honConsulta||{}).modalidad)) ? seccion('Honorarios profesionales',
    '<table><tr><th>Concepto</th><th>Profesional</th><th>Modalidad</th><th>Importe</th><th>Estado</th></tr>'+
    (((f.honConsulta||{}).modalidad && parte !== 'acto') ? '<tr><td>Consulta prequirúrgica</td>'+
      '<td>'+esc(nombreUsuario(f.ownerUid))+'</td>'+
      '<td>'+esc((MODALIDADES_CONSULTA.find(m=>m.id===f.honConsulta.modalidad)||{}).n||'—')+'</td>'+
      '<td>'+fMoneda(f.honConsulta.total||0)+'</td>'+
      '<td>'+esc(f.honConsulta.estado||'Pendiente')+'</td></tr>' : '')+
    ((h.modalidad && !soloVal) ? '<tr><td>Acto anestésico'+
      (h.ua ? ' ('+h.ua+' UA × '+fMoneda(h.valorUnidad||0)+
        (h.pctAdicional ? ' + '+h.pctAdicional+' %' : '')+')' : '')+'</td>'+
      '<td>'+esc(nombreUsuario(actorFicha(f)))+'</td>'+
      '<td>'+esc((MODALIDADES_HONORARIOS.find(m=>m.id===h.modalidad)||{}).n||'—')+'</td>'+
      '<td>'+fMoneda(h.total||0)+'</td>'+
      '<td>'+esc(h.estado||'Pendiente')+'</td></tr>' : '')+
    '</table>') : '')+

  '<div class="firmas">'+
    '<div>'+(co.firmaPaciente ? '<img src="'+co.firmaPaciente+'" style="height:48px;display:block;margin:0 auto -6px">' : '<div style="height:42px"></div>')+
      'Firma del paciente o representante</div>'+
    '<div>'+((co.firmaAnestesiologo || u.firmaDataUrl) ?
      '<img src="'+(co.firmaAnestesiologo || u.firmaDataUrl)+'" style="height:48px;display:block;margin:0 auto -6px">' : '<div style="height:42px"></div>')+
      esc((u.apellido||'')+', '+(u.nombre||''))+'<br>M.P. '+esc(matriculaTxt(u.matriculaProvincial,'M.P.'))+
      (f.actoPorUid && f.actoPorUid !== f.ownerUid ? '<br>Valoración prequirúrgica' : '')+'</div>'+
    (f.actoPorUid && f.actoPorUid !== f.ownerUid ? (function(){
      const w = DB.usuarios[f.actoPorUid] || {};
      return '<div>'+(w.firmaDataUrl
          ? '<img src="'+w.firmaDataUrl+'" style="height:48px;display:block;margin:0 auto -6px">'
          : '<div style="height:42px"></div>')+
        esc((w.apellido||'')+', '+(w.nombre||''))+'<br>M.P. '+esc(matriculaTxt(w.matriculaProvincial,'M.P.'))+
        '<br>Acto anestésico</div>'; })() : '')+
  '</div>'+
  '<div style="margin-top:22px;font-size:9px;color:#678;text-align:center;border-top:1px solid #ccd">'+

/* =========================================================================
   REGISTRO DEL ACTO ANESTESICO EN EL DOCUMENTO
   Las tres tablas del intraoperatorio: drogas, signos vitales y eventos,
   mas el balance hidrico. Es la parte que antes era un campo de texto libre.
   ========================================================================= */
function documentoActo(f){
  const a = f.acto || {};
  const p = DB.pacientes[f.pacienteId] || {};
  const peso = Number(p.peso) || 0;
  const drogas = a.drogas || [];
  const ctrls = (a.controles || []).slice().sort((x,y) => (x.hora||'') < (y.hora||'') ? -1 : 1);
  const evs = a.eventos2 || [];
  const bal = calcularBalance(a.balance);
  const disp = DISPOSITIVOS_FLUJO.find(d => d.k === a.dispositivo);
  const durCx = minutosEntre(a.inicioCirugia, a.finCirugia);
  const durAn = minutosEntre(a.inicioAnestesia, a.finAnestesia);
  const acum = acumuladoAnestesicosLocales(drogas, peso);

  return seccion('Registro del acto anestésico',
    (f.actoPorUid && f.actoPorUid !== f.ownerUid
      ? par('Realizado por', nombreUsuario(f.actoPorUid)) : '')+
    '<table><tr>'+
      '<td style="width:50%"><b>Ingreso a quirófano:</b> '+esc(a.ingreso||'—')+'</td>'+
      '<td><b>Salida a recuperación:</b> '+esc(a.salida||'—')+'</td></tr>'+
    '<tr><td><b>Cirugía:</b> '+esc(a.inicioCirugia||'—')+' a '+esc(a.finCirugia||'—')+
      (durCx !== null ? ' ('+duracionTexto(durCx)+')' : '')+'</td>'+
      '<td><b>Anestesia:</b> '+esc(a.inicioAnestesia||'—')+' a '+esc(a.finAnestesia||'—')+
      (durAn !== null ? ' ('+duracionTexto(durAn)+')' : '')+'</td></tr>'+
    '</table>'+
    par('Técnica anestésica', (a.tecnicas||[]).map(k =>
      (TECNICAS_FLUJO.find(t => t.k === k)||{}).t).filter(Boolean))+
    par('Detalle de la técnica', a.tecnicaDetalle)+
    par('Vía aérea', (disp ? disp.t : '') + (a.tamano ? ' '+a.tamano : '') +
      (a.vaDificil === 'si' ? ' — VÍA AÉREA DIFÍCIL' : ''))+
    par('Cormack-Lehane', a.cormack) + par('Intentos de intubación', a.intentos)+
    par('Monitorización', (a.monitor||[]).concat(a.monitorExtra||[]))+
    par('Accesos vasculares', a.accesos)+
    par('Lista de verificación OMS', (a.oms||[]).map(o =>
      ({entrada:'Entrada',pausa:'Pausa quirúrgica',salida:'Salida'})[o]))+

    /* ---------------------------- drogas ---------------------------- */
    '<h3>Drogas administradas</h3>'+
    (drogas.length
      ? '<table><tr><th>Hora</th><th>Fármaco</th><th>Dosis</th><th>Vía</th><th>Observación</th></tr>'+
        drogas.map(d => '<tr><td>'+esc(d.hora||'—')+'</td><td>'+esc(d.n)+'</td>'+
          '<td>'+esc(fDosis(d.dosis)+' '+(d.unidad||''))+
          (peso && d.unidad === 'mg' ? ' ('+fDosis(d.dosis/peso)+' mg/kg)' : '')+'</td>'+
          '<td>'+esc(d.via||'—')+'</td>'+
          '<td style="font-size:10px">'+esc([d.nota,
            d.pct ? fDosis(d.pct)+' % · '+d.mL+' mL' : '',
            d.infMLh ? d.infMLh+' mL/h' : ''].filter(Boolean).join(' · '))+'</td></tr>').join('')+
        '</table>'
      : '<p style="font-size:10.5px">Sin drogas registradas.</p>')+
    par('Notas de fármacos', a.drogasNota)+
    (acum.items.length
      ? '<div class="par"><b>Anestésicos locales:</b><span>'+
        esc(acum.items.map(x => x.n+' '+fDosis(x.mg)+' mg'+
          (x.mgKg !== null ? ' ('+fDosis(x.mgKg)+' mg/kg)' : '')).join(' · '))+
        (acum.mezcla ? ' — combinación de anestésicos locales: toxicidad aditiva.' : '')+
        '</span></div>' : '')+

    /* ------------------------ signos vitales ------------------------ */
    '<h3>Signos vitales intraoperatorios</h3>'+
    (ctrls.length
      ? '<table><tr><th>Hora</th><th>TA (mmHg)</th><th>FC (lpm)</th><th>SpO₂ (%)</th>'+
        '<th>EtCO₂ (mmHg)</th><th>Temp (°C)</th><th>TOF</th></tr>'+
        ctrls.map(c => '<tr><td>'+esc(c.hora||'—')+'</td>'+
          '<td>'+esc(valorVital(c,'ta')||'—')+'</td><td>'+esc(c.fc||'—')+'</td>'+
          '<td>'+esc(c.spo2||'—')+'</td><td>'+esc(c.etco2||'—')+'</td>'+
          '<td>'+esc(c.temp||'—')+'</td><td>'+esc(c.tof||'—')+'</td></tr>').join('')+
        '</table>'
      : '<p style="font-size:10.5px">Sin controles registrados.</p>')+

    /* -------------------------- balance ----------------------------- */
    '<h3>Balance hídrico</h3>'+
    '<table><tr><th>Ingresos</th><th>mL</th><th>Egresos</th><th>mL</th></tr>'+
      BALANCE_INGRESOS.map((x,i) => {
        const e = BALANCE_EGRESOS[i];
        return '<tr><td>'+esc(x.t)+'</td><td>'+((a.balance||{})[x.k]||0)+'</td>'+
          '<td>'+(e ? esc(e.t) : '')+'</td><td>'+(e ? ((a.balance||{})[e.k]||0) : '')+'</td></tr>';
      }).join('')+
      '<tr><td><b>Total ingresos</b></td><td><b>'+bal.ingresos+'</b></td>'+
      '<td><b>Total egresos</b></td><td><b>'+bal.egresos+'</b></td></tr>'+
      '<tr><td colspan="3"><b>BALANCE</b></td><td><b>'+
        (bal.balance>=0?'+':'')+bal.balance+' mL</b></td></tr>'+
    '</table>'+
    par('Hemoderivados', a.hemoderivados) + par('Drogas vasoactivas', a.vasoactivos)+

    /* --------------------------- eventos ---------------------------- */
    '<h3>Eventos intraoperatorios</h3>'+
    (evs.length
      ? '<table><tr><th>Hora</th><th>Evento</th><th>Descripción</th><th>Conducta</th></tr>'+
        evs.map(e => '<tr><td>'+esc(e.hora||'—')+'</td><td><b>'+esc(e.tipo)+'</b></td>'+

          ? 'Sin eventos adversos durante el procedimiento.'
          : 'No se registraron eventos.')+'</p>')+
    par('Observaciones del acto', a.observaciones));
}

function documentoRecuperacion(f){
  const r = f.recup || {};
  if(!r.aldreteTotal && !r.destino && !r.observaciones) return '';
  return seccion('Recuperación postanestésica',
    par('Hora de ingreso a la URPA', r.hora)+
    par('Oxigenoterapia', r.oxigeno)+
    (r.aldreteCompleto
      ? '<table><tr>'+ALDRETE.map(i => '<th>'+esc(i.t)+'</th>').join('')+'<th>Total</th></tr><tr>'+
        ALDRETE.map(i => '<td>'+((r.aldrete||{})[i.k])+'</td>').join('')+
        '<td><b>'+r.aldreteTotal+'/10</b></td></tr></table>'+
        '<div class="par"><span>'+(r.aldreteTotal >= 9
          ? 'Cumple criterios de alta de la recuperación postanestésica.'
