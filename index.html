  $('#vdBuscar').oninput = debounce(e => {
    const q = norm(e.target.value.trim());
    $$('#vdLista .vd-item').forEach(b => {
      b.style.display = (!q || b.dataset.busca.indexOf(q) >= 0) ? '' : 'none';
    });
    $$('#vdLista .vd-grupo').forEach(d => {
      const hay = $$('.vd-item', d).some(b => b.style.display !== 'none');
      d.style.display = hay ? '' : 'none';
      if(q && hay) d.open = true;
    });
  }, 180);
}

/* ------------------------------------------- Calculadora de una droga */
function abrirDroga(nombre, indiceEdicion){
  const fa = farmacoPorNombre(nombre);
  if(!fa) return toast('Ese fármaco no está en el vademécum.', 'err');
  const f = fichaActual;
  const peso = pesoDeFicha(f);
  const edad = edadDeFicha(f);
  const pedia = esPediatrico(edad);
  const editando = indiceEdicion !== undefined && indiceEdicion !== null;
  const prev = editando ? (f.acto.drogas || [])[indiceEdicion] : null;
  const reglas = reglasAplicables(fa, edad);
  const esFav = favoritosDrogas().indexOf(fa.n) >= 0;

  /* Regla de seguridad 1: sin peso no se calcula nada en pediatria */
  const bloqueado = pedia && !peso;

  abrirModal('Detalle de droga',
    '<div class="droga-head">'+
      '<div><h2>'+esc(fa.n)+'</h2>'+
        '<span class="mini">'+esc(grupoVademecum(fa.g).t)+'</span></div>'+
      '<button type="button" class="estrella'+(esFav?' on':'')+'" id="drFav" title="Favorito">★</button>'+
    '</div>'+

    (fa.alerta ? '<div class="aviso danger">'+ico('alerta')+'<div>'+esc(fa.alerta)+'</div></div>' : '')+
    (fa.tof ? '<div class="aviso info">'+ico('monitor')+'<div><b>Monitorización neuromuscular.</b> '+
      'Registrá el TOF antes y después de este fármaco en la solapa de signos vitales.</div></div>' : '')+

    (bloqueado
      ? '<div class="aviso danger">'+ico('alerta')+'<div><b>Falta el peso del paciente.</b><br>'+
        'En pediatría la app exige el peso antes de calcular cualquier dosis. Cargalo en el paso 1 '+
        'y volvé.</div></div>'
      : '')+

    /* ---- indicaciones calculadas ---- */
    (reglas.length && !bloqueado
      ? '<label class="mini strong" style="display:block;margin-bottom:7px">'+
        'Dosis calculada para '+(peso ? fDosis(peso)+' kg' : 'este paciente')+
        ' — '+(pedia?'pediatría':'adulto')+'</label>'+
        '<div class="dosis-ops">'+ reglas.map((r,i) => {
          const c = calcularDosis(r, peso);
          if(c.pesoFalta) return '<div class="dosis-op falta">'+
            '<b>'+esc(r.t)+'</b><span>'+esc(c.rangoDefecto || (r.min+'–'+r.max+' '+r.u))+
            '</span><i>Falta el peso</i></div>';
          return '<button type="button" class="dosis-op" data-regla="'+i+'" '+
            'data-min="'+c.min+'" data-max="'+c.max+'" data-unidad="'+esc(c.unidad)+'">'+
            '<b>'+esc(r.t)+'</b>'+
            '<span class="calc">'+esc(c.texto.replace(c.unidad,'').trim())+' '+unidadHTML(c.unidad)+'</span>'+
            '<i>'+esc(c.rango)+' '+esc(c.rangoUnidad)+(c.tope?' · tope aplicado':'')+'</i>'+
            '</button>';
        }).join('') +'</div>'+
        '<div class="ayuda">Tocá una indicación para llevar el valor al campo de dosis. '+
        '<b>Nada se registra solo</b>: el valor queda editable y lo confirmás vos.</div>'
      : (!bloqueado ? '<div class="aviso warn">'+ico('info')+'<div>Este fármaco no tiene dosis '+
          'precargada a propósito: se indica por protocolo, gasometría o técnica. Cargá la dosis '+
          'a mano.</div></div>' : ''))+

    '<hr class="sep">'+

    /* ---- registro de la dosis ---- */
    '<div class="grid c3">'+
      '<div class="campo"><label>Dosis administrada</label>'+
        '<input type="number" step="any" id="drDosis" inputmode="decimal" value="'+
          esc(prev ? prev.dosis : '')+'"></div>'+
      '<div class="campo"><label>Unidad</label>'+
        '<input type="text" id="drUnidad" value="'+esc(prev ? prev.unidad : fa.u)+'" readonly '+
        'class="'+(/mcg/.test(prev ? prev.unidad : fa.u) ? 'u-mcg-campo' : '')+'"></div>'+
      '<div class="campo"><label>Vía</label><select id="drVia">'+
        (fa.vias || VIAS_ADMIN).map(v => '<option'+((prev?prev.via:(fa.vias||[])[0])===v?' selected':'')+
          '>'+esc(v)+'</option>').join('')+
      '</select></div>'+
    '</div>'+
    '<div class="grid c2">'+
      '<div class="campo"><label>Hora</label>'+
        '<div class="hora-campo"><input type="time" id="drHora" value="'+
          esc(prev ? prev.hora : ahoraHora())+'">'+
        '<button type="button" class="btn ghost chico" id="drAhora">Ahora</button></div></div>'+
      '<div class="campo"><label>Volumen a cargar</label>'+
        '<input type="text" id="drML" readonly></div>'+
    '</div>'+

    /* ---- anestesico local: %, volumen y mg ---- */
    (fa.local ? '<div class="card plano local"><h3>'+ico('gota')+'Anestésico local</h3>'+
      '<div class="grid c3">'+
        '<div class="campo"><label>Concentración</label><select id="drPct">'+
          (fa.concentraciones||[]).map(c => '<option value="'+c+'"'+
            (prev && String(prev.pct)===String(c)?' selected':'')+'>'+fDosis(c)+' %</option>').join('')+
        '</select></div>'+
        campoNum('drVol','Volumen (mL)', prev ? prev.mL : '', 'inputmode="decimal"')+
        '<div class="campo"><label>mg calculados</label><input type="text" id="drMg" readonly></div>'+
      '</div>'+
      '<label class="chk'+(prev && prev.adrenalina?' sel':'')+'" id="drAdrL">'+
        '<input type="checkbox" id="drAdr"'+(prev && prev.adrenalina?' checked':'')+'>'+
        'Con adrenalina</label>'+
      '<div id="drLocalAviso"></div>'+
    '</div>' : '')+

    /* ---- infusion ---- */
    (fa.infusion ? '<div class="card plano"><h3>'+ico('vena')+'Infusión</h3>'+
      '<div class="grid c3">'+
        campoNum('drInfMg','Cantidad total en el frasco', prev ? prev.infMg : '')+
        campoNum('drInfML','Volumen final (mL)', prev ? prev.infML : '')+
        campoNum('drInfObj','Objetivo (mcg/kg/min)', prev ? prev.infObj : '', 'step="0.01"')+
      '</div>'+
      '<div id="drInfOut"></div>'+
    '</div>' : '')+

    campoTxt('drNota','Observación', prev ? prev.nota : '')+

    /* ---- referencia del vademecum ---- */
    '<div class="card plano ref"><h3>'+ico('guias')+'Referencia del vademécum</h3>'+
      '<div class="ref-fila'+(pedia?'':' destacada')+'"><span>Adulto</span><p>'+esc(fa.adulto||'—')+'</p></div>'+
      '<div class="ref-fila'+(pedia?' destacada':'')+'"><span>Pediatría</span><p>'+esc(fa.pedia||'—')+'</p></div>'+
      (fa.obs ? '<div class="ref-fila"><span>Uso</span><p>'+esc(fa.obs)+'</p></div>' : '')+
      (fa.pres ? '<div class="ref-fila"><span>Presentación</span><p>'+esc(fa.pres)+'</p></div>' : '')+
    '</div>',

    '<button class="btn ghost" data-cerrar>Cancelar</button>'+
    '<button class="btn pri" id="drOK">'+ico('check')+
      (editando ? ' Guardar cambios' : ' Confirmar y registrar')+'</button>', '760px');

  /* -------------------------------------------------------- cableado */
  $('#drFav').onclick = () => {
    alternarFavorito(fa.n);
    $('#drFav').classList.toggle('on');
    toast(favoritosDrogas().indexOf(fa.n) >= 0 ? 'Agregada a favoritos.' : 'Quitada de favoritos.', 'ok');
  };
  $('#drAhora').onclick = () => { $('#drHora').value = ahoraHora(); };

  $$('#modal [data-regla]').forEach(b => b.onclick = () => {
    /* se propone el punto medio del rango; queda editable */
    const min = Number(b.dataset.min), max = Number(b.dataset.max);
    $('#drDosis').value = redondearDosis(min === max ? min : (min + max) / 2);
    $('#drUnidad').value = b.dataset.unidad;
    $('#drUnidad').className = /mcg/.test(b.dataset.unidad) ? 'u-mcg-campo' : '';
    $$('#modal [data-regla]').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    recalcDroga();
  });

  function recalcDroga(){
    /* mL a cargar según la presentación */
    const ml = mLDePresentacion(fa.pres, val('drDosis'), val('drUnidad'));
    $('#drML').value = ml ? fDosis(ml)+' mL  ('+fa.pres+')' : '—';

    /* anestésico local: % → mg/mL → mg totales */
    if(fa.local && $('#drPct')){
      const pct = Number(val('drPct')), vol = Number(val('drVol')) || 0;
      const mg = mgAnestesicoLocal(pct, vol);
      $('#drMg').value = mg ? fDosis(mg)+' mg' : '—';
      if(mg) $('#drDosis').value = mg;
      const conAdr = chk('drAdr');
      const previas = (f.acto.drogas || []).filter((d,i) => i !== indiceEdicion);
      const acum = acumuladoAnestesicosLocales(
        previas.concat([{ n:fa.n, mg:mg, adrenalina:conAdr }]), peso);
      const mio = acum.items.find(x => x.n === fa.n) || {};
      $('#drLocalAviso').innerHTML =
        '<div class="aviso info">'+ico('calculadora')+'<div>'+
          '<b>'+fDosis(pct)+' % = '+fDosis(pctAmgml(pct))+' mg/mL.</b> '+
          (vol ? vol+' mL = <b>'+fDosis(mg)+' mg</b>. ' : '')+
          (peso && mio.mgKg !== undefined && mio.mgKg !== null
            ? 'Acumulado de '+esc(fa.n)+': <b>'+fDosis(mio.mg)+' mg</b> ('+fDosis(mio.mgKg)+' mg/kg)'+
              (mio.sinTope ? ' — sin máximo universal parametrizado.'
               : (mio.referencia ? ' sobre una referencia de '+fDosis(mio.referencia)+' mg ('+mio.pct+' %).' : '.'))
            : (peso ? '' : 'Sin peso no se calcula mg/kg.'))+
        '</div></div>'+
        (mio.pct !== null && mio.pct !== undefined && mio.pct >= 80
          ? '<div class="aviso danger">'+ico('alerta')+'<div>Por encima del 80 % de la dosis de '+
            'referencia. El máximo no es una garantía: depende del sitio, la técnica y el paciente.</div></div>' : '')+
        (acum.mezcla ? '<div class="aviso warn">'+ico('alerta')+'<div><b>Ya hay otro anestésico '+
          'local registrado en esta ficha: la toxicidad es aditiva.</b></div></div>' : '');
    }

    /* infusión: concentración y mL/h */
    if(fa.infusion && $('#drInfMg')){
      const r = calcularInfusion(val('drInfMg'), val('drInfML'), peso, val('drInfObj'));
      $('#drInfOut').innerHTML = r
        ? '<div class="aviso ok">'+ico('calculadora')+'<div>'+
          '<b>Concentración: '+fDosis(r.mcgPorML)+' mcg/mL</b> ('+fDosis(r.mgPorML)+' mg/mL).'+
          (r.mLh ? ' Para '+val('drInfObj')+' mcg/kg/min en '+fDosis(peso)+' kg: <b>'+
            fDosis(r.mLh)+' mL/h</b>.' : (peso ? '' : ' Cargá el peso para obtener los mL/h.'))+
          '</div></div>'
        : '<div class="ayuda">Cargá la cantidad total y el volumen final para obtener la concentración.</div>';
    }
  }
  $('#modal').addEventListener('input', debounce(recalcDroga, 180));
  $('#modal').addEventListener('change', recalcDroga);
  if($('#drAdrL')) $('#drAdrL').onclick = () =>
    setTimeout(() => { $('#drAdrL').classList.toggle('sel', chk('drAdr')); recalcDroga(); }, 0);
  recalcDroga();

  $('#drOK').onclick = () => {
    const dosis = val('drDosis');
    if(dosis === '' || Number(dosis) <= 0) return toast('Cargá la dosis administrada.', 'err');
    const reg = {
      id: prev ? prev.id : uid('dro'),
      n: fa.n, g: fa.g,
      dosis: Number(dosis), unidad: val('drUnidad'), via: val('drVia'),
      hora: val('drHora'), nota: val('drNota'),
      porUid: SESION.uid
    };
    if(fa.local){
      reg.pct = Number(val('drPct')); reg.mL = Number(val('drVol')) || 0;
      reg.mg = mgAnestesicoLocal(reg.pct, reg.mL) || Number(dosis);
      reg.adrenalina = chk('drAdr');
    }
    if(fa.infusion){
      reg.infMg = Number(val('drInfMg')) || 0;
      reg.infML = Number(val('drInfML')) || 0;
      reg.infObj = Number(val('drInfObj')) || 0;
      const r = calcularInfusion(reg.infMg, reg.infML, peso, reg.infObj);
      if(r){ reg.infConc = r.mcgPorML; reg.infMLh = r.mLh || 0; }
    }
    fichaActual.acto = leerPasoAnestesia();
    fichaActual.acto.drogas = fichaActual.acto.drogas || [];
    if(editando) fichaActual.acto.drogas[indiceEdicion] = reg;
    else fichaActual.acto.drogas.push(reg);
    fichaActual.acto.drogas.sort((a,b) => (a.hora||'') < (b.hora||'') ? -1 : 1);
    cerrarModal();
    pintarPasoAnestesia(fichaActual);
    toast(editando ? 'Dosis actualizada.' : fa.n+' registrado.', 'ok');
  };
}

/* =========================================================================
   SOLAPA 3 - SIGNOS VITALES
   ========================================================================= */
const COLS_VITALES = [
  { k:'ta',    t:'TA',    um:'mmHg' },
  { k:'fc',    t:'FC',    um:'lpm' },
  { k:'spo2',  t:'SpO₂',  um:'%' },
  { k:'etco2', t:'EtCO₂', um:'mmHg' },
  { k:'temp',  t:'Temp',  um:'°C' },
  { k:'tof',   t:'TOF',   um:'' }
];

function htmlActoVitales(f){
  const a = f.acto || {};
  const ctrls = (a.controles || []).slice().sort((x,y) => (y.hora||'') < (x.hora||'') ? -1 : 1);
  const ult = ctrls[0];
  const alerta = alertasVitales(ctrls);

  return ''+
  (ctrls.length
    ? '<div class="aviso '+(alerta.length?'warn':'ok')+'">'+ico(alerta.length?'alerta':'check')+
      '<div>'+(alerta.length
        ? '<b>Revisar:</b> '+esc(alerta.join(' · '))
        : '<b>Evolución estable durante el procedimiento</b>')+'</div></div>'
    : '')+

  '<button class="btn pri grande" id="svNuevo">'+ico('mas')+' Registrar control</button>'+

  (ult ? '<div class="card ultimo-control"><h3>'+ico('monitor')+'Último control · '+esc(ult.hora||'')+'</h3>'+
    '<div class="vitales-grid">'+ COLS_VITALES.map(c =>
      '<div class="vital"><span class="t">'+c.t+'</span>'+
        '<span class="v">'+esc(valorVital(ult, c.k) || '—')+'</span>'+
        '<span class="u">'+esc(c.um)+'</span></div>').join('') +'</div>'+
  '</div>' : '')+

  '<div class="card"><h3>'+ico('lista')+'Controles registrados'+
    '<span class="tag" style="margin-left:auto">'+ctrls.length+'</span></h3>'+
    (ctrls.length
      ? '<div class="tabla-wrap"><table class="vitales-tabla"><thead><tr><th>Hora</th>'+
        COLS_VITALES.map(c => '<th class="num">'+c.t+(c.um?'<br><span class="mini">'+c.um+'</span>':'')+'</th>').join('')+
        '<th></th></tr></thead><tbody>'+
        ctrls.map(c => '<tr data-ctrl="'+esc(c.id)+'">'+
          '<td><b>'+esc(c.hora||'—')+'</b></td>'+
          COLS_VITALES.map(col => '<td class="num">'+esc(valorVital(c, col.k) || '—')+'</td>').join('')+
          '<td><button type="button" class="ico-btn danger" data-svdel="'+esc(c.id)+'">'+ico('borrar')+'</button></td>'+
        '</tr>').join('')+
        '</tbody></table></div>'+
        '<button class="btn ghost mt14" id="svGrafico" data-lectura>'+ico('stats')+' Ver gráfico</button>'
      : '<p class="mini">Todavía no registraste controles. Tocá «Registrar control» para el primero.</p>')+
  '</div>';
}

function valorVital(c, k){
  if(!c) return '';
  if(k === 'ta') return (c.tas && c.tad) ? c.tas+'/'+c.tad : '';
  return c[k] === undefined || c[k] === '' ? '' : String(c[k]);
}

/* Revisa los controles y devuelve lo que amerita mirar dos veces */
function alertasVitales(ctrls){
  const out = [];
  const hay = (k, test) => ctrls.some(c => c[k] !== '' && c[k] !== undefined && test(Number(c[k])));
  if(ctrls.some(c => c.tas && Number(c.tas) < 90))  out.push('hipotensión (TAS < 90)');
  if(ctrls.some(c => c.tas && Number(c.tas) > 180)) out.push('hipertensión (TAS > 180)');
  if(hay('fc', v => v < 45))    out.push('bradicardia (FC < 45)');
  if(hay('fc', v => v > 120))   out.push('taquicardia (FC > 120)');
  if(hay('spo2', v => v < 92))  out.push('desaturación (SpO₂ < 92 %)');
  if(hay('etco2', v => v < 25 || v > 50)) out.push('EtCO₂ fuera de rango');
  if(hay('temp', v => v < 35))  out.push('hipotermia (< 35 °C)');
  if(hay('temp', v => v > 38))  out.push('hipertermia (> 38 °C)');
  return out;
}

function cablearActoVitales(f){
  $('#svNuevo').onclick = () => abrirControl(null);
  $$('#actoCuerpo [data-ctrl]').forEach(tr => tr.onclick = e => {
    if(e.target.closest('[data-svdel]')) return;
    abrirControl(tr.dataset.ctrl);
  });
  $$('#actoCuerpo [data-svdel]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    fichaActual.acto = leerPasoAnestesia();
    fichaActual.acto.controles = (fichaActual.acto.controles||[])
      .filter(c => c.id !== b.dataset.svdel);
    pintarPasoAnestesia(fichaActual);
  });
  if($('#svGrafico')) $('#svGrafico').onclick = abrirGraficoVitales;
}

function abrirControl(id){
  const f = fichaActual;
  const c = id ? (f.acto.controles || []).find(x => x.id === id) || {} : {};
  const ult = ultimoControl(f.acto.controles);
  abrirModal(id ? 'Editar control' : 'Registrar control',
    '<div class="campo"><label>Hora</label>'+
      '<div class="hora-campo"><input type="time" id="svHora" value="'+esc(c.hora || ahoraHora())+'">'+
      '<button type="button" class="btn ghost chico" id="svAhora">Ahora</button></div></div>'+
    '<div class="grid c3">'+
      '<div class="campo"><label>TA (mmHg)</label>'+
        '<div class="ta-campo">'+
          '<input type="number" id="svTas" placeholder="118" inputmode="numeric" value="'+esc(c.tas||'')+'">'+
          '<span>/</span>'+
          '<input type="number" id="svTad" placeholder="70" inputmode="numeric" value="'+esc(c.tad||'')+'">'+
        '</div></div>'+
      campoNum('svFc','FC (lpm)', c.fc, 'inputmode="numeric"')+
      campoNum('svSpo2','SpO₂ (%)', c.spo2, 'inputmode="numeric"')+
    '</div>'+
    '<div class="grid c3">'+
      campoNum('svEtco2','EtCO₂ (mmHg)', c.etco2, 'inputmode="numeric"')+
      campoNum('svTemp','Temp (°C)', c.temp, 'step="0.1" inputmode="decimal"')+
      campoTxt('svTof','TOF', c.tof)+
    '</div>'+
    (ult && !id ? '<div class="ayuda">Último control a las '+esc(ult.hora||'—')+': '+
      esc([valorVital(ult,'ta')+' mmHg', ult.fc?ult.fc+' lpm':'', ult.spo2?ult.spo2+' %':'']
        .filter(x => x && x !== ' mmHg').join(' · '))+'</div>' : '')+
    campoTxt('svObs','Observaciones', c.obs),
    '<button class="btn ghost" data-cerrar>Cancelar</button>'+
    '<button class="btn pri" id="svOK">'+ico('check')+' Guardar control</button>');

  $('#svAhora').onclick = () => { $('#svHora').value = ahoraHora(); };
  $('#svOK').onclick = () => {
    const reg = {
      id: c.id || uid('ctl'), hora: val('svHora'),
      tas: val('svTas'), tad: val('svTad'), fc: val('svFc'), spo2: val('svSpo2'),
      etco2: val('svEtco2'), temp: val('svTemp'), tof: val('svTof'), obs: val('svObs')
    };
    if(!reg.hora) return toast('Cargá la hora del control.', 'err');
    fichaActual.acto = leerPasoAnestesia();
    fichaActual.acto.controles = fichaActual.acto.controles || [];
    const i = fichaActual.acto.controles.findIndex(x => x.id === reg.id);
    if(i >= 0) fichaActual.acto.controles[i] = reg;
    else fichaActual.acto.controles.push(reg);
    fichaActual.acto.controles.sort((a,b) => (a.hora||'') < (b.hora||'') ? -1 : 1);
    cerrarModal();
    pintarPasoAnestesia(fichaActual);
    toast('Control registrado.', 'ok');
  };
}

/* Grafico de tendencia: TA sistolica/diastolica, FC y SpO2 en SVG a mano,
   sin librerias, igual que el resto de los graficos de la app. */
function abrirGraficoVitales(){
  const ctrls = (fichaActual.acto.controles || []).slice()
    .sort((a,b) => (a.hora||'') < (b.hora||'') ? -1 : 1);
  if(ctrls.length < 2) return toast('Hacen falta al menos dos controles para el gráfico.', 'warn');

  const W = 640, H = 260, ML = 38, MR = 12, MT = 14, MB = 30;
  const n = ctrls.length;
  const x = i => ML + (i * (W - ML - MR)) / Math.max(1, n - 1);
  const serie = (k, min, max, color, dash) => {
    const pts = ctrls.map((c,i) => {
      const v = Number(k === 'tas' ? c.tas : k === 'tad' ? c.tad : c[k]);
      if(!isFinite(v) || !v) return null;
      const y = MT + (H - MT - MB) * (1 - (v - min) / (max - min));
      return [x(i), Math.max(MT, Math.min(H - MB, y))];
    }).filter(Boolean);
    if(pts.length < 2) return '';
    return '<polyline fill="none" stroke="'+color+'" stroke-width="2.2" '+
      (dash ? 'stroke-dasharray="4 3" ' : '')+
      'points="'+pts.map(p => p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')+'"/>'+
      pts.map(p => '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="2.6" fill="'+color+'"/>').join('');
  };

  const ejeY = [0,25,50,75,100].map(pct => {
    const y = MT + (H - MT - MB) * (1 - pct/100);
    return '<line x1="'+ML+'" y1="'+y+'" x2="'+(W-MR)+'" y2="'+y+'" stroke="currentColor" '+
      'stroke-opacity=".12"/><text x="'+(ML-6)+'" y="'+(y+3.5)+'" text-anchor="end" '+
      'font-size="9" fill="currentColor" opacity=".55">'+Math.round(pct*2)+'</text>';
  }).join('');

  abrirModal('Evolución intraoperatoria',
    '<div class="grafico-vitales"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">'+
      ejeY+
      serie('tas', 0, 200, '#dc2626')+
      serie('tad', 0, 200, '#dc2626', true)+
      serie('fc',  0, 200, '#1b4e85')+
      serie('spo2',0, 200, '#14b8a6')+
      ctrls.map((c,i) => (n <= 10 || i % Math.ceil(n/10) === 0)
        ? '<text x="'+x(i).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle" font-size="9" '+
          'fill="currentColor" opacity=".55">'+esc(c.hora||'')+'</text>' : '').join('')+
    '</svg></div>'+
    '<div class="leyenda-vitales">'+
      '<span><i style="background:#dc2626"></i>TA sistólica</span>'+
      '<span><i style="background:#dc2626;opacity:.5"></i>TA diastólica</span>'+
      '<span><i style="background:#1b4e85"></i>FC</span>'+
      '<span><i style="background:#14b8a6"></i>SpO₂</span>'+
    '</div>'+
    '<div class="ayuda">Escala común de 0 a 200 para las cuatro curvas.</div>',
    '<button class="btn ghost" data-cerrar>Cerrar</button>', '760px');
}

function cablearActoBalance(f){
  const recalc = () => {
    const b = {};
    BALANCE_INGRESOS.concat(BALANCE_EGRESOS).forEach(x => b[x.k] = val('bal_'+x.k));
    const r = calcularBalance(b);
    $('#balTotalIn').innerHTML  = '<span>Total ingresos</span><b>'+r.ingresos+' mL</b>';
    $('#balTotalOut').innerHTML = '<span>Total egresos</span><b>'+r.egresos+' mL</b>';
    const signo = r.balance > 0 ? '+' : '';
    $('#balResultado').innerHTML =
      '<span class="lbl">Balance calculado</span>'+
      '<span class="val '+(r.balance >= 0 ? 'ok' : 'warn')+'">'+signo+r.balance+' mL</span>';

    const sangrado = Number(b.sangrado) || 0;
    const peso = pesoDeFicha(f);
    /* volemia estimada: 70 mL/kg en adulto, 80 en pediatria */
    const pedia = esPediatrico(edadDeFicha(f));
    const volemia = peso ? peso * (pedia ? 80 : 70) : 0;
    const pct = volemia ? Math.round(sangrado / volemia * 100) : null;
    $('#balAviso').innerHTML =
      (sangrado && volemia
        ? '<div class="aviso '+(pct >= 30 ? 'danger' : (pct >= 15 ? 'warn' : 'info'))+'">'+
          ico(pct >= 15 ? 'alerta' : 'info')+'<div>'+
          'Pérdida sanguínea de <b>'+sangrado+' mL</b> sobre una volemia estimada de '+
          Math.round(volemia)+' mL ('+(pedia?'80':'70')+' mL/kg): <b>'+pct+' %</b>. '+
          (pct >= 30 ? 'Clase III o mayor: considerar transfusión y protocolo de hemorragia.'
           : pct >= 15 ? 'Clase II: reponer con cristaloides y controlar hematocrito.'
           : 'Pérdida menor.')+'</div></div>'
        : '')+
      (r.balance < -1000 ? '<div class="aviso warn">'+ico('alerta')+
        '<div>Balance negativo mayor a 1000 mL. Revisar la reposición antes del pase a recuperación.</div></div>' : '');
  };
  $('#actoCuerpo').addEventListener('input', debounce(recalc, 200));
  $('#actoCuerpo').addEventListener('change', recalc);
  recalc();
}

/* =========================================================================
   LECTURA DEL PASO COMPLETO
   Las listas (drogas, controles, eventos) viven en fichaActual.acto y se
   editan por sus propios modales; lo que se lee de la pantalla es solo lo
   que esta visible en la solapa activa.
   ========================================================================= */
function leerPasoAnestesia(){
  const a = Object.assign({}, fichaActual.acto || {});
  a.__v2 = true;
  a.drogas    = a.drogas    || [];
  a.controles = a.controles || [];
  a.eventos2  = a.eventos2  || [];
  a.balance   = a.balance   || {};

  if(solapaActo === 'resumen' && $('#acIniCx')){
    a.inicioCirugia = val('acIniCx');       a.finCirugia = val('acFinCx');
    a.ingreso = val('acIngreso');           a.inicioAnestesia = val('acIniAnest');
    a.finAnestesia = val('acFinAnest');     a.salida = val('acSalida');
    a.tecnicas = $$('#acTecnicas .tec.on').map(b => b.dataset.tec);
    a.tecnicaDetalle = val('acTecDet');
    const d = $('#acVaDificil button.on');
    a.vaDificil = d ? d.dataset.v : 'no';
    a.dispositivo = val('acDisp'); a.tamano = val('acTam');
    a.cormack = val('acCormack');  a.intentos = val('acIntentos');
    a.monitor = leerChks('acMonitor'); a.monitorExtra = leerChks('acMonitorExtra');
    a.accesos = val('acAccesos');
    a.oms = leerChks('acOMS');
    a.equipo = {
      cirujano: val('acCirujano'), cirujanoMP: val('acCirujanoMP'),
      ayudante: val('acAyudante'), instrumentador: val('acInstrumentador'),
      anestesista2: val('acAnestesista2'), circulante: val('acCircTecnico')
    };
    a.observaciones = val('acObs');
  }
  if(solapaActo === 'drogas' && $('#acDrogasNota')){
    a.drogasNota = val('acDrogasNota');
  }
  if(solapaActo === 'balance' && $('#bal_cristaloides')){
    const b = {};
    BALANCE_INGRESOS.concat(BALANCE_EGRESOS).forEach(x => b[x.k] = val('bal_'+x.k));
    a.balance = b;
    a.hemoderivados = val('acHemo'); a.vasoactivos = val('acVaso');
  }
  if(solapaActo === 'eventos' && $('#evSin')){
    a.sinEventos = chk('evSin') && !a.eventos2.length;
  }
  /* resumen numerico que consumen las estadisticas y el documento */
  const bal = calcularBalance(a.balance);
  a.balanceTotal = bal.balance;
  a.sangrado = Number(a.balance.sangrado) || 0;
  a.cristaloides = Number(a.balance.cristaloides) || 0;
  a.diuresis = Number(a.balance.diuresis) || 0;
  a.eventos = a.eventos2.length ? a.eventos2.map(e => e.tipo) : (a.sinEventos ? ['Sin eventos'] : []);
  return a;
}

/* =========================================================================
   ESTADISTICAS - por dia, semana y mes, con cruces por anestesiologo,
   institucion, patologia, cirugia, obra social, caracter y riesgo ASA.
   ========================================================================= */

let stPeriodo = 'mes', stDesde = '', stHasta = '', stCorte = 'institucion';

function rangoPeriodo(){
  const hoy = new Date();
  const iso = d => d.toISOString().slice(0,10);
  if(stPeriodo === 'dia')    return [iso(hoy), iso(hoy)];
  if(stPeriodo === 'semana'){
    const d = new Date(hoy); const dow = (d.getDay() + 6) % 7;
    d.setDate(d.getDate() - dow);
    const f = new Date(d); f.setDate(f.getDate() + 6);
    return [iso(d), iso(f)];
  }
  if(stPeriodo === 'mes'){
    const d = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
    const f = new Date(hoy.getFullYear(), hoy.getMonth() + 1, 0);
    return [iso(d), iso(f)];
  }
  if(stPeriodo === 'anio') return [hoy.getFullYear()+'-01-01', hoy.getFullYear()+'-12-31'];
  return [stDesde || '2000-01-01', stHasta || '2100-12-31'];
}
function fichasEnRango(){
  const [d,h] = rangoPeriodo();
  return misFichas().filter(f => f.fecha && f.fecha >= d && f.fecha <= h);
}
function agrupar(fichas, fn){
  const m = {};
  fichas.forEach(f => {
    const ks = fn(f);
    (Array.isArray(ks) ? ks : [ks]).forEach(k => {
      if(!k) return; m[k] = (m[k] || 0) + 1;
    });
  });
  return Object.keys(m).map(k => ({ t:k, v:m[k] })).sort((a,b) => b.v - a.v);
}

function vistaStats(){
  const cont = $('#vStats');
  const [d,h] = rangoPeriodo();
  const l = fichasEnRango();
  const [rd,rh] = rangoPeriodo();

  /* Una ficha no es una prestación: puede contener la valoración
     prequirúrgica, el acto anestésico o los dos, y cada uno es un acto médico
     propio, con su titular y su honorario. Se cuentan por separado.

     Y cada socio ve SOLO SU trabajo. misFichas() trae también las fichas en
     las que intervino un colega —si él hizo la valoración y yo el acto, la
     ficha nos aparece a los dos—, así que contar fichas enteras le mostraría
     a cada uno la actividad ajena. Se cuenta acto por acto: la valoración es
     de quien la firmó y el acto de quien operó. La mirada de conjunto de la
     asociación es del coordinador, con su credencial. */
  const valoraciones = misValoraciones(l);
  const actos        = misActos(l);

  /* Fichas en las que efectivamente hice algo: la unión de las dos listas,
     sin repetir la ficha en la que hice los dos actos. */
  const idsMios = {};
  valoraciones.concat(actos).forEach(f => { idsMios[f.id] = f; });
  const mias = Object.keys(idsMios).map(k => idsMios[k]);

  const prest = misPrestaciones().filter(x => x.fecha >= rd && x.fecha <= rh);
  const honConsulta = prest.filter(x => x.tipo === 'consulta').reduce((a,x) => a + x.monto, 0);
  const honActo     = prest.filter(x => x.tipo === 'acto').reduce((a,x) => a + x.monto, 0);
  const totalHon = honConsulta + honActo;
  const nActos = valoraciones.length + actos.length;

  /* Cada indicador se calcula sobre el acto que lo genera: el ASA sale de la
     valoración y los eventos adversos del intraoperatorio. Si el colega tuvo
     un evento en un acto suyo, no es mi estadística. */
  const urg = mias.filter(f => f.caracter !== 'programada').length;
  const eventos = actos.filter(f => ((f.acto||{}).eventos||[]).some(e => e !== 'Sin eventos')).length;
  const asa34 = valoraciones.filter(f => ['III','IV','V'].indexOf(((f.v||{}).scores||{}).asa) >= 0).length;
  const pacs = new Set(mias.map(f => f.pacienteId)).size;

  const cortes = {
    /* Una ficha puede caer en las dos filas: la valoración y el acto son dos
       actos médicos distintos, no dos etapas de uno solo. */
    actoMedico:    ['Acto médico',   f => {
      const r = [];
      if(hayValoracion(f)) r.push('Valoración prequirúrgica');
      if(hayActo(f))       r.push('Acto anestésico');
      return r.length ? r : ['Sin cargar'];
    }],
    institucion:   ['Institución',   f => nombreInstitucion(f.institucion).split('"')[0].trim()],
    obraSocial:    ['Financiador',   f => f.obraSocial || 'Sin cobertura'],
    cirugia:       ['Cirugía',       f => f.cirugia || 'Sin especificar'],
    especialidad:  ['Especialidad',  f => f.especialidad || 'Sin especificar'],
    patologia:     ['Antecedente patológico', f => ((f.v||{}).antecedentes2 || []).map(c => c.n || c.d)],
    /* Los dos cortes por profesional nombran a colegas: son sólo del
       coordinador. Se quitan más abajo para el resto. */
    anestesiologo: ['Anestesiólogo (valoración)', f => nombreUsuario(f.ownerUid)],
    actor:         ['Anestesiólogo (acto)',        f => nombreActor(f)],
    caracter:      ['Carácter',      f => (f.caracter||'programada').charAt(0).toUpperCase() + (f.caracter||'programada').slice(1)],
    asa:           ['Riesgo ASA',    f => 'ASA ' + (((f.v||{}).scores||{}).asa || 'sin cargar')],
    tecnica:       ['Técnica',       f => ((f.acto||{}).tecnica || (f.plan||{}).tecnica || [])],
    eventos:       ['Eventos adversos', f => ((f.acto||{}).eventos || []).filter(e => e !== 'Sin eventos')]
  };
  if(!esCoordinador()){ delete cortes.anestesiologo; delete cortes.actor; }
  if(!cortes[stCorte]) stCorte = 'actoMedico';
  const datos = agrupar(mias, cortes[stCorte][1]);

  /* serie temporal por dia dentro del rango */
  const serie = {};
  mias.forEach(f => { serie[f.fecha] = (serie[f.fecha] || 0) + 1; });
  const dias = Object.keys(serie).sort().map(k => ({ t: k.slice(8)+'/'+k.slice(5,7), v: serie[k] }));

  cont.innerHTML = ''+
  '<div class="vista-head"><div><h1>Estadísticas</h1>'+
    '<p>'+fFecha(d)+' al '+fFecha(h)+(esCoordinador()?' · toda la asociación':' · sólo tu actividad')+
      ' · '+mias.length+' ficha'+(mias.length===1?'':'s')+'</p></div>'+
    '<div class="acciones"><button class="btn ghost chico" id="stExportar">'+ico('excel')+' Exportar</button></div></div>'+

  '<div class="scroll-x mb8">'+
    [['dia','Hoy'],['semana','Esta semana'],['mes','Este mes'],['anio','Este año'],['rango','Rango…']]
      .map(p => '<span class="tag'+(stPeriodo===p[0]?' on':'')+'" data-per="'+p[0]+'">'+p[1]+'</span>').join('')+
  '</div>'+
  (stPeriodo === 'rango' ? '<div class="filtros">'+
    '<div class="campo"><label>Desde</label><input type="date" id="stDesde" value="'+esc(stDesde)+'"></div>'+
    '<div class="campo"><label>Hasta</label><input type="date" id="stHasta" value="'+esc(stHasta)+'"></div>'+
  '</div>' : '')+

  /* ---- Los dos actos médicos, contados por separado ---- */
  '<div class="grid c3 mb8">'+
    kpi('Valoraciones prequirúrgicas', valoraciones.length, 'aqua', ico('valoracion'),
        esCoordinador() ? 'de toda la asociación' : 'firmadas por vos')+
    kpi('Actos anestésicos', actos.length, 'azul', ico('jeringa'),
        esCoordinador() ? 'de toda la asociación' : 'realizados por vos')+
    kpi('Pacientes', pacs, '', ico('pacientes'), 'distintos en el período')+
  '</div>'+

  '<div class="grid c3 mb8">'+
    kpi('Urgencias', urg, urg? 'warn':'', ico('alerta'),
        mias.length? Math.round(urg*100/mias.length)+' % de tus fichas':'')+
    kpi('ASA III-V', asa34, asa34?'danger':'', ico('escudo'),
        valoraciones.length? 'sobre '+valoraciones.length+' valoraciones':'Alto riesgo')+

/* Actividad por anestesiólogo, discriminando los dos actos médicos.
   La valoración se le imputa a quien la hizo (ownerUid) y el acto a quien
   operó (actorFicha): cuando intervinieron dos profesionales, cada uno
   aparece con lo suyo y ninguno se lleva el trabajo del otro. */
function tablaAnestesiologos(l){
  const m = {};
  const fila = k => {
    if(!m[k]) m[k] = { val:0, act:0, urg:0, ev:0, honVal:0, honAct:0 };
    return m[k];
  };
  l.forEach(f => {
    if(hayValoracion(f) && f.ownerUid){
      const r = fila(f.ownerUid);
      r.val++; r.honVal += Number((f.honConsulta||{}).total || 0);
    }
    /* Un acto puede haberlo hecho un anestesiólogo externo, sin usuario en la
       app. Se agrupa aparte en vez de descartarlo: si no, el total de la
       tabla no coincidiría con el devengado del período. */
    const act = actorFicha(f) || (hayActo(f) ? '__externo' : '');
    if(hayActo(f) && act){
      const r = fila(act);
      r.act++; r.honAct += Number((f.hon||{}).total || 0);
      if(f.caracter !== 'programada') r.urg++;
      if(((f.acto||{}).eventos||[]).some(e => e !== 'Sin eventos')) r.ev++;
    }
  });
  const filas = Object.keys(m).map(k => Object.assign({ uid:k,
      nombre: k === '__externo' ? 'Anestesiólogo externo / sin asignar' : nombreUsuario(k) }, m[k]))
    .sort((a,b) => (b.val + b.act) - (a.val + a.act));
  if(!filas.length) return '<p class="mini">Sin actividad registrada.</p>';

  const tot = filas.reduce((a,f) => ({
    val:a.val+f.val, act:a.act+f.act, urg:a.urg+f.urg, ev:a.ev+f.ev,
    honVal:a.honVal+f.honVal, honAct:a.honAct+f.honAct
  }), { val:0, act:0, urg:0, ev:0, honVal:0, honAct:0 });

  return '<div class="tabla-wrap"><table><thead><tr><th>Anestesiólogo</th>'+
    '<th class="num">Valoraciones</th><th class="num">Actos</th>'+
    '<th class="num">Urgencias</th><th class="num">Eventos</th>'+
    '<th class="num">Hon. valoración</th><th class="num">Hon. acto</th>'+
    '<th class="num">Total</th></tr></thead><tbody>'+
    filas.map(f => '<tr><td>'+esc(f.nombre)+'</td>'+
      '<td class="num">'+f.val+'</td><td class="num">'+f.act+'</td>'+
      '<td class="num">'+f.urg+'</td><td class="num">'+f.ev+'</td>'+
      '<td class="num">'+fMoneda(f.honVal)+'</td><td class="num">'+fMoneda(f.honAct)+'</td>'+
      '<td class="num">'+fMoneda(f.honVal + f.honAct)+'</td></tr>').join('')+
    '<tr style="font-weight:800;background:var(--panel-2)"><td>TOTAL</td>'+
      '<td class="num">'+tot.val+'</td><td class="num">'+tot.act+'</td>'+
      '<td class="num">'+tot.urg+'</td><td class="num">'+tot.ev+'</td>'+
      '<td class="num">'+fMoneda(tot.honVal)+'</td><td class="num">'+fMoneda(tot.honAct)+'</td>'+
      '<td class="num">'+fMoneda(tot.honVal + tot.honAct)+'</td></tr>'+
    '</tbody></table></div>'+
    '<div class="ayuda">La valoración prequirúrgica se imputa a quien la firmó y el acto '+
      'anestésico a quien lo realizó. Una misma ficha puede sumar en dos profesionales.</div>';
}

let facMes = '', facInst = '', facOS = '', facModalidad = '', facEstado = '', facUid = '';

function vistaFacturacion(){
  if(!facMes) facMes = mesDe(hoyISO());
  const cont = $('#vFacturacion');
  let l = misPrestaciones().filter(x => mesDe(x.fecha) === facMes);
  if(facInst)      l = l.filter(x => x.ficha.institucion === facInst);
  if(facOS)        l = l.filter(x => x.ficha.obraSocial === facOS);
  /* El filtro de concepto discrimina los DOS actos médicos y, dentro de cada
     uno, su modalidad de convenio. El valor viaja como «grupo:modalidad»;
     sin modalidad, filtra el grupo entero. */
  if(facModalidad){
    const par = facModalidad.split(':'), gr = par[0], mid = par[1] || '';
    l = l.filter(x => {
      if(gr === 'consulta')
        return x.tipo === 'consulta' && (!mid || (x.ficha.honConsulta||{}).modalidad === mid);
      if(gr === 'acto')
        return x.tipo === 'acto' && (!mid || (x.ficha.hon||{}).modalidad === mid);
      return true;
    });
  }
  if(facEstado)    l = l.filter(x => x.estado === facEstado);
  if(facUid)       l = l.filter(x => x.uid === facUid);
  l.sort((a,b) => (a.fecha||'') < (b.fecha||'') ? -1 : 1);

  const total     = l.reduce((a,x) => a + x.monto, 0);
  const cobrado   = l.reduce((a,x) => a + x.cobrado, 0);
  const pendiente = l.filter(x => ['Pendiente','Presentado','Facturado'].indexOf(x.estado) >= 0)
                     .reduce((a,x) => a + x.monto, 0);
  const consultas = l.filter(x => x.tipo === 'consulta').length;
  const actos     = l.filter(x => x.tipo === 'acto').length;
  const montoConsultas = l.filter(x => x.tipo === 'consulta').reduce((a,x) => a + x.monto, 0);
  const montoActos     = l.filter(x => x.tipo === 'acto').reduce((a,x) => a + x.monto, 0);

  const porOS   = resumenPor(l, x => x.ficha.obraSocial || 'Sin cobertura');
  const porInst = resumenPor(l, x => nombreInstitucion(x.ficha.institucion).split('"')[0].trim());
  const porConcepto = resumenPor(l, x => x.tipo === 'consulta'
    ? 'Valoración prequirúrgica' : 'Acto anestésico');
  const porMod  = resumenPor(l, x => x.tipo === 'consulta'
    ? (MODALIDADES_CONSULTA.find(m => m.id === (x.ficha.honConsulta||{}).modalidad) || {n:'Consulta'}).n
    : (MODALIDADES_HONORARIOS.find(m => m.id === (x.ficha.hon||{}).modalidad) || {n:'Sin definir'}).n);

  cont.innerHTML = ''+
  '<div class="vista-head"><div><h1>Facturación</h1>'+

      (consultas===1?'':'s')+' y '+actos+' acto'+(actos===1?'':'s')+'</p></div>'+
    '<div class="acciones">'+
      '<button class="btn ghost chico" id="facExcel">'+ico('excel')+' Excel</button>'+
      '<button class="btn ghost chico" id="facPdf">'+ico('imprimir')+' PDF</button>'+
    '</div></div>'+

  '<div class="filtros">'+
    campoMesAnio('facMes','Mes', facMes)+
    '<div class="campo"><label>Institución</label><select id="facInst"><option value="">Todas</option>'+
      instituciones().map(i => '<option value="'+esc(i.id)+'"'+(facInst===i.id?' selected':'')+'>'+
        esc(i.nombre.split('"')[0].trim())+'</option>').join('')+'</select></div>'+
    '<div class="campo"><label>Financiador</label><select id="facOS"><option value="">Todos</option>'+
      obrasSociales().map(o => '<option'+(facOS===o?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select></div>'+
    '<div class="campo"><label>Concepto</label><select id="facMod">'+
      '<option value="">Todos los conceptos</option>'+
      '<optgroup label="Valoración prequirúrgica">'+
        '<option value="consulta"'+(facModalidad==='consulta'?' selected':'')+'>'+
          'Todas las valoraciones prequirúrgicas</option>'+
        MODALIDADES_CONSULTA.map(m => '<option value="consulta:'+m.id+'"'+
          (facModalidad==='consulta:'+m.id?' selected':'')+'>Valoración: '+esc(m.n)+'</option>').join('')+
      '</optgroup>'+
      '<optgroup label="Acto anestésico">'+
        '<option value="acto"'+(facModalidad==='acto'?' selected':'')+'>'+
          'Todos los actos anestésicos</option>'+
        MODALIDADES_HONORARIOS.map(m => '<option value="acto:'+m.id+'"'+
          (facModalidad==='acto:'+m.id?' selected':'')+'>Acto: '+esc(m.n)+'</option>').join('')+
      '</optgroup>'+
    '</select></div>'+
    '<div class="campo"><label>Estado</label><select id="facEstado"><option value="">Todos</option>'+
      ESTADOS_FACT.map(e => '<option'+(facEstado===e?' selected':'')+'>'+esc(e)+'</option>').join('')+'</select></div>'+
    (esCoordinador() ? '<div class="campo"><label>Anestesiólogo</label><select id="facUid"><option value="">Todos</option>'+
      lista('usuarios').filter(u => u.rol === 'socio').map(u => '<option value="'+esc(u.uid)+'"'+
        (facUid===u.uid?' selected':'')+'>'+esc(u.apellido+', '+u.nombre)+'</option>').join('')+
      '</select></div>' : '')+
  '</div>'+

  '<div class="grid c3 mb8">'+
    kpi('Devengado', fMoneda(total), 'azul', ico('dinero'), l.length+' prestaciones')+
    kpi('Pendiente de cobro', fMoneda(pendiente), pendiente?'warn':'ok', ico('reloj'), '')+
    kpi('Cobrado', fMoneda(cobrado), 'ok', ico('check'), total? Math.round(cobrado*100/total)+' % del devengado':'')+
  '</div>'+

  /* Los dos conceptos, cada uno con su importe: son actos médicos distintos
     y se facturan por separado, aunque salgan de la misma ficha. */
  '<div class="grid c2 mb8">'+
    kpi('Valoraciones prequirúrgicas', fMoneda(montoConsultas), 'aqua', ico('valoracion'),
        consultas+' consulta'+(consultas===1?'':'s')+
        (consultas ? ' · '+fMoneda(montoConsultas/consultas)+' promedio' : ''))+
    kpi('Actos anestésicos', fMoneda(montoActos), 'azul', ico('jeringa'),
        actos+' acto'+(actos===1?'':'s')+
        (actos ? ' · '+fMoneda(montoActos/actos)+' promedio' : ''))+
  '</div>'+

  '<div class="grid c2">'+
    tarjetaResumen('Por financiador', porOS)+
    tarjetaResumen('Por institución', porInst)+
  '</div>'+
  tarjetaResumen('Por concepto', porConcepto)+
  tarjetaResumen('Por modalidad de convenio', porMod)+

  '<div class="card"><h3>'+ico('lista')+'Detalle de prestaciones</h3>'+
    (l.length ? '<div class="tabla-wrap"><table><thead><tr>'+
      '<th>Fecha</th><th>Paciente</th><th>Concepto</th><th>Cirugía</th><th>Institución</th><th>Financiador</th>'+
      (esCoordinador()?'<th>Profesional</th>':'')+
      '<th class="num">Importe</th><th>Estado</th></tr></thead><tbody>'+
      l.map(x => {
        const f = x.ficha, p = DB.pacientes[f.pacienteId] || {};
        return '<tr data-f="'+f.id+'" style="cursor:pointer">'+
          '<td>'+fFecha(f.fecha)+'</td>'+
          '<td>'+esc((p.apellido||'—')+', '+(p.nombre||''))+'</td>'+
          '<td><span class="tag concepto '+(x.tipo==='consulta'?'aqua':'info')+'">'+
            (x.tipo==='consulta'?'Valoración prequirúrgica':'Acto anestésico')+'</span></td>'+
          '<td>'+esc((f.cirugia||'—').slice(0,38))+'</td>'+
          '<td>'+esc(nombreInstitucion(f.institucion).split('"')[0].trim())+'</td>'+
          '<td>'+esc(f.obraSocial||'—')+'</td>'+
          (esCoordinador()?'<td>'+esc(nombreUsuario(x.uid))+'</td>':'')+
          '<td class="num">'+fMoneda(x.monto)+'</td>'+
          '<td>'+etiquetaEstadoFact(x.estado)+'</td></tr>';
      }).join('')+
      '<tr style="font-weight:800;background:var(--panel-2)"><td colspan="'+(esCoordinador()?7:6)+'">TOTAL</td>'+
      '<td class="num">'+fMoneda(total)+'</td><td></td></tr>'+
      '</tbody></table></div>'
    : '<div class="vacio">'+ico('dinero')+'<b>Sin prestaciones en el mes</b>'+
      '<span>Cambiá los filtros o cargá fichas con honorarios.</span></div>')+
  '</div>'+

  '<div class="aviso info">'+ico('info')+'<div>Cada ficha puede generar <b>dos prestaciones con distinto '+
    'titular</b>: la consulta prequirúrgica, de quien hizo la valoración, y el acto anestésico, de quien operó. '+
    'Acá ves sólo las que te corresponden a vos. El resumen se emite con tu CUIT y condición frente al IVA '+
    'cargados en <b>Mi perfil</b>.</div></div>';

  cablearMesAnio('facMes', v => { facMes = v; vistaFacturacion(); });
  $('#facInst').onchange = e => { facInst = e.target.value; vistaFacturacion(); };
  $('#facOS').onchange = e => { facOS = e.target.value; vistaFacturacion(); };
  $('#facMod').onchange = e => { facModalidad = e.target.value; vistaFacturacion(); };
  $('#facEstado').onchange = e => { facEstado = e.target.value; vistaFacturacion(); };
  if($('#facUid')) $('#facUid').onchange = e => { facUid = e.target.value; vistaFacturacion(); };
  $('#facExcel').onclick = () => exportarFacturacionExcel(l, facMes);
  $('#facPdf').onclick  = () => imprimirFacturacion(l, facMes, { total, cobrado, pendiente }, porOS, porInst);
  $$('#vFacturacion tr[data-f]').forEach(tr => tr.onclick = () => abrirFicha(tr.dataset.f));
}

function resumenPor(l, fn){
  const m = {};
  l.forEach(x => {
    const k = fn(x) || '—';
    if(!m[k]) m[k] = { n:0, total:0, cobrado:0 };
    m[k].n++; m[k].total += x.monto; m[k].cobrado += x.cobrado;
  });
  return Object.keys(m).map(k => Object.assign({ t:k }, m[k])).sort((a,b) => b.total - a.total);
}
function tarjetaResumen(titulo, datos){
  if(!datos.length) return '';
  return '<div class="card"><h3>'+ico('filtro')+esc(titulo)+'</h3>'+
    '<div class="tabla-wrap"><table><thead><tr><th>'+esc(titulo.replace('Por ',''))+
    '</th><th class="num">N.º</th><th class="num">Devengado</th><th class="num">Cobrado</th></tr></thead><tbody>'+
    datos.map(d => '<tr><td>'+esc(d.t)+'</td><td class="num">'+d.n+'</td>'+
      '<td class="num">'+fMoneda(d.total)+'</td><td class="num">'+fMoneda(d.cobrado)+'</td></tr>').join('')+
    '</tbody></table></div></div>';
}
function etiquetaEstadoFact(e){
  const c = { 'Pendiente':'warn', 'Presentado':'info', 'Facturado':'info',
              'Cobrado':'ok', 'Débito / rechazado':'danger' };
  return '<span class="tag '+(c[e]||'')+'">'+esc(e||'Pendiente')+'</span>';
}

function revisarSolicitud(u){
  const s = DB.usuarios[u]; if(!s) return;
  const insts = (s.instituciones||[]).map(nombreInstitucion).join(' · ') || '—';
  abrirModal('Revisión de solicitud',
    '<div class="card plano" style="border:1px solid var(--borde)">'+
      fila('Apellido y nombre', s.apellido+', '+s.nombre)+

function fichaSocio(u){
  const s = DB.usuarios[u]; if(!s) return;
  const fichas = lista('fichas').filter(f => f.ownerUid === u);
  const hon = fichas.reduce((a,f) => a + Number((f.hon||{}).total||0), 0);
  abrirModal(s.apellido+', '+s.nombre,
    '<div class="grid c3 mb8">'+
      kpi('Fichas', fichas.length, 'azul')+
      kpi('Pacientes', new Set(fichas.map(f=>f.pacienteId)).size, 'aqua')+
      kpi('Honorarios', fMoneda(hon), 'ok')+
    '</div>'+
    '<div class="card plano" style="border:1px solid var(--borde)">'+
      fila('Estado', s.estado)+
      fila('Correo', s.email)+
      fila('DNI', s.dni||'—')+
      fila('Matrícula nacional', s.matriculaNacional||'—')+
      fila('Matrícula provincial', s.matriculaProvincial||'—')+
      fila('Teléfono', s.telefono||'—')+
      fila('CUIT / IVA', (s.cuit||'—')+' · '+(s.condicionIva||'—'))+
      fila('Instituciones', (s.instituciones||[]).map(nombreInstitucion).join(' · ')||'—')+
      fila('Alta', fFechaLarga(s.creado))+
      (s.aprobadoEn ? fila('Resuelta el', fFecha(s.aprobadoEn)) : '')+
    '</div>',
    '<button class="btn ghost" id="scComprobante">'+ico('adjunto')+' Comprobante</button>'+
    (s.estado === 'suspendido'
      ? '<button class="btn ok" id="scReactivar">'+ico('check')+' Reactivar</button>'
      : '<button class="btn warn" id="scSuspender">'+ico('candado')+' Suspender</button>')+
    '<button class="btn danger" id="scClave">'+ico('candado')+' Resetear clave</button>');

  $('#scComprobante').onclick = () => verComprobante(s);
  if($('#scSuspender')) $('#scSuspender').onclick = () => {
    s.estado = 'suspendido'; escribir('usuarios', s.uid, s);
    auditar('socio-suspender', s.apellido); cerrarModal(); vistaCoordinador(); toast('Socio suspendido.', 'warn');
  };
  if($('#scReactivar')) $('#scReactivar').onclick = () => {
    s.estado = 'aprobado'; escribir('usuarios', s.uid, s);
    auditar('socio-reactivar', s.apellido); cerrarModal(); vistaCoordinador(); toast('Socio reactivado.', 'ok');
  };
  $('#scClave').onclick = () => {
    const nueva = 'afaar' + Math.floor(1000 + Math.random()*9000);
    confirmar('Resetear contraseña',
      'Se asigna la contraseña provisoria <b>'+nueva+'</b> a '+esc(s.apellido)+'. '+
      'Anotala y comunicásela: no se puede recuperar después.',
      () => {
        s.salt = Math.random().toString(36).slice(2,12);
        s.passHash = hashClave(nueva, s.salt);
        escribir('usuarios', s.uid, s);
        auditar('socio-reset-clave', s.apellido);
        cerrarModal();
        abrirModal('Contraseña provisoria',
          '<div class="aviso ok">'+ico('candado')+'<div>Nueva contraseña de '+esc(s.apellido+', '+s.nombre)+
          ':<br><b style="font-size:22px;letter-spacing:.1em">'+nueva+'</b></div></div>',
          '<button class="btn pri" data-cerrar>Listo</button>');
      }, 'Resetear', true);
  };
}

/* =========================================================================
   SINCRONIZACION
   No es una solapa: se abre tocando el indicador del encabezado.
   El estado lo ve cualquiera; TODO lo que modifique la base de datos queda
   detras de la credencial de coordinacion, y cada cambio se asienta en
   Firebase (auditoria + config/nube) para que quede constancia de quien lo
   hizo, cuando y desde que dispositivo.
   ========================================================================= */
let nubeDesbloqueada = false;      /* se reinicia al recargar la aplicacion */

function abrirSincronizacion(){
  const cfg = configNube();
  const conectada = !!(cfg && cfg.databaseURL);
  const ult = DB.config && DB.config.nube;

  /* ---------- Estado, visible para todos ---------- */
  const estado = conectada
    ? '<div class="aviso '+(nubeOK?'ok':'warn')+'">'+ico(nubeOK?'check':'reloj')+
        '<div><b>'+(nubeOK ? 'Todo sincronizado.' : 'Sin conexión en este momento.')+'</b><br>'+
        (nubeOK
          ? 'Cada cambio se guarda al instante y aparece en el resto de los dispositivos de la asociación.'
          : 'Podés seguir trabajando: los cambios se guardan en este dispositivo y se envían solos '+
            'cuando vuelva internet.')+
        '</div></div>'+
      (usandoConfigEmbebida()
        ? '<div class="aviso info">'+ico('candado')+'<div><b>Configuración incluida en la aplicación.</b><br>'+
          'Nadie tiene que cargar nada: cada dispositivo se conecta solo al abrirla. '+
          'Para cambiar de proyecto, pegá otra configuración acá abajo; para dejar este equipo '+
          'trabajando en local, usá «Desconectar».</div></div>'
        : '')+
      '<div class="card plano" style="border:1px solid var(--borde)">'+
        fila('Base de datos', cfg.projectId || '—')+
        fila('Origen', usandoConfigEmbebida() ? 'incluida en la app' : 'cargada en este dispositivo')+
        fila('Socios', String(lista('usuarios').filter(u => u.rol === 'socio').length))+
        fila('Pacientes', String(lista('pacientes').length))+
        fila('Fichas', String(lista('fichas').length))+
        (ult ? fila('Última modificación',
          fFecha(ult.cuando) + ' ' + String(ult.cuando).slice(11,16) + ' h — ' + (ult.quien || '—')) : '')+
      '</div>'
    : '<div class="aviso warn">'+ico('alerta')+
        '<div><b>Los datos se guardan sólo en este dispositivo.</b><br>'+
        'Lo que carga cada socio no se ve en los demás equipos. La base compartida se '+
        'configura una sola vez.</div></div>';

  /* ---------- Zona protegida ---------- */
  const candado =
    '<hr class="sep">'+
    '<div class="aviso info" style="margin-bottom:11px">'+ico('candado')+
      '<div><b>Configuración protegida.</b><br>'+
      'Cambiar la base de datos, descargar la copia de seguridad o restaurarla '+
      'requiere la credencial de coordinación de la AFAAR.</div></div>'+
    '<div class="campo"><label>Credencial de coordinación</label>'+
      '<input type="password" id="snClave" inputmode="numeric" autocomplete="off" placeholder="••••"></div>'+
    '<button class="btn ghost full" id="snDesbloquear">'+ico('candado')+' Desbloquear</button>';

  const avanzado =
    '<hr class="sep">'+
    '<div class="aviso ok" style="margin-bottom:11px">'+ico('check')+
      '<div><b>Configuración desbloqueada.</b> Todo cambio queda registrado en la base '+
      'con tu nombre, la fecha y el dispositivo.</div></div>'+
    '<div class="campo"><label>Configuración de Firebase</label>'+
      '<textarea id="fbCfg" style="min-height:'+(conectada?'120':'150')+'px;font-family:var(--mono);font-size:11.5px" '+
      'placeholder=\'const firebaseConfig = {\n  apiKey: "…",\n  databaseURL: "https://afar-anestesia-default-rtdb.firebaseio.com",\n  projectId: "afar-anestesia",\n  …\n};\'>'+
      (conectada ? esc(JSON.stringify(cfg, null, 2)) : '')+'</textarea>'+
      (conectada ? '<div class="ayuda">Reemplazá el contenido sólo si vas a mudar la asociación a otro proyecto de Firebase.</div>'
                 : '<div class="ayuda">Pegá el bloque que muestra la consola de Firebase. El paso a paso está en PUBLICAR.md.</div>')+
    '</div>'+
    '<div class="btn-row">'+
      '<button class="btn pri chico" id="fbConectar">'+ico('nube')+
        (conectada ? ' Guardar cambios' : ' Conectar')+'</button>'+
      (conectada ? '<button class="btn danger chico" id="fbDesconectar">Desconectar</button>' : '')+
    '</div>'+
    '<hr class="sep">'+
    '<p class="mini mb8">Copia de seguridad con todos los datos de la asociación. '+
      (conectada ? 'Firebase ya los conserva; esto es un resguardo adicional.'
                 : 'Guardala en un lugar seguro: hoy los datos viven sólo en este equipo.')+'</p>'+
    '<div class="btn-row">'+
      '<button class="btn ghost chico" id="snRespaldo">'+ico('descargar')+' Descargar copia</button>'+
      '<button class="btn ghost chico" id="snRestaurar">'+ico('refrescar')+' Restaurar copia</button>'+
      '<button class="btn ghost chico" id="snBloquear">'+ico('candado')+' Volver a bloquear</button>'+
    '</div>'+
    '<input type="file" id="bkArchivo" accept="application/json" class="oculto">';

  abrirModal('Sincronización', estado + (nubeDesbloqueada ? avanzado : candado),
    '<button class="btn pri" data-cerrar>Cerrar</button>');

  /* ---------------- desbloqueo ---------------- */
  if($('#snDesbloquear')){
    const intentar = () => {
      const c = $('#snClave').value.trim();
      if(c !== CLAVE_COORDINADOR){
        auditar('base-de-datos-intento-fallido', 'Credencial incorrecta al intentar abrir la configuración');
        $('#snClave').value = '';
        return toast('Credencial de coordinación incorrecta.', 'err');
      }
      nubeDesbloqueada = true;
      auditar('base-de-datos-desbloqueo', 'Se abrió la configuración de la base de datos');
      cerrarModal();
      setTimeout(abrirSincronizacion, 150);
    };
    $('#snDesbloquear').onclick = intentar;
    $('#snClave').onkeydown = e => { if(e.key === 'Enter') intentar(); };
    setTimeout(() => { const i = $('#snClave'); if(i) i.focus(); }, 250);
  }
  if($('#snBloquear')) $('#snBloquear').onclick = () => {
    nubeDesbloqueada = false; cerrarModal(); setTimeout(abrirSincronizacion, 150);
  };

  /* ---------------- conectar / cambiar de base ---------------- */
  if($('#fbConectar')) $('#fbConectar').onclick = () => {
    if(!nubeDesbloqueada) return toast('Configuración bloqueada.', 'err');
    const txt = $('#fbCfg').value.trim();
    if(!txt) return toast('Pegá la configuración de Firebase.', 'err');
    let cfgN;
    try{
      cfgN = JSON.parse(txt.replace(/^\s*(const|let|var)\s+\w+\s*=\s*/,'').replace(/;\s*$/,'')
        .replace(/([{,]\s*)([A-Za-z0-9_]+)\s*:/g,'$1"$2":').replace(/'/g,'"'));
    }catch(e){ return toast('No se pudo leer la configuración. Copiá el bloque completo, con las llaves.', 'err'); }
    if(!cfgN.databaseURL)
      return toast('Falta la línea databaseURL: creá la Realtime Database en Firebase y volvé a copiar el bloque.', 'err');

    const mudanza = conectada && cfg.databaseURL !== cfgN.databaseURL;
    const aplicar = () => {
      registrarCambioNube(conectada ? (mudanza ? 'cambiar' : 'actualizar') : 'conectar', cfgN);
      guardarConfigNube(cfgN);
      toast('Conectando…', 'ok');
      setTimeout(() => location.reload(), 800);
    };
    if(mudanza){
      confirmar('Cambiar de base de datos',
        'Vas a apuntar la aplicación a <b>'+esc(cfgN.projectId || cfgN.databaseURL)+'</b>, distinta de la actual. '+
        'Los socios pasarán a ver los datos de la base nueva. El cambio queda registrado a tu nombre.',
        aplicar, 'Cambiar de base', true);
    } else aplicar();
  };

  if($('#fbDesconectar')) $('#fbDesconectar').onclick = () => confirmar('Desconectar la base compartida',
    'La aplicación vuelve a guardar sólo en este dispositivo. Los datos ya sincronizados quedan en Firebase. '+
    'El cambio queda registrado a tu nombre.',
    () => {
      registrarCambioNube('desconectar', cfg);
      guardarConfigNube(null);
      setTimeout(() => location.reload(), 500);
    }, 'Desconectar', true);

  /* ---------------- copia de seguridad ---------------- */
  if($('#snRespaldo')) $('#snRespaldo').onclick = () => {
    if(!nubeDesbloqueada) return toast('Configuración bloqueada.', 'err');
    descargar('afaar-copia-'+hoyISO()+'.json',
      JSON.stringify({ app:'AFAAR', version:window.AFAR_BUILD,
                       generado:new Date().toISOString(), datos:DB }, null, 2),
      'application/json');
    auditar('respaldo', 'Descarga de copia de seguridad');
    toast('Copia descargada.', 'ok');
  };
  if($('#snRestaurar')) $('#snRestaurar').onclick = () => {
    if(!nubeDesbloqueada) return toast('Configuración bloqueada.', 'err');
    $('#bkArchivo').click();
  };

    const f = e.target.files[0]; if(!f) return;
    const fr = new FileReader();
    fr.onload = () => {
      try{
        const d = JSON.parse(fr.result);
        const datos = d.datos || d;
        confirmar('Restaurar copia',
          'Se fusionan los datos del archivo con los actuales. Los registros con el mismo identificador se sobrescriben.',
          () => {
            COLECCIONES.forEach(col => Object.keys(datos[col] || {})
              .forEach(id => escribir(col, id, datos[col][id])));
            auditar('restaurar', f.name);
            toast('Copia restaurada.', 'ok');
            cerrarModal(); refrescarVistaActual();
          }, 'Restaurar');
      }catch(err){ toast('El archivo no es una copia válida de AFAAR.', 'err'); }
    };
    fr.readAsText(f);
  };
}

/* =========================================================================
   PORTAL CONTABLE - AFAAR
   Acceso exclusivo del contador de la asociacion.

   NO accede a ningun dato clinico: trabaja unicamente sobre la proyeccion
   anonimizada que devuelve prestacionesContables() (ver core.js). No hay
   pacientes, ni cirugias, ni diagnosticos, ni valoraciones en este portal.
   ========================================================================= */

let contSeccion = 'panel';
let contDesde = '', contHasta = '', contUid = '', contInst = '';

const CONT_SECCIONES = [
  { id:'panel',      ico:'panel',        t:'Tablero' },
  { id:'cartera',    ico:'dinero',       t:'Cartera y deuda' },
  { id:'indexacion', ico:'stats',        t:'Indexación' },
  { id:'fiscal',     ico:'archivo',      t:'Situación fiscal' },
  { id:'consejos',   ico:'guias',        t:'Recomendaciones' },
  { id:'parametros', ico:'ajustes',      t:'Parámetros' }
];

/* ------------------------------------------------------------- Filtros */
function contPeriodo(){
  if(!contHasta) contHasta = mesDe(hoyISO());
  if(!contDesde) contDesde = sumarMeses(contHasta, -11);
  return { desde:contDesde, hasta:contHasta };
}
function contDatos(){
  const p = contPeriodo();
  let l = prestacionesContables().filter(x => x.mes >= p.desde && x.mes <= p.hasta);
  if(contUid)  l = l.filter(x => x.uid === contUid);
  if(contInst) l = l.filter(x => x.institucionId === contInst);
  return l;
}
/* Dias de antiguedad del saldo: desde la presentacion, o desde la prestacion */
function diasDeuda(x){
  const ref = x.fechaPresentacion || x.fecha;
  if(!ref) return 0;
  return Math.max(0, Math.round((Date.now() - new Date(ref + 'T12:00:00').getTime()) / 86400000));
}
function estaImpago(x){
  return x.saldo > 0 && ['Pendiente','Presentado','Facturado','Débito / rechazado'].indexOf(x.estado) >= 0;
}

/* Agrupa sumando devengado, cobrado, saldo e indexado */
function ctAgrupar(l, fn){
  const m = {};
  l.forEach(x => {
    const k = fn(x) || '—';
    if(!m[k]) m[k] = { t:k, n:0, devengado:0, cobrado:0, saldo:0, indexado:0 };
    m[k].n++; m[k].devengado += x.monto; m[k].cobrado += x.cobrado;
    if(estaImpago(x)){
      m[k].saldo += x.saldo;
      m[k].indexado += indexarSaldo(x.saldo, x.mes).actualizado;
    }
  });
  return Object.values(m).sort((a,b) => b.devengado - a.devengado);
}
function ctTablaGrupo(titulo, datos, col){
  if(!datos.length) return '';
  const tot = datos.reduce((a,d) => ({
    n:a.n+d.n, devengado:a.devengado+d.devengado, cobrado:a.cobrado+d.cobrado,
    saldo:a.saldo+d.saldo, indexado:a.indexado+d.indexado
  }), {n:0,devengado:0,cobrado:0,saldo:0,indexado:0});
  return '<div class="card"><h3>'+ico('filtro')+esc(titulo)+'</h3><div class="tabla-wrap"><table>'+
    '<thead><tr><th>'+esc(col)+'</th><th class="num">N.º</th><th class="num">Devengado</th>'+
    '<th class="num">Cobrado</th><th class="num">Adeudado</th><th class="num">A hoy</th>'+
    '<th class="num">Cobranza</th></tr></thead><tbody>'+
    datos.map(d => '<tr><td>'+esc(d.t)+'</td><td class="num">'+d.n+'</td>'+
      '<td class="num">'+fMoneda(d.devengado)+'</td>'+
      '<td class="num">'+fMoneda(d.cobrado)+'</td>'+
      '<td class="num'+(d.saldo?' ':'')+'">'+fMoneda(d.saldo)+'</td>'+
      '<td class="num">'+(d.saldo ? fMoneda(d.indexado) : '—')+'</td>'+
      '<td class="num">'+(d.devengado ? fNum(d.cobrado*100/d.devengado,0)+' %' : '—')+'</td></tr>').join('')+
    '<tr style="font-weight:800;background:var(--panel-2)"><td>TOTAL</td><td class="num">'+tot.n+'</td>'+
      '<td class="num">'+fMoneda(tot.devengado)+'</td><td class="num">'+fMoneda(tot.cobrado)+'</td>'+
      '<td class="num">'+fMoneda(tot.saldo)+'</td><td class="num">'+fMoneda(tot.indexado)+'</td>'+
      '<td class="num">'+(tot.devengado?fNum(tot.cobrado*100/tot.devengado,0)+' %':'—')+'</td></tr>'+
    '</tbody></table></div></div>';
}

/* Tramos de antiguedad */
const TRAMOS_DEUDA = [
  { t:'Al día (0 a 30 días)',   min:0,   max:30,   cls:'ok'     },
  { t:'31 a 60 días',           min:31,  max:60,   cls:''       },
  { t:'61 a 90 días',           min:61,  max:90,   cls:'warn'   },
  { t:'91 a 180 días',          min:91,  max:180,  cls:'warn'   },
  { t:'181 a 365 días',         min:181, max:365,  cls:'danger' },
  { t:'Más de un año',          min:366, max:1e9,  cls:'danger' }
];
function ctTablaAging(impagas){
  if(!impagas.length) return '<div class="vacio" style="padding:20px">'+ico('check')+
    '<b>Sin deuda pendiente</b><span>Todas las prestaciones del período están cobradas.</span></div>';
  const filas = TRAMOS_DEUDA.map(t => {
    const g = impagas.filter(x => { const d = diasDeuda(x); return d >= t.min && d <= t.max; });
    return { t:t, n:g.length, monto:g.reduce((a,x) => a + x.saldo, 0),
             indexado:g.reduce((a,x) => a + indexarSaldo(x.saldo, x.mes).actualizado, 0) };
  }).filter(f => f.n);
  const total = filas.reduce((a,f) => a + f.monto, 0);
  return '<div class="tabla-wrap"><table><thead><tr><th>Antigüedad</th><th class="num">N.º</th>'+
    '<th class="num">Nominal</th><th class="num">A hoy</th><th class="num">%</th></tr></thead><tbody>'+
    filas.map(f => '<tr><td><span class="tag '+f.t.cls+'">'+esc(f.t.t)+'</span></td>'+
      '<td class="num">'+f.n+'</td><td class="num">'+fMoneda(f.monto)+'</td>'+
      '<td class="num">'+fMoneda(f.indexado)+'</td>'+
      '<td class="num">'+(total?fNum(f.monto*100/total,0):'0')+' %</td></tr>').join('')+
    '</tbody></table></div>';
}

/* ---------------------------------------------------- 3. INDEXACION */
function ctIndexacion(){
  const l = contDatos().filter(estaImpago);
  const proy = proyeccionAnual(6);
  const kProy = proy ? Math.pow(1 + proy.mensual/100, 12) : 1;

  /* Por anestesiologo y por institucion, discriminado */
  const armar = fn => {
    const m = {};
    l.forEach(x => {
      const k = fn(x) || '—';
      const r = indexarSaldo(x.saldo, x.mes);
      if(!m[k]) m[k] = { t:k, n:0, nominal:0, hoy:0, perdida:0, proy:0, sinDato:0 };
      m[k].n++; m[k].nominal += x.saldo; m[k].hoy += r.actualizado;
      m[k].perdida += r.perdida; m[k].proy += r.actualizado * kProy;
      if(r.mesesSinDato) m[k].sinDato++;
    });
    return Object.values(m).sort((a,b) => b.nominal - a.nominal);
  };
  const tabla = (titulo, datos, col) => {
    if(!datos.length) return '';
    const t = datos.reduce((a,d) => ({ n:a.n+d.n, nominal:a.nominal+d.nominal, hoy:a.hoy+d.hoy,
      perdida:a.perdida+d.perdida, proy:a.proy+d.proy }), {n:0,nominal:0,hoy:0,perdida:0,proy:0});
    return '<div class="card"><h3>'+ico('stats')+esc(titulo)+'</h3><div class="tabla-wrap"><table>'+
      '<thead><tr><th>'+esc(col)+'</th><th class="num">N.º</th><th class="num">Nominal</th>'+
      '<th class="num">A hoy</th><th class="num">Pérdida</th><th class="num">Proyectado 12 m</th>'+
      '</tr></thead><tbody>'+
      datos.map(d => '<tr><td>'+esc(d.t)+(d.sinDato?' <span class="tag warn">IPC incompleto</span>':'')+'</td>'+
        '<td class="num">'+d.n+'</td><td class="num">'+fMoneda(d.nominal)+'</td>'+
        '<td class="num">'+fMoneda(d.hoy)+'</td>'+
        '<td class="num" style="color:var(--danger)">'+fMoneda(d.perdida)+'</td>'+
        '<td class="num">'+fMoneda(d.proy)+'</td></tr>').join('')+
      '<tr style="font-weight:800;background:var(--panel-2)"><td>TOTAL</td><td class="num">'+t.n+'</td>'+
        '<td class="num">'+fMoneda(t.nominal)+'</td><td class="num">'+fMoneda(t.hoy)+'</td>'+
        '<td class="num">'+fMoneda(t.perdida)+'</td><td class="num">'+fMoneda(t.proy)+'</td></tr>'+
      '</tbody></table></div></div>';
  };

  const faltantes = ctMesesSinIPC();

  return ''+
  (faltantes.length ? '<div class="aviso danger">'+ico('alerta')+'<div><b>'+
    (faltantes.length === 1 ? 'Falta 1 mes de IPC.' : 'Faltan '+faltantes.length+' meses de IPC.')+
    '</b><br>Sin ese dato la actualización queda subestimada. '+
    (faltantes.length === 1 ? 'Mes sin dato: ' : 'Meses sin dato: ')+
    esc(faltantes.slice(0,14).map(nombreMes).join(', '))+
    (faltantes.length>14?' y '+(faltantes.length-14)+' más':'')+
    '.<br>Cargalo en <b>Parámetros → Índice de precios</b>.</div></div>' : '')+

  (proy ? '<div class="aviso info">'+ico('stats')+'<div><b>Coeficiente de proyección anual: '+
    fNum((kProy-1)*100,1)+' %.</b><br>Surge de anualizar el promedio mensual de los últimos seis meses '+
    'cargados ('+fNum(proy.mensual,2)+' % mensual). Sirve para dimensionar cuánto vale hoy un saldo '+
    'que se cobre dentro de un año, no para pronosticar la inflación.</div></div>' : '')+

  tabla('Saldos indexados por anestesiólogo', armar(x => nombreUsuario(x.uid) || 'Sin asignar'), 'Profesional')+
  tabla('Saldos indexados por institución', armar(x => x.institucion), 'Institución')+
  tabla('Saldos indexados por financiador', armar(x => x.financiador), 'Financiador')+

  '<div class="card"><h3>'+ico('info')+'Cómo se calcula</h3>'+
    '<ul class="mini" style="padding-left:18px;line-height:1.9">'+
    '<li><b>Nominal:</b> el saldo tal como fue facturado.</li>'+
    '<li><b>A hoy:</b> el nominal multiplicado por el coeficiente de IPC acumulado desde el mes de la '+
      'prestación hasta el mes corriente. Se compone mes a mes: (1+i₁)×(1+i₂)×…</li>'+
    '<li><b>Pérdida:</b> la diferencia entre ambos. Es el poder adquisitivo que se resignó por cobrar tarde.</li>'+
    '<li><b>Proyectado 12 m:</b> el valor a hoy llevado doce meses más con la inflación proyectada. '+
      'Responde a «si esto se cobra recién dentro de un año, ¿cuánto habría que reclamar?».</li>'+
    '</ul></div>';
}
function ctMesesSinIPC(){
  const t = ipcTabla();
  const l = prestacionesContables().filter(estaImpago);
  if(!l.length) return [];
  const min = l.reduce((a,x) => (!a || x.mes < a) ? x.mes : a, '');
  const hoy = mesDe(hoyISO());
  const out = [];
  if(!min) return out;
  let m = sumarMeses(min, 1);
  while(m <= hoy){ if(!isFinite(Number(t[m]))) out.push(m); m = sumarMeses(m, 1); }
  return out;
}

/* ------------------------------------------------ 4. SITUACION FISCAL */
function ctFiscal(){
  const hasta = contPeriodo().hasta;
  const desde12 = sumarMeses(hasta, -11);
  const todo = prestacionesContables();
  const pf = paramsFiscales();

  const filas = socios().map(u => {
    const suyas = todo.filter(x => x.uid === u.uid);
    const anual = suyas.filter(x => x.mes >= desde12 && x.mes <= hasta)
                       .reduce((a,x) => a + x.monto, 0);
    const cobradoAnual = suyas.filter(x => x.mes >= desde12 && x.mes <= hasta)
                              .reduce((a,x) => a + x.cobrado, 0);
    const cat = categoriaMonotributo(anual);
    /* Ritmo de los ultimos 3 meses, anualizado */
    const ult3 = suyas.filter(x => x.mes > sumarMeses(hasta, -3) && x.mes <= hasta)
                      .reduce((a,x) => a + x.monto, 0);
    const ritmoAnual = ult3 * 4;
    const catProy = categoriaMonotributo(ritmoAnual);
    return { u:u, anual:anual, cobradoAnual:cobradoAnual, cat:cat,
             ritmoAnual:ritmoAnual, catProy:catProy };
  }).sort((a,b) => b.anual - a.anual);

  const vig = monotributoVigencia();
  const precargado = monotributoEsPrecargado();

  return ''+
  (precargado ? '<div class="aviso danger">'+ico('alerta')+'<div><b>Escala de monotributo sin confirmar.</b><br>'+
    'Está cargada la de referencia ('+esc(vig)+'). Las escalas se actualizan por semestre: '+
    'reemplazala por la vigente en <b>Parámetros → Monotributo</b> antes de tomar decisiones.</div></div>'
  : '<div class="aviso info">'+ico('check')+'<div>Escala en uso: <b>'+esc(vig)+'</b>.</div></div>')+

  '<div class="card"><h3>'+ico('archivo')+'Categorización por anestesiólogo</h3>'+
    '<p class="mini mb8">Ingresos brutos devengados de los últimos doce meses ('+nombreMes(desde12)+
    ' a '+nombreMes(hasta)+') contra los topes de la escala de locación de servicios.</p>'+
    (filas.length ? '<div class="tabla-wrap"><table><thead><tr>'+
      '<th>Profesional</th><th>CUIT</th><th>Condición</th><th class="num">Devengado 12 m</th>'+
      '<th class="num">Cobrado 12 m</th><th>Categoría</th><th class="num">Uso del tope</th>'+
      '<th class="num">Margen</th><th>Proyección</th></tr></thead><tbody>'+
      filas.map(f => {
        const cls = f.cat.excedido ? 'danger' : (f.cat.usoPct > 90 ? 'danger'
                   : (f.cat.usoPct > 75 ? 'warn' : 'ok'));
        const salto = !f.cat.excedido && f.catProy.cat !== f.cat.cat;
        return '<tr>'+
          '<td>'+esc(f.u.apellido+', '+f.u.nombre)+'</td>'+
          '<td>'+esc(f.u.cuit || '—')+'</td>'+
          '<td>'+esc(f.u.condicionIva || '—')+'</td>'+
          '<td class="num">'+fMoneda(f.anual)+'</td>'+
          '<td class="num">'+fMoneda(f.cobradoAnual)+'</td>'+
          '<td><span class="tag '+cls+'">'+esc(f.cat.cat)+'</span></td>'+
          '<td class="num">'+fNum(f.cat.usoPct,0)+' %</td>'+
          '<td class="num">'+(f.cat.excedido ? 'excedido' : fMoneda(f.cat.margen))+'</td>'+
          '<td>'+(f.cat.excedido
            ? '<span class="tag danger">Fuera de escala</span>'
            : (salto ? '<span class="tag warn">Iría a '+esc(f.catProy.cat)+'</span>'
                     : '<span class="tag ok">Estable</span>'))+'</td></tr>';
      }).join('')+
    '</tbody></table></div>'
    : '<div class="vacio">'+ico('usuario')+'<b>Sin anestesiólogos habilitados</b></div>')+
  '</div>'+

  '<div class="card"><h3>'+ico('alerta')+'Situaciones a resolver</h3>'+
    (() => {
      const av = [];
      filas.forEach(f => {
        if(f.cat.excedido) av.push(['danger', f.u.apellido+', '+f.u.nombre+' supera el tope máximo de la escala. '+
          'Corresponde evaluar el pase a responsable inscripto y la exclusión del régimen simplificado.']);
        else if(f.cat.usoPct > 90) av.push(['danger', f.u.apellido+', '+f.u.nombre+' usó el '+
          fNum(f.cat.usoPct,0)+' % del tope de la categoría '+f.cat.cat+'. Queda un margen de '+
          fMoneda(f.cat.margen)+'.']);
        else if(f.catProy.cat !== f.cat.cat && !f.catProy.excedido)
          av.push(['warn', f.u.apellido+', '+f.u.nombre+': al ritmo de los últimos tres meses '+
            'terminaría el año en categoría '+f.catProy.cat+' (hoy '+f.cat.cat+'). '+
            'Anticipar la recategorización.']);
        if(!f.u.cuit) av.push(['warn', f.u.apellido+', '+f.u.nombre+' no tiene CUIT cargado en su perfil. '+
          'Sin CUIT no se puede emitir el comprobante.']);
        if(!f.u.condicionIva) av.push(['warn', f.u.apellido+', '+f.u.nombre+
